      <div class="10-alumno-chip" id="10-alumno-chip-1"><span class="10-alumno-ic" style="display:inline-grid;place-items:center;width:56px;height:56px;border-radius:16px;background:#fbefd2;color:#9a6408;flex:none"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="bell-ring" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M22 8c0-2.3-.8-4.3-2-6"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/><path d="M4 2C2.8 3.7 2 5.7 2 8"/></svg></span><span>Aviso de límite</span></div>

<script>
(function () {
    var byId = function (id) { return document.getElementById('10-alumno-' + id); };
    var byCls = function (c, root) { return Array.prototype.slice.call((root || document).getElementsByClassName('10-alumno-' + c)); };

    function build() {
        var world = byId('world'), glow = byId('glow'), fig = byId('fig'), num = byId('n'), tank = byId('tank');
        var liq = byId('liq'), w1 = byId('w1'), w2 = byId('w2'), ok = byId('ok'), dot = byId('dot');
        var rc = byId('rc'), cb = byId('cb'), tr = byId('tr'), eb = byId('eb'), ebi = byId('ebi'), mk = byId('mk');
        var chip1 = byId('chip-1'), chip2 = byId('chip-2');
        var words = byCls('wd');

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines['10-alumno'] = tl;

/* ============================================================================================================
   BLOQUE CANONICO v2 (sonido + camara). Se PEGA TAL CUAL dentro del <script> de cada cuadro, justo despues de crear `tl`
   (var tl = gsap.timeline({ paused: true }); window.__timelines[ID_DEL_CUADRO] = tl;). No lo edites en el cuadro: edita este archivo.
   Es idempotente: pegarlo en varios cuadros (mismo window) redefine las mismas funciones.

   POR QUE EXISTE (contrato de sincronia v2, audit/sonido/REPORT.md 7): el instante de un sonido NO se escribe a mano. Se declara
   como ETIQUETA del timeline con la MISMA variable de tiempo que el tween que acompana, y los scripts lo derivan:
       extract-events.mjs --cues  ->  v2/sfx-cues.json (tiempos absolutos)  ->  mount-sfx.mjs (data-start = t - ancla del archivo)
   Uso tipico:
       var T = 1.05 + k * 0.3;                                                    // un solo numero para tween y sonido
       tl.fromTo(bx[k], { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.7)', data: 'hero' }, T);
       sfx(tl, T, 'ping-note' + (k + 1), 0.5);                                    // nombre del CATALOG.json; vol opcional
   Convenciones:
     - t es el instante del evento visual: inicio del tween de entrada (primer fotograma visible); para 'whoosh/swipe' el punto de
       maxima velocidad; para sonidos con anclaje 'fin' (riser, zoom-in) el instante en que ocurre el impacto/llegada (ver CATALOG.json).
     - `data: 'hero'` en un tween (entrada de un elemento principal, cambio de estado, contador, empuje de camara, trazo) le exige sonido:
       verify-sfx.mjs avisa de los hero sin etiqueta sfx a +-33 ms de su inicio. Las funciones cam* lo ponen solas.
     - Nunca llames a addLabel con nombres repetidos (GSAP sobrescribe): sfx() agrega un contador unico.
   ============================================================================================================ */
window.SFXN = window.SFXN || 0;   // contador unico de etiquetas (compartido por todos los cuadros de la pagina)
window.KEYN = window.KEYN || 0;   // rotacion de teclas (continua entre frases)

/* sfx(tl, t, nombre, vol) -> etiqueta 'sfx:<nombre>@<vol>#<n>' en el instante t. vol omitido = volDefecto del catalogo. */
function sfx(tl, t, nombre, vol) {
    tl.addLabel('sfx:' + nombre + '@' + (vol == null ? '' : vol) + '#' + (window.SFXN++), t);
    return t;
}

/* sfxType(tl, t0, tiempos, opciones) -> tiempos absolutos de las teclas que suenan.
   tiempos[i] = segundo (relativo a t0) en que se pinta el caracter i del texto (sale del mismo reloj que pinta el texto).
   opciones: texto ('Hola mundo': para detectar inicios de palabra; los espacios no suenan), vol (0.35), maxPorSeg (14),
             enter (true | segundo absoluto: agrega key-enter; true = 0.14 s tras la ultima tecla), borrados ([segundos absolutos]: key-back).
   Decima a <= 14 teclas/s: siempre suena la primera y la ultima; el acento (vol completo) va en inicios de palabra, las demas a 0.78.
   Rota key-1..8 sin repetir seguidas; una etiqueta por tecla (mount-sfx las hornea en un solo wav por frase, al milisegundo). */
function sfxType(tl, t0, tiempos, op) {
    op = op || {};
    var txt = op.texto || '', vol = op.vol == null ? 0.35 : op.vol, gap = 1 / (op.maxPorSeg || 14), k = [], i, c, p;
    var ult = -1;
    for (i = 0; i < tiempos.length; i++) if (!txt || txt.charAt(i) !== ' ') ult = i;
    for (i = 0; i < tiempos.length; i++) {
        if (txt && txt.charAt(i) === ' ') continue;
        c = { t: t0 + tiempos[i], ini: !!txt && (i === 0 || txt.charAt(i - 1) === ' '), ult: i === ult };
        p = k[k.length - 1];
        if (!p || c.t - p.t >= gap) k.push(c);
        else if (k.length > 1 && (c.ult || (c.ini && !p.ini))) k[k.length - 1] = c;   // la ultima y las iniciales desplazan a una tecla normal
        else if (c.ult) k.push(c);                                                       // solo hay una tecla antes: ambas suenan
    }
    var out = [];
    k.forEach(function (q, j) {
        var acento = j === 0 || q.ini || j === k.length - 1;
        sfx(tl, q.t, 'key-' + ((window.KEYN++ * 5) % 8 + 1), +(vol * (acento ? 1 : 0.78)).toFixed(3));
        out.push(q.t);
    });
    if (op.enter && k.length) sfx(tl, op.enter === true ? k[k.length - 1].t + 0.14 : op.enter, 'key-enter', +(vol * 1.1).toFixed(3));
    (op.borrados || []).forEach(function (tb) { sfx(tl, tb, 'key-back', vol); });
    return out;
}

/* sfxCount(tl, t0, t1, desde, hasta, opciones) -> tiempos absolutos de los 'tick'. Un tick por cambio de entero (el contador muestra
   Math.round(valor)), <= 12/s, 4 alturas crecientes (tick-1..4 segun el avance), el ultimo con acento (tick-4 a vol x1.5).
   opciones: ease ('power1.out': la MISMA ease del tween del contador; debe ser monotona), paso (1: valor entre ticks), vol (0.4), maxPorSeg (12). */
function sfxCount(tl, t0, t1, desde, hasta, op) {
    op = op || {};
    var ease = gsap.parseEase(op.ease || 'power1.out'), paso = op.paso || 1, vol = op.vol == null ? 0.4 : op.vol, gap = 1 / (op.maxPorSeg || 12);
    var span = Math.abs(hasta - desde), n = Math.floor(span / paso + 1e-9), ts = [], s, lo, hi, m, it;
    for (s = 1; s <= n; s++) {                       // instante en que el valor cruza (s - 0.5) pasos: se invierte la ease por biseccion
        lo = 0; hi = 1;
        for (it = 0; it < 32; it++) { m = (lo + hi) / 2; if (ease(m) * span < (s - 0.5) * paso) lo = m; else hi = m; }
        ts.push(t0 + hi * (t1 - t0));
    }
    var k = [];
    ts.forEach(function (t, j) {
        var p = k[k.length - 1];
        if (p === undefined || t - p >= gap) k.push(t);
        else if (j === ts.length - 1 && k.length > 1) k[k.length - 1] = t;           // el ultimo siempre suena
        else if (j === ts.length - 1) k.push(t);
    });
    k.forEach(function (t, j) {
        var ultimo = j === k.length - 1;
        sfx(tl, t, 'tick-' + (ultimo ? 4 : Math.min(3, Math.floor(4 * j / k.length)) + 1), +Math.min(1, vol * (ultimo ? 1.5 : 1)).toFixed(3));
    });
    return k;
}

/* readMark(tl, t, 'frase') -> etiqueta 'read:frase' en el instante en que una frase clave queda COMPLETA y legible. El director/verificador
   exige que el corte a otro cuadro llegue >= 0.9 s despues (tiempo de lectura). */
function readMark(tl, t, frase) {
    tl.addLabel('read:' + frase + '#' + (window.SFXN++), t);   // no se lee tl.labels: el compilador de render ejecuta el script con un timeline proxy sin esa propiedad
    return t;
}

/* ---- CAMARA con GSAP puro (seek-safe). Cada helper hace un fromTo con los valores de partida que recuerda en el elemento (el estado
   se encadena en el orden de las llamadas) e `immediateRender: false` SIEMPRE: sin eso el segundo fromTo sobre el mismo objetivo
   aplica su `from` en el fotograma 0 y pisa al primero (bug del cuadro 6: entraba a 1.6 y saltaba a 1.0). Devuelven el fin del tween.
   `el`: elemento o selector. Opciones comunes: dur, ease, foco [cx, cy] (punto de 1920x1080 que queda en el centro), x, y (px, pisan a foco),
   W, H (tamano de escena, 1920x1080), sfx (nombre del catalogo o false), vol. Todos los tweens llevan data: 'hero'. ---- */
function camInit(el, escala, x, y) {
    var e = typeof el === 'string' ? document.querySelector(el) : el;
    e.__cam = { s: escala == null ? 1 : escala, x: x || 0, y: y || 0, r: 0 };
    gsap.set(e, { transformOrigin: '50% 50%', scale: e.__cam.s, x: e.__cam.x, y: e.__cam.y, rotation: 0 });
}
function camTo(tl, el, t, a, o, dur0, ease0, sfx0) {
    o = o || {};
    var e = typeof el === 'string' ? document.querySelector(el) : el;
    if (!e.__cam) camInit(e, 1, 0, 0);
    var c = e.__cam, dur = o.dur == null ? dur0 : o.dur, W = o.W || 1920, H = o.H || 1080;
    var s = a.s == null ? c.s : a.s, x = a.x == null ? c.x : a.x, y = a.y == null ? c.y : a.y, r = a.r == null ? c.r : a.r;
    if (o.foco) { x = (W / 2 - o.foco[0]) * s; y = (H / 2 - o.foco[1]) * s; }
    if (o.x != null) x = o.x;
    if (o.y != null) y = o.y;
    tl.fromTo(e, { scale: c.s, x: c.x, y: c.y, rotation: c.r },
        { scale: s, x: x, y: y, rotation: r, duration: dur, ease: o.ease || ease0, immediateRender: false, data: 'hero' }, t);
    e.__cam = { s: s, x: x, y: y, r: r };
    var snd = o.sfx === undefined ? sfx0 : o.sfx;
    if (snd) sfx(tl, t, snd, o.vol);
    return t + dur;
}
/* camSnap: salto de zoom en ~0.18 s con ataque (snap-zoom). Suena 'snap' por defecto (sfx: false lo apaga). */
function camSnap(tl, el, t, escala, o) { return camTo(tl, el, t, { s: escala }, o, 0.18, 'power4.out', 'snap'); }
/* camPush: empuje lento (acercar). Sonido opcional: sfx(tl, fin, 'zoom-in') (anclaje 'fin': t = fin del tween). */
function camPush(tl, el, t, escala, o) { return camTo(tl, el, t, { s: escala }, o, 1.1, 'power2.inOut', null); }
/* camPull: alejar (escala por defecto 1) en ~0.7 s. */
function camPull(tl, el, t, escala, o) { return camTo(tl, el, t, { s: escala == null ? 1 : escala }, o, 0.7, 'power3.inOut', null); }
/* camPan: desplazamiento RELATIVO (dx, dy en px) respecto a la posicion actual, ~0.6 s. */
function camPan(tl, el, t, dx, dy, o) {
    var e = typeof el === 'string' ? document.querySelector(el) : el;
    var c = e.__cam || { x: 0, y: 0 };
    return camTo(tl, el, t, { x: c.x + (dx || 0), y: c.y + (dy || 0) }, o, 0.6, 'power3.inOut', null);
}
/* camTilt: inclinacion (rotacion en grados, absoluta) ~0.5 s; camTilt(tl, el, t, 0) la endereza. */
function camTilt(tl, el, t, grados, o) { return camTo(tl, el, t, { r: grados }, o, 0.5, 'power2.inOut', null); }
/* ============================ fin del bloque canonico v2 ============================ */

        /* ---------- tiempos del cuadro (locales; una sola variable por tween y sonido) ---------- */
        var T_FILL = 0.35, FILL_DUR = 1.00;          /* tanque y cifra: 0.35-1.35 */
        var T_LAND = T_FILL + FILL_DUR;              /* 1.35: aterriza el 88 % = chip, onda y golpe de camara */
        var T_COL = [1.50, 1.70, 1.90];              /* aparicion de cada grupo de columnas (asentamiento = +0.10) */
        var COL_SFX = ['pop-2', 'pop-4', 'pop-1'], COL_VOL = [0.38, 0.36, 0.38];
        var T_RC = 2.10;                             /* chip Racha de 7: aparicion; asentamiento +0.10 */
        var T_PAN = 2.30;
        var T_P1 = 2.35, T_P2 = 2.55;                /* pildoras: aparicion; asentamiento +0.10 */
        var T_TAP = 2.90;
        /* Los cues 'asent' iban al inicio del tween de asentamiento (aparicion + 0.10) y sonaban 67-117 ms despues del primer fotograma visible.
           Se adelantan 0.07 s (-> aparicion + 0.03): la etiqueta sigue a <= 33 ms del tween de APARICION y el sonido llega a +17..+50 ms del primer
           fotograma. Los tweens visuales no cambian. */
        var AVANCE_ASENT = 0.07;

        /* ---------- CAMARA: solo con los helpers (cam[] de la hoja) ---------- */
        camInit(world, 1.10, 374, 22);                                                                                   /* arranca al 1.10 con foco (620,520) */
        camTo(tl, world, 0.00, { s: 1 }, { foco: [960, 540], dur: 0.40, ease: 'power3.out', sfx: false });                /* PULL-BACK bajo el wipe */
        /* EMPUJE de escala visible mientras sube el 88 % (0.40-1.35): 1.00 -> 1.045 hacia el telefono y el titular a ~4.7 %/s medios (pico 7.4 %/s). Llega a su
           maximo justo en el aterrizaje. Es la unica escala perceptible entre 33.8 y 35.3 s abs, antes 5 s sin zoom
           (el pull-back de arranque ocurre bajo el wipe). Sin snap: los vecinos 09 y 11 ya lo usan. Foco (950,548): centro del telefono + titular
           (contenido x 175-1745), un poco por debajo del centro. Sin sonido propio: debajo suenan fill y ticks */
        camTo(tl, world, 0.40, { s: 1.045 }, { foco: [950, 548], dur: 0.95, ease: 'sine.inOut', sfx: false });
        /* GOLPE al aterrizar el 88 % (v2.3, sin rotacion): empuje diagonal corto (~42 px) y +3.5 % de escala en 0.16 s. A 1.08 con foco (985,530)
           el telefono (y 50-1010, x 330-800) y el contenido (x 175-1745) quedan enteros: ventana x 97-1873, y 30-1030. */
        camTo(tl, world, T_LAND, { s: 1.08 }, { foco: [985, 530], dur: 0.16, ease: 'power4.out', sfx: 'snap', vol: 0.4 });
        /* el regreso del golpe (1.51-1.91) devuelve la escala a 1.00: asienta la toma */
        camTo(tl, world, T_LAND + 0.16, { s: 1 }, { foco: [960, 540], dur: 0.40, ease: 'power3.inOut', sfx: false });
        /* PAN hacia las pildoras con un alejamiento a 0.96: en la retencion final el telefono (alto 960) queda con 70 px arriba y 89 abajo y
           el titular y las pildoras con holgura; a 1.00 el telefono dejaba 50/70 px */
        camTo(tl, world, T_PAN, { s: 0.96 }, { foco: [1040, 540], dur: 0.35, ease: 'power2.inOut', sfx: false });
        sfx(tl, 2.47, 'whoosh-m', 0.15);                                                                                  /* pico del pan (2.30 + 0.175) */

        /* ---------- ESCENA 1 (0.00-0.35): el telefono llega completo bajo el wipe; la columna derecha ya trae la etiqueta ---------- */
        /* derivas decorativas (sin informacion): el liquido ondula todo el cuadro y el resplandor respira */
        tl.fromTo(w1, { x: 0 }, { x: -268, duration: 4.03, ease: 'none' }, 0);
        tl.fromTo(w2, { x: -268 }, { x: 0, duration: 4.03, ease: 'none' }, 0);
        tl.fromTo(glow, { scale: 1 }, { scale: 1.05, duration: 4.03, ease: 'sine.inOut' }, 0);

        /* ---------- ESCENA 2 (0.35-1.35): tanque 0 -> 88 % y cifra 0 -> 88 con la misma ease ---------- */
        tl.fromTo(liq, { y: 182 }, { y: 19, duration: FILL_DUR, ease: 'power2.out', data: 'hero' }, T_FILL);
        sfx(tl, T_FILL, 'fill', 0.40);
        var cnt = { v: 0 };
        tl.fromTo(cnt, { v: 0 }, { v: 88, duration: FILL_DUR, ease: 'power2.out', data: 'hero',
            onUpdate: function () { num.textContent = String(Math.round(cnt.v)); } }, T_FILL);
        sfxCount(tl, T_FILL, T_LAND, 0, 88, { ease: 'power2.out', vol: 0.22 });
        /* la cifra crece de 0.62 a 1 hacia el final de la cuenta */
        tl.fromTo(fig, { scale: 0.62 }, { scale: 1, duration: FILL_DUR, ease: 'power2.in' }, T_FILL);

        /* etiqueta VISTA DEL ALUMNO: salta (sin sonido propio: debajo suenan el llenado y los ticks) */
        tl.fromTo(eb, { y: 0 }, { y: -14, duration: 0.14, ease: 'power2.out' }, 0.35);
        tl.fromTo(eb, { y: -14 }, { y: 0, duration: 0.18, ease: 'bounce.out', immediateRender: false }, 0.49);
        tl.fromTo(ebi, { scale: 0.45, opacity: 0 }, { scale: 1.22, opacity: 1, duration: 0.16, ease: 'power3.out' }, 0.35);   /* opacity 0 antes de 0.35: sin un icono minusculo bajo la barrida */
        tl.fromTo(ebi, { scale: 1.22 }, { scale: 1, duration: 0.24, ease: 'back.out(2)', immediateRender: false }, 0.51);

        /* titular por cascada de palabras desde el fin del solape (0.35, antes 0.40): una cada 0.07 s (antes 0.10), y 14 -> 0, blur 6 -> 0,
           0.22 s (completo a 0.87 s, antes 1.15 s). La mitad derecha estaba vacia hasta ~1 s; con el wipe no puede haber nada nuevo antes de 0.35 */
        var T_TIT = 0.35, PASO_TIT = 0.07;
        words.forEach(function (w, i) {
            tl.fromTo(w, { opacity: 0, y: 14, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.22, ease: 'power3.out' }, T_TIT + i * PASO_TIT);
        });
        /* marcador azul que se dibuja detras de "propia" (propia entra a 0.63; el marcador 0.22 s despues, con la palabra ya nitida) */
        tl.fromTo(mk, { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.30, ease: 'power3.out' }, 0.85);

        /* ---------- ESCENA 3 (1.35-1.65): aterriza el 88 % ---------- */
        tl.fromTo(ok, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1.12, duration: 0.10, ease: 'power2.out' }, T_LAND);
        tl.fromTo(ok, { scale: 1.12 }, { scale: 1, duration: 0.22, ease: 'back.out(2.4)', immediateRender: false }, T_LAND + 0.10);
        tl.fromTo(tank, { scale: 1 }, { scale: 1.06, duration: 0.10, ease: 'power2.out' }, T_LAND);
        tl.fromTo(tank, { scale: 1.06 }, { scale: 1, duration: 0.30, ease: 'elastic.out(1,0.5)', immediateRender: false }, T_LAND + 0.10);
        /* la superficie deja una onda: la amplitud sube y se calma */
        [w1, w2].forEach(function (w) {
            tl.set(w, { transformOrigin: '50% 100%' }, 0);
            tl.fromTo(w, { scaleY: 1 }, { scaleY: 2.4, duration: 0.12, ease: 'power2.out' }, T_LAND);
            tl.fromTo(w, { scaleY: 2.4 }, { scaleY: 1, duration: 0.55, ease: 'power2.inOut', immediateRender: false }, T_LAND + 0.12);
        });

        /* ---------- calendario de racha: 35 contornos y los cuadros se pueblan por columnas (aparicion + asentamiento) ---------- */
        var cells = byCls('ce', byId('grid'));
        cells.forEach(function (c, idx) {
            var b = c.getElementsByTagName('b')[0];
            if (!b) return;                                                  /* los pendientes se quedan en contorno */
            var col = Math.floor(idx / 5), row = idx % 5;
            var g = col < 3 ? 0 : (col < 5 ? 1 : 2);
            var t0 = T_COL[g] + (col - [0, 3, 5][g]) * 0.04 + row * 0.012;
            tl.fromTo(b, { opacity: 0, scale: 0 }, { opacity: 1, scale: 0.7, duration: 0.10, ease: 'power2.out' }, t0);
            tl.fromTo(b, { scale: 0.7 }, { scale: 1, duration: 0.20, ease: 'back.out(2.4)', immediateRender: false, data: (col === [0, 3, 5][g] && row === 0) ? 'hero' : undefined }, t0 + 0.10);
        });
        T_COL.forEach(function (t, g) { sfx(tl, t + 0.10 - AVANCE_ASENT, COL_SFX[g], COL_VOL[g]); });     /* asent adelantado: aparicion + 0.03 */

        /* chip Racha de 7 con la llama (relleno duotono ambar) */
        tl.fromTo(rc, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 0.7, duration: 0.10, ease: 'power2.out' }, T_RC);
        tl.fromTo(rc, { scale: 0.7 }, { scale: 1, duration: 0.24, ease: 'back.out(2.6)', immediateRender: false, data: 'hero' }, T_RC + 0.10);
        /* barrido de luz sobre el chip al asentarse (sustituye al sparkle-short de la v2.2): un solo sonido, mismo T que el barrido */
        var T_SH = T_RC + 0.10, sh = byId('sh');
        tl.fromTo(sh, { x: 0, opacity: 1 }, { x: 330, opacity: 1, duration: 0.30, ease: 'power1.inOut' }, T_SH);
        sfx(tl, T_SH, 'sheen-s', 0.32);

        /* ---------- pildoras: saltan una tras otra; el punto rojo de la campana late ---------- */
        [[chip1, T_P1, 'pop-3', 0.36], [chip2, T_P2, 'pop-2', 0.36]].forEach(function (p) {
            tl.fromTo(p[0], { opacity: 0, y: 30, scale: 0.8 }, { opacity: 1, y: 9, scale: 0.94, duration: 0.10, ease: 'power2.out' }, p[1]);
            tl.fromTo(p[0], { y: 9, scale: 0.94 }, { y: 0, scale: 1, duration: 0.26, ease: 'back.out(2.4)', immediateRender: false, data: 'hero' }, p[1] + 0.10);
            sfx(tl, p[1] + 0.10 - AVANCE_ASENT, p[2], p[3]);                                               /* asent adelantado */
        });
        tl.fromTo(dot, { scale: 1 }, { scale: 1.8, duration: 0.16, ease: 'power2.out' }, T_P1);
        tl.fromTo(dot, { scale: 1.8 }, { scale: 1, duration: 0.30, ease: 'power2.inOut', immediateRender: false }, T_P1 + 0.16);

        /* lectura completa: titular + pildoras (+0.60 s hasta el final util 3.45 s) */
        readMark(tl, 2.85, 'Cada alumno ve su propia asistencia. Aviso de límite · Proyección');

        /* ---------- cola de lectura (2.90-3.45): solo remates sin informacion nueva ---------- */
        /* tap visible a 1920x1080 (antes: hundimiento de 4 px, imperceptible, y el cue sonaba sobre imagen quieta): el boton se encoge al
           0.86 (-11 px) con rebote y un anillo azul nace y se expande; el cue 'tap' sigue pegado al inicio de este tween (T_TAP) */
        tl.fromTo(cb, { scale: 1 }, { scale: 0.86, duration: 0.08, ease: 'power2.out', data: 'hero' }, T_TAP);
        sfx(tl, T_TAP, 'tap', 0.30);
        tl.fromTo(cb, { scale: 0.86 }, { scale: 1, duration: 0.26, ease: 'back.out(2.6)', immediateRender: false }, T_TAP + 0.08);
        tl.fromTo(tr, { opacity: 0, scale: 1 }, { opacity: 0.6, scale: 1.12, duration: 0.06, ease: 'power2.out' }, T_TAP);
        tl.fromTo(tr, { opacity: 0.6, scale: 1.12 }, { opacity: 0, scale: 1.75, duration: 0.40, ease: 'power2.out', immediateRender: false }, T_TAP + 0.06);
        var flame = rc.getElementsByTagName('svg')[0];
        /* parpadeo de la llama solo con escala vertical (v2.3: sin giro; el ancla de la base evita que 'flote') */
        tl.set(flame, { transformOrigin: '50% 88%' }, 0);
        tl.fromTo(flame, { scaleY: 1 }, { scaleY: 1.22, duration: 0.07, ease: 'power2.out' }, T_TAP);
        tl.fromTo(flame, { scaleY: 1.22 }, { scaleY: 0.92, duration: 0.07, ease: 'power1.inOut', immediateRender: false }, T_TAP + 0.07);
        tl.fromTo(flame, { scaleY: 0.92 }, { scaleY: 1.12, duration: 0.06, ease: 'power1.inOut', immediateRender: false }, T_TAP + 0.14);
        tl.fromTo(flame, { scaleY: 1.12 }, { scaleY: 1, duration: 0.12, ease: 'power2.out', immediateRender: false }, T_TAP + 0.20);
        /* la campana de la pildora y la flecha de proyeccion se mueven un instante */
        var bellIc = chip1.getElementsByTagName('svg')[0], trendIc = chip2.getElementsByTagName('svg')[0];
        /* la campana ya no se balancea (v2.3): pulso de escala en el mismo tramo 3.00-3.46 s */
        tl.fromTo(bellIc, { scale: 1 }, { scale: 1.14, duration: 0.12, ease: 'power2.out' }, 3.00);
        tl.fromTo(bellIc, { scale: 1.14 }, { scale: 1, duration: 0.34, ease: 'back.out(2.6)', immediateRender: false }, 3.12);
        tl.fromTo(trendIc, { x: 0, y: 0 }, { x: 4, y: -4, duration: 0.14, ease: 'power2.out' }, 3.12);
        tl.fromTo(trendIc, { x: 4, y: -4 }, { x: 0, y: 0, duration: 0.22, ease: 'power2.inOut', immediateRender: false }, 3.26);
        tl.fromTo(ok, { scale: 1 }, { scale: 1.08, duration: 0.12, ease: 'power2.out', immediateRender: false }, 3.20);
        tl.fromTo(ok, { scale: 1.08 }, { scale: 1, duration: 0.18, ease: 'power2.inOut', immediateRender: false }, 3.32);

        /* ola decorativa por columnas en el calendario durante la cola de lectura: sin informacion nueva ni sonido propio,
           solo evita que el cuadro quede inerte mientras se lee la frase (el tap y la llama son demasiado pequenos para el medidor) */
        cells.forEach(function (c, idx) {
            var b = c.getElementsByTagName('b')[0];
            if (!b) return;
            var col = Math.floor(idx / 5), row = idx % 5, tw = 2.92 + col * 0.055 + row * 0.008;
            tl.fromTo(b, { scale: 1 }, { scale: 1.16, duration: 0.08, ease: 'power2.out', immediateRender: false }, tw);
            tl.fromTo(b, { scale: 1.16 }, { scale: 1, duration: 0.16, ease: 'power2.inOut', immediateRender: false }, tw + 0.08);
        });

        /* la duracion del timeline es exactamente la del plan */
        tl.set(world, {}, 4.03);
        num.textContent = '0';
    }

    /* gsap ya esta cargado (el <script> va antes de este bloque): el timeline se construye de forma sincrona, sin esperar a 'load' */
    build();
})();
</script>
