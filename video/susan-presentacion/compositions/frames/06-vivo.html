           tl.fromTo(bx[k], { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.7)', data: 'hero' }, T);

           maxima velocidad; para sonidos con anclaje 'fin' (riser, zoom-in) el instante en que ocurre el impacto/llegada (ver CATALOG.json).

         - Nunca llames a addLabel con nombres repetidos (GSAP sobrescribe): sfx() agrega un contador unico.
       ============================================================================================================ */
    window.SFXN = window.SFXN || 0;   // contador unico de etiquetas (compartido por todos los cuadros de la pagina)

                 enter (true | segundo absoluto: agrega key-enter; true = 0.14 s tras la ultima tecla), borrados ([segundos absolutos]: key-back).

        for (i = 0; i < tiempos.length; i++) {

    camTo(tl, world, 0.0333, { s: 1 }, { dur: 0.4667, ease: 'power4.out', foco: [960, 540], sfx: false }, 0.4667, 'power4.out');

    // =========================================================================

    ft(arcOk, { strokeDasharray: f2(C) + ' 0', strokeDashoffset: 0 },
        { strokeDasharray: f2(L_OK) + ' ' + f2(C), strokeDashoffset: f2(-S_OK), duration: 0.5, ease: 'power3.out', data: 'hero' }, T0, true);
    sfx(tl, T0, 'zoom-out', 0.28);
    ft(arcWarn, { strokeDasharray: '0.01 ' + f2(C), opacity: 0 }, { strokeDasharray: f2(L_WARN) + ' ' + f2(C), opacity: 1, duration: 0.3, ease: 'power2.out' }, 0.25, true);
    ft(arcBad, { strokeDasharray: '0.01 ' + f2(C), opacity: 0 }, { strokeDasharray: f2(L_BAD) + ' ' + f2(C), opacity: 1, duration: 0.2, ease: 'power2.out' }, 0.40, true);

    ft($('tile-check'), { scale: 1 }, { scale: 1.1, duration: 0.1, ease: 'power2.out' }, 0.10, true);
    ft($('tile-check'), { scale: 1.1 }, { scale: 1, duration: 0.25, ease: 'power2.inOut' }, 0.20);
    ft($('tile-clock'), { scale: 1 }, { scale: 1.1, duration: 0.1, ease: 'power2.out' }, 0.25, true);
    ft($('tile-clock'), { scale: 1.1 }, { scale: 1, duration: 0.25, ease: 'power2.inOut' }, 0.35);
    ft($('tile-userx'), { scale: 1 }, { scale: 1.1, duration: 0.1, ease: 'power2.out' }, 0.40, true);
