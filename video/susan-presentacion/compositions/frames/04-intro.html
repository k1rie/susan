        { id: 'L4', t: 0.78, y: 150, pop: 'pop-4' },
        { id: 'L5', t: 0.90, y: 150, pop: null }
    ];
    letras.forEach(function (l) {
        var el = $(l.id), Tap = l.t, Tas = +(l.t + 0.10).toFixed(2);
        tl.fromTo(el, { opacity: 0, y: l.y, filter: 'blur(12px)' },
            { opacity: 1, y: l.y * 0.3, filter: 'blur(4px)', duration: 0.10, ease: 'power1.out' }, Tap);
        tl.fromTo(el, { y: l.y * 0.3, filter: 'blur(4px)' },
            { y: 0, filter: 'blur(0px)', duration: 0.20, ease: 'power3.out', immediateRender: false, data: l.pop ? 'hero' : undefined }, Tas);
        if (l.pop) sfx(tl, Tas - AVANCE_ASENT, l.pop, 0.38);
    });

    /* ---- Tension: el brillo del fondo sube con el riser y estalla en el impacto ---- */
    tl.fromTo($('glow'), { opacity: 0, scale: 0.6 }, { opacity: 0.35, scale: 0.8, duration: 0.68, ease: 'power2.in' }, 0.52);
    tl.fromTo($('glow'), { opacity: 0.35, scale: 0.8 }, { opacity: 1, scale: 1.12, duration: 0.45, ease: 'power3.out', immediateRender: false }, 1.20);
    tl.to($('glow'), { opacity: 0.5, scale: 1, duration: 0.8, ease: 'power2.inOut' }, 1.65);

    /* ---- IMPACTO 1.20 s: el wordmark pulsa 1 -> 1.03 -> 1, los fondos pulsan y arranca el barrido por dentro de las letras ---- */
    sfx(tl, 1.20, 'riser-1s', 0.55);
    tl.fromTo($('word'), { scale: 1 }, { scale: 1.03, duration: 0.12, ease: 'power2.out', data: 'hero' }, 1.20);
    sfx(tl, 1.20, 'impact-hit', 0.80);
    tl.to($('word'), { scale: 1, duration: 0.50, ease: 'power3.out' }, 1.32);
    tl.fromTo($('drift'), { scale: 1 }, { scale: 1.05, duration: 0.12, ease: 'power2.out' }, 1.20);
    tl.to($('drift'), { scale: 1, duration: 0.6, ease: 'power3.out' }, 1.32);
    /* el barrido de luz recorre las letras de 1.20 a 2.04 s, pero la banda solo entra en el texto hacia 1.45 s: el tween arranca ahi
       (misma recta: 60.1 % -> 25 % hasta 2.04 s) y el 'sheen' se ancla a su primer fotograma visible con la misma variable T */
    var T_SHEEN = 1.45;
    tl.fromTo($('sweep'), { backgroundPosition: '60.1% 50%' },
        { backgroundPosition: '25% 50%', duration: +(2.04 - T_SHEEN).toFixed(2), ease: 'none', immediateRender: false, data: 'hero' }, T_SHEEN);
    sfx(tl, T_SHEEN, 'sheen', 0.30);

    /* (sin escudo ni píldora UNACH · FCA: en esta escena solo aparece el nombre) */

    /* ---- Eslogan: brillo suave (soft-in) y cascada de 6 palabras, una cada 0.12 s ---- */
    /* corte limpio a la escena del eslogan (crema) un instante antes de la primera palabra */
    tl.fromTo($('g'), { opacity: 0 }, { opacity: 1, duration: 0.001, ease: 'none' }, 2.18);
    sfx(tl, 2.18, 'soft-in', 0.25);
    var ticks = { 0: ['tick-1', 0.34], 1: ['tick-2', 0.34], 2: ['tick-3', 0.34], 5: ['tick-4', 0.42] };
    /* las palabras entran EXACTAMENTE cuando las dice la voz (instantes medidos de la alineación de ElevenLabs, v2/voz-alineacion.json) */
    var TW = [2.3, 2.93, 3.51, 3.99, 4.11, 4.19];
    for (var k = 0; k < 6; k++) {
        var Tw = TW[k];
        tl.fromTo($('w' + (k + 1)), { opacity: 0, y: 26, scale: 0.94 },
            { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: 'power3.out', data: ticks[k] ? 'hero' : undefined }, Tw);
        if (ticks[k]) sfx(tl, Tw, ticks[k][0], ticks[k][1]);
    }
    readMark(tl, 4.44, 'Asistencia académica, medida y a tiempo');

    /* ---- Remate vivo sin informacion nueva (3.44-3.74): el brillo pulsa una vez ---- */
    /* sin sonido: el pulso del brillo es decorativo (nada suena sobre imagen quieta). */
    /* cola de lectura: el wordmark respira 1 -> 1.03 en linea recta (sin rotacion) hasta el final para que la lectura no se congele */
    tl.fromTo($('word'), { scale: 1 }, { scale: 1.03, duration: 0.9, ease: 'none', immediateRender: false }, 3.3);
    tl.fromTo($('glowb'), { scale: 1 }, { scale: 1.14, duration: 0.15, ease: 'power2.out', immediateRender: false }, 3.44);
    tl.to($('glowb'), { scale: 1, duration: 0.15, ease: 'power2.inOut' }, 3.59);

    /* duracion exacta del plan (4.2 s) */
    tl.set({}, {}, 5.97);
  })();
</script>
