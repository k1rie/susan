    camTo(tl, world, 1.80, { s: 1 }, { foco: [1560, 540], dur: 0.25, ease: 'power4.inOut', sfx: false });          // WHIP-PAN
    sfx(tl, 1.925, 'whoosh-m', 0.55);                                                                                // pico de velocidad (mitad del inOut)
    camSnap(tl, world, 2.65, 1.10, { foco: [1470, 540], dur: 0.16, ease: 'power4.out', sfx: false });              // SNAP-ZOOM 2 (el golpe lo pone check)
    camTo(tl, world, 3.10, { s: 1 }, { foco: [1560, 540], dur: 0.35, ease: 'power3.out', sfx: false });            // PULL-BACK
    sfx(tl, 3.18, 'whoosh-s', 0.15);
    // EMPUJE FINAL (match con 06). El corte cae a mitad de fotograma (05 acaba en 19.05 s = fotograma 571.5): el ultimo fotograma que se
    // renderiza es el local 4.767-4.783, no el 4.80. Por eso el empuje LLEGA a s = 2 en 4.72 s (<= D - 2/30) y la camara se queda quieta
    // hasta el final: cualquier ultimo fotograma entre 4.733 y 4.80 muestra la misma imagen (anillo de 460 px en el centro). power3.in = la
    // velocidad maxima justo antes de llegar (la de la hoja); arranca en 4.48 para que el titular (el punto final de 'segundos.') siga entero
    // en encuadre hasta ~4.62 s (read_mark 4.0 + 0.6; medido: sale de cuadro cuando la escala pasa de ~1.19).
    var EMP_T = 4.48, EMP_D = 0.24;
    var EMP_FIN = camTo(tl, world, EMP_T, { s: 2 }, { foco: [1470, 540], dur: EMP_D, ease: 'power3.in', sfx: false });
    sfx(tl, EMP_FIN, 'whoosh-rev', 0.45);                                                                           // pico = llegada (el swell crece hasta el corte)

    // desenfoque de la whip (0 -> 14 -> 0 px): sube hasta el pico (1.925) y baja; el cuadro no se ve borroso fuera de los 0.25 s
    tl.fromTo(world, { filter: 'blur(0px)' }, { filter: 'blur(14px)', duration: 0.125, ease: 'power2.in', immediateRender: false }, 1.80);
    tl.to(world, { filter: 'blur(0px)', duration: 0.125, ease: 'power2.out' }, 1.925);
    // 'blur(0px)' NO equivale a 'none': mantiene el mundo en una capa propia y cambia el antialias del texto/anillo. Se quita al terminar la whip
    // para que el ultimo fotograma (match con 06) se rasterice igual que el primero de 06, que no lleva filtro.
    tl.set(world, { filter: 'none' }, 2.05);

    // ---------------------------------------------------------------- ENTRADA (0 - 0.40 s): todo esta en su sitio; el iris lo descubre
    tl.set($('ring'), { y: DROP }, 0);

    // punto rojo de grabacion (parpadeo discreto, empieza despues del solape de entrada)
    for (var j = 0; j < 9; j++) tl.set($('dot'), { opacity: j % 2 ? 1 : 0.3 }, 0.9 + j * 0.45);

    // ---------------------------------------------------------------- 0.40 - 0.90: barrida de escaneo
    tl.fromTo($('scan'), { y: 0 }, { y: 896, duration: 0.5, ease: 'power1.inOut', immediateRender: false, data: 'hero' }, 0.40);
    sfx(tl, 0.40, 'scan', 0.30);
    sfx(tl, 0.40, 'draw', 0.25);

    // ---------------------------------------------------------------- 0.45 - 2.01: ocho bloqueos (uno cada 0.18 s)
    for (var k = 0; k < 8; k++) {
        var T = 0.45 + k * 0.18;                                                    // un solo instante para tween y sonido
        tl.fromTo($('bx' + k), { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.22, ease: 'power4.out', data: 'hero' }, T);
        sfx(tl, T, 'ping-note' + (k + 1), 0.45);
        tl.fromTo($('fx' + k), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, T);
        tl.fromTo($('tg' + k), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(1.8)' }, T + 0.08);
        tl.fromTo($('bd' + k), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2.2)' }, T + 0.14);
        // su fila de la lista salta (y 24 -> 0) 0.05 s despues y el anillo suma uno
        tl.fromTo($('fl' + k), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.30, ease: 'power3.out' }, T + 0.05);
        // el marcador pendiente (barra gris, sin texto) se apaga al entrar la fila real: nunca se ve el nombre dos veces
        tl.fromTo($('row' + k).firstElementChild, { opacity: 1 }, { opacity: 0, duration: 0.10, ease: 'power1.in', immediateRender: false }, T + 0.05);
        tl.fromTo($('st' + k), { scale: 0.6 }, { scale: 1, duration: 0.25, ease: 'back.out(2)' }, T + 0.2);
        tl.set($('num'), { innerText: k + 1 }, T + 0.05);
        tl.fromTo($('rp'), { strokeDashoffset: k === 0 ? LEN + 16 : LEN * (1 - k / 24) },
            { strokeDashoffset: LEN * (1 - (k + 1) / 24), duration: 0.2, ease: 'power2.out', immediateRender: false }, T + 0.05);
    }

    // ---------------------------------------------------------------- 2.05 - 2.65: el anillo se llena 8 -> 24 (power2.in) y la cuenta corre
    tl.fromTo($('num'), { innerText: 8 }, { innerText: 24, snap: { innerText: 1 }, duration: 0.6, ease: 'power2.in', immediateRender: false, data: 'hero' }, 2.05);
    sfxCount(tl, 2.05, 2.65, 8, 24, { ease: 'power2.in', vol: 0.40 });
    tl.fromTo($('rp'), { strokeDashoffset: LEN * (1 - 8 / 24) }, { strokeDashoffset: 0, duration: 0.6, ease: 'power2.in', immediateRender: false }, 2.05);

    // ---------------------------------------------------------------- 2.30 - 2.60: chip "+16 mas" (aparicion 2.30, asentamiento 2.40)
    tl.fromTo($('more'), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 0.92, duration: 0.10, ease: 'power2.out' }, 2.30);
    tl.fromTo($('more'), { scale: 0.92 }, { scale: 1, duration: 0.22, ease: 'back.out(2.4)', immediateRender: false, data: 'hero' }, 2.40);
    sfx(tl, 2.40 - AVANCE_ASENT, 'pop-4', 0.40);                                                  // asentamiento (2.40) - AVANCE_ASENT

    // ---------------------------------------------------------------- 2.40 - 3.70: el titular se teclea (reloj lineal de caracteres)
    var K = [2.4, 2.46, 2.52, 2.58, 2.64, 2.7, 2.75, 2.81, 2.87, 2.93, 2.99, 3.05, 3.11, 3.17, 3.23, 3.29, 3.35, 3.4, 3.46, 3.52, 3.58, 3.64, 3.7];
    K.forEach(function (t, i) {
        tl.fromTo($('ch' + i), { opacity: 0 }, { opacity: 1, duration: 0.001, ease: 'none', immediateRender: false }, t);
        tl.set($('cr' + i), { opacity: 1 }, t);                                        // el cursor sigue al caracter recien escrito
        if (i < K.length - 1) tl.set($('cr' + i), { opacity: 0 }, K[i + 1]);
    });
    sfxType(tl, 0, K, { texto: 'Pasa lista en segundos.', vol: 0.28, maxPorSeg: 14 });
    // cursor: onda cuadrada de 0.3 s que arranca con la ultima tecla
    tl.set($('cr22'), { opacity: 0 }, 4.0);
    tl.set($('cr22'), { opacity: 1 }, 4.3);
    tl.set($('cr22'), { opacity: 0 }, 4.45);

    // ---------------------------------------------------------------- 2.65 - 2.95: ATERRIZA "24 / 24" (check); la lista se pliega en una pila de avatares
    tl.fromTo($('ring'), { y: DROP }, { y: 0, duration: 0.30, ease: 'power4.out', immediateRender: false, data: 'hero' }, 2.65);
    sfx(tl, 2.65, 'check', 0.50);
    tl.fromTo($('ringi'), { scale: 1 }, { scale: 1.07, duration: 0.14, ease: 'power2.out', immediateRender: false }, 2.65);
    tl.fromTo($('ringi'), { scale: 1.07 }, { scale: 1, duration: 0.30, ease: 'power2.inOut', immediateRender: false }, 2.79);
    tl.fromTo($('card'), { opacity: 1 }, { opacity: 0, duration: 0.18, ease: 'power2.in', immediateRender: false }, 2.65);
    for (var r = 0; r < 8; r++) {
        // cada fila viaja hacia el centro de la pila (y 745); su centro actual es 368 + 64 r + 32. La opacidad llega a 0 en 0.09 s (antes de que
        // la fila se acerque a la pila) y la pila aparece despues (2.79 s): nunca hay texto semitransparente sobre las caras.
        var tf = 2.65 + r * 0.006;
        tl.fromTo($('row' + r), { y: 0, scale: 1 }, { y: 745 - (400 + 64 * r), scale: 0.5, duration: 0.18, ease: 'power3.in', immediateRender: false }, tf);
        tl.fromTo($('row' + r), { opacity: 1 }, { opacity: 0, duration: 0.09, ease: 'power1.in', immediateRender: false }, tf);
        tl.fromTo($('pl' + r), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.22, ease: 'back.out(2)' }, 2.79 + r * 0.015);
    }
    tl.fromTo($('more'), { x: 0, y: 0 }, { x: 291, y: -175, duration: 0.30, ease: 'power3.inOut', immediateRender: false }, 2.68);
    // "lista" completa a 2.93: la pila late
    tl.fromTo($('pile'), { scale: 1 }, { scale: 1.04, duration: 0.10, ease: 'power2.out', immediateRender: false }, 2.93);
    tl.fromTo($('pile'), { scale: 1.04 }, { scale: 1, duration: 0.2, ease: 'power2.inOut', immediateRender: false }, 3.03);

    // ---------------------------------------------------------------- 2.80 - 3.30: el resplandor verde (un solo tono) florece detras del anillo
    // Sin sonido y sin data 'hero': es un resplandor que crece, no un barrido de luz, asi que el sheen-s no le correspondia.
    tl.fromTo($('glow'), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'power2.out' }, 2.80);

    // ---------------------------------------------------------------- 3.70 - 4.00: marcador azul sobre "segundos" + chip "listo en 6 s"
    tl.fromTo($('mk'), { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: 'power2.out', data: 'hero' }, 3.70);
    sfx(tl, 3.70, 'draw', 0.30);
    tl.fromTo($('chip'), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 0.92, duration: 0.10, ease: 'power2.out' }, 3.70);
    tl.fromTo($('chip'), { scale: 0.92 }, { scale: 1, duration: 0.22, ease: 'back.out(2.4)', immediateRender: false, data: 'hero' }, 3.80);
    sfx(tl, 3.80 - AVANCE_ASENT, 'pop-1', 0.40);                                                  // asentamiento (3.80) - AVANCE_ASENT
    readMark(tl, 4.0, 'Pasa lista en segundos. listo en 6 s');

    // el panel de la camara se apaga poco a poco (foco de lectura sobre el titular); lineal para que el movimiento sea continuo
    tl.fromTo($('dim'), { opacity: 0 }, { opacity: 1, duration: 0.8, ease: 'none', immediateRender: false }, 3.40);

    // ---------------------------------------------------------------- 4.00 - 4.50: cola de lectura (el anillo late; el brillo se apaga para que el match llegue limpio)
    tl.fromTo($('echo'), { opacity: 0.7, scale: 1 }, { opacity: 0, scale: 1.3, duration: 0.45, ease: 'power2.out', immediateRender: false }, 4.0);
    tl.fromTo($('glow'), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power1.inOut', immediateRender: false }, 4.1);

    // la camara ya llego en 4.72 s: este ancla (sin efecto visual) fija la duracion exacta del cuadro en 4.80 s, con 0.08 s de imagen quieta
    tl.set({}, {}, 5.17);
})();
</script>
