            /* ============================================================================================================
               BLOQUE CANONICO v2 (sonido + camara). Se PEGA TAL CUAL dentro del <script> de cada cuadro, justo despues de crear `tl`
               (var tl = gsap.timeline({ paused: true }); window.__timelines[ID_DEL_CUADRO] = tl;). No lo edites en el cuadro: edita este archivo.
               Es idempotente: pegarlo en varios cuadros (mismo window) redefine las mismas funciones.

               POR QUE EXISTE (contrato de sincronia v2, audit/sonido/REPORT.md 7): el instante de un sonido NO se escribe a mano. Se declara
               como ETIQUETA del timeline con la MISMA variable de tiempo que el tween que acompana, y los scripts lo derivan:
                   extract-events.mjs --cues  ->  v2/sfx-cues.json (tiempos absolutos)  ->  mount-sfx.mjs (data-start = t - ancla del archivo)
               Uso tipico:
                   var T = 1.05 + k * 0.3;                                                    // un solo numero para tween y sonido
                   tl.fromTo(bx[k], { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.7)', data: 'hero' }, T);
                   sfx(tl, T, 'ping-note' + (k + 1), 0.5);                                    // nombre del CATALOG.json; vol opcional
               Convenciones:
                 - t es el instante del evento visual: inicio del tween de entrada (primer fotograma visible); para 'whoosh/swipe' el punto de
                   maxima velocidad; para sonidos con anclaje 'fin' (riser, zoom-in) el instante en que ocurre el impacto/llegada (ver CATALOG.json).
                 - `data: 'hero'` en un tween (entrada de un elemento principal, cambio de estado, contador, empuje de camara, trazo) le exige sonido:
                   verify-sfx.mjs avisa de los hero sin etiqueta sfx a +-33 ms de su inicio. Las funciones cam* lo ponen solas.
                 - Nunca llames a addLabel con nombres repetidos (GSAP sobrescribe): sfx() agrega un contador unico.

            window.KEYN = window.KEYN || 0;   // rotacion de teclas (continua entre frases)

               Rota key-1..8 sin repetir seguidas; una etiqueta por tecla (mount-sfx las hornea en un solo wav por frase, al milisegundo). */

                var ult = -1;

                for (i = 0; i < tiempos.length; i++) {
                    if (txt && txt.charAt(i) === ' ') continue;

                    else if (c.ult) k.push(c);                                                       // solo hay una tecla antes: ambas suenan
                }

                for (s = 1; s <= n; s++) {                       // instante en que el valor cruza (s - 0.5) pasos: se invierte la ease por biseccion
                    lo = 0; hi = 1;
                    for (it = 0; it < 32; it++) { m = (lo + hi) / 2; if (ease(m) * span < (s - 0.5) * paso) lo = m; else hi = m; }

                ts.forEach(function (t, j) {

                    if (p === undefined || t - p >= gap) k.push(t);
                    else if (j === ts.length - 1 && k.length > 1) k[k.length - 1] = t;           // el ultimo siempre suena
                    else if (j === ts.length - 1) k.push(t);
                });

                    var ultimo = j === k.length - 1;
                    sfx(tl, t, 'tick-' + (ultimo ? 4 : Math.min(3, Math.floor(4 * j / k.length)) + 1), +Math.min(1, vol * (ultimo ? 1.5 : 1)).toFixed(3));
                });

            }

            /* readMark(tl, t, 'frase') -> etiqueta 'read:frase' en el instante en que una frase clave queda COMPLETA y legible. El director/verificador
               exige que el corte a otro cuadro llegue >= 0.9 s despues (tiempo de lectura). */
            function readMark(tl, t, frase) {
                tl.addLabel('read:' + frase + '#' + (window.SFXN++), t);   // no se lee tl.labels: el compilador de render ejecuta el script con un timeline proxy sin esa propiedad
                return t;
            }

            /* ---- CAMARA con GSAP puro (seek-safe). Cada helper hace un fromTo con los valores de partida que recuerda en el elemento (el estado
               se encadena en el orden de las llamadas) e `immediateRender: false` SIEMPRE: sin eso el segundo fromTo sobre el mismo objetivo
               aplica su `from` en el fotograma 0 y pisa al primero (bug del cuadro 6: entraba a 1.6 y saltaba a 1.0). Devuelven el fin del tween.
               `el`: elemento o selector. Opciones comunes: dur, ease, foco [cx, cy] (punto de 1920x1080 que queda en el centro), x, y (px, pisan a foco),
               W, H (tamano de escena, 1920x1080), sfx (nombre del catalogo o false), vol. Todos los tweens llevan data: 'hero'. ---- */
            function camInit(el, escala, x, y) {
                var e = typeof el === 'string' ? document.querySelector(el) : el;
                e.__cam = { s: escala == null ? 1 : escala, x: x || 0, y: y || 0, r: 0 };
                gsap.set(e, { transformOrigin: '50% 50%', scale: e.__cam.s, x: e.__cam.x, y: e.__cam.y, rotation: 0 });
            }
            function camTo(tl, el, t, a, o, dur0, ease0, sfx0) {
                o = o || {};
                var e = typeof el === 'string' ? document.querySelector(el) : el;
                if (!e.__cam) camInit(e, 1, 0, 0);
                var c = e.__cam, dur = o.dur == null ? dur0 : o.dur, W = o.W || 1920, H = o.H || 1080;
                var s = a.s == null ? c.s : a.s, x = a.x == null ? c.x : a.x, y = a.y == null ? c.y : a.y, r = a.r == null ? c.r : a.r;
                if (o.foco) { x = (W / 2 - o.foco[0]) * s; y = (H / 2 - o.foco[1]) * s; }
                if (o.x != null) x = o.x;
                if (o.y != null) y = o.y;
                tl.fromTo(e, { scale: c.s, x: c.x, y: c.y, rotation: c.r },
                    { scale: s, x: x, y: y, rotation: r, duration: dur, ease: o.ease || ease0, immediateRender: false, data: 'hero' }, t);
                e.__cam = { s: s, x: x, y: y, r: r };
                var snd = o.sfx === undefined ? sfx0 : o.sfx;
                if (snd) sfx(tl, t, snd, o.vol);

            }
            /* camSnap: salto de zoom en ~0.18 s con ataque (snap-zoom). Suena 'snap' por defecto (sfx: false lo apaga). */
            function camSnap(tl, el, t, escala, o) { return camTo(tl, el, t, { s: escala }, o, 0.18, 'power4.out', 'snap'); }
            /* camPush: empuje lento (acercar). Sonido opcional: sfx(tl, fin, 'zoom-in') (anclaje 'fin': t = fin del tween). */
            function camPush(tl, el, t, escala, o) { return camTo(tl, el, t, { s: escala }, o, 1.1, 'power2.inOut', null); }
            /* camPull: alejar (escala por defecto 1) en ~0.7 s. */
            function camPull(tl, el, t, escala, o) { return camTo(tl, el, t, { s: escala == null ? 1 : escala }, o, 0.7, 'power3.inOut', null); }
            /* camPan: desplazamiento RELATIVO (dx, dy en px) respecto a la posicion actual, ~0.6 s. */
            function camPan(tl, el, t, dx, dy, o) {
                var e = typeof el === 'string' ? document.querySelector(el) : el;
                var c = e.__cam || { x: 0, y: 0 };
                return camTo(tl, el, t, { x: c.x + (dx || 0), y: c.y + (dy || 0) }, o, 0.6, 'power3.inOut', null);
            }
            /* camTilt: inclinacion (rotacion en grados, absoluta) ~0.5 s; camTilt(tl, el, t, 0) la endereza. */
            function camTilt(tl, el, t, grados, o) { return camTo(tl, el, t, { r: grados }, o, 0.5, 'power2.inOut', null); }
            /* ============================ fin del bloque canonico v2 ============================ */

            var world = $('world'), deck = $('deck'), gA = $('ghost-a'), gB = $('ghost-b');
            var count = $('count'), countCol = $('count-col'), tile = $('tile');
            var casA = $('casel-a'), casB = $('casel-b'), stP = $('st-pend'), stO = $('st-ok'), check = $('check'), checkB = $('check-b');
            var ringA = $('ring-amb'), ringO = $('ring-ok'), bar = $('barfill'), num = $('num');
            var prim = $('prim'), out = $('out'), halo = $('halo'), layA = $('lay-a'), layB = $('lay-b');
            var r1 = $('r1'), r2 = $('r2'), cur = $('cursor'), hl = $('hl');
            var words = [$('w1'), $('w2'), $('w3'), $('w4'), $('w5')];

            /* Punta del cursor al hacer clic (coordenadas del mundo) y su desfase dentro del SVG de 60 px (la punta de mouse-pointer-2 esta en ~(10,10)) */
            var TX = 868, TY = 796, OX = 10, OY = 10;
            gsap.set(cur, { transformOrigin: OX + 'px ' + OY + 'px' });
            gsap.set(prim, { transformOrigin: '50% 50%' });
            gsap.set(deck, { transformOrigin: '960px 540px' });

            /* ---------- Camara (UN wrapper, solo helpers) ---------- */
            camInit(world, 1, 0, 0);
            /* GESTO NUEVO (familia 'empuje continuo', distinta del snap seco + pull-back de 05 y 09): la camara arranca ANTES del
               clic (0.20 s) y empuja de 1.00 a 1.07 con foco que migra hacia el boton y el cursor (sin rotacion: revision 2.3). Usa power1.inOut:
               velocidad cero justo en el clic (1.00 s), que es donde llega al maximo, asi el clic cae en el punto alto del gesto sin rebote
               brusco. A 1.07 y foco (935,625) el encuadre cubre x 46-1824 e y 125-1125: boton (500-900, 770-834), tarjeta (460-1460, 230-850) y chip
               'Pendientes' (1380,262) siempre dentro, sin recorte por rotacion. Sin sonido propio: el swish del cursor (0.62 s)
               cae justo en el pico de velocidad del empuje (0.20 + 0.80/2 = 0.60 s) y el golpe lo pone click-hard. */
            camTo(tl, world, 0.20, { s: 1.07 }, { foco: [935, 625], dur: 0.80, ease: 'power1.inOut', sfx: false }, 0.8, 'power1.inOut', null);
            /* regreso suave (1.00-2.00 s): la camara se aleja mientras la tarjeta sube y entra el titular; sin snap ni pull-back seco */
            camTo(tl, world, 1.00, { s: 1 }, { foco: [960, 540], dur: 1.00, ease: 'power2.inOut', sfx: false }, 1.0, 'power2.inOut', null);
            /* cierre de lectura: leve empuje hacia el titular (sin rotacion). Sustituye al pan diagonal (que repetia el pan de 08):
               2.15-3.00 s, ~6 %/s; a 1.05 y foco (965,610) el encuadre cubre x 51-1879 e y 96-1124: titular (y ~880) y la fila superior de la
               tarjeta (a y ~168 con la pila ya subida 94 px) dentro con >= 70 px de margen  */
            camTo(tl, world, 2.15, { s: 1.05 }, { foco: [965, 610], dur: 0.85, ease: 'power2.inOut', sfx: false }, 0.85, 'power2.inOut', null);

            /* ---------- 0.00-0.10: tarjeta completa y quieta (el destello de la transicion la descubre) ---------- */

            /* ---------- 0.10-0.40: la cola se desliza detras y aparece el chip "Pendientes" ---------- */
            tl.fromTo(deck, { y: 16 }, { y: 0, duration: 0.85, ease: 'power1.out' }, 0.10);     // la pila se asienta tras el destello (ya visible y completa en 0)
            tl.fromTo(gA, { x: 60 }, { x: 0, duration: 0.30, ease: 'power3.out' }, 0.10);
            tl.fromTo(gB, { x: 60 }, { x: 0, duration: 0.30, ease: 'power3.out' }, 0.12);
            tl.fromTo(count, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'power2.out' }, 0.10);

            /* ---------- 0.25-0.70: anillo ambar, barra y cifra de similitud llegan al 71 % con la misma ease que los ticks ---------- */
            var Tc = 0.25, Te = 0.70, N = { v: 0 }, easeC = gsap.parseEase('power2.out');
            var tk = sfxCount(tl, Tc, Te, 0, 71, { ease: 'power2.out', vol: 0.30 });
            /* La cifra avanza en tramos lineales que arrancan EXACTAMENTE en cada tick (pasan por la misma power2.out), para que cada sonido caiga en el inicio de un tween */
            var pts = [Tc].concat(tk, [Te]), valEn = function (t) { return 71 * easeC((t - Tc) / (Te - Tc)); };
            for (var q = 0; q < pts.length - 1; q++) {
                var a = q === 0 ? 0 : valEn(pts[q]), b = q === pts.length - 2 ? 71 : valEn(pts[q + 1]);
                tl.fromTo(N, { v: a }, { v: b, duration: pts[q + 1] - pts[q], ease: 'none', data: q === 1 ? 'hero' : undefined, immediateRender: q === 0,
                    onUpdate: function () { num.textContent = String(Math.round(N.v)); } }, pts[q]);
            }
            tl.fromTo(ringA, { strokeDashoffset: 105 }, { strokeDashoffset: 29, duration: 0.45, ease: 'power2.out' }, Tc);
            tl.fromTo(bar, { width: '0%' }, { width: '71%', duration: 0.45, ease: 'power2.out' }, Tc);

            /* ---------- 0.30-0.95: el cursor entra desde abajo a la derecha por una curva (x e y con eases distintos) ---------- */
            var Tm = 0.30;
            tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'none' }, Tm);
            tl.fromTo(cur, { x: 1560 - OX }, { x: TX - OX, duration: 0.65, ease: 'power2.inOut', data: 'hero' }, Tm);
            tl.fromTo(cur, { y: 1010 - OY }, { y: TY - OY, duration: 0.65, ease: 'power3.out' }, Tm);
            sfx(tl, 0.62, 'whoosh-s', 0.15);                                                                      // swish del cursor: pico de x (mitad de un inOut)

            /* ---------- 0.85-0.98: hover (el boton sube 2 % y aparece el aro de foco) ---------- */
            var Th = 0.85;
            tl.to(prim, { scale: 1.02, duration: 0.13, ease: 'power2.out', data: 'hero' }, Th);
            tl.fromTo(halo, { opacity: 0 }, { opacity: 1, duration: 0.13, ease: 'power2.out' }, Th);
            sfx(tl, Th, 'click-soft2', 0.30);

            /* ---------- 1.00-1.15: clic (cursor y boton se comprimen y vuelven con resorte) + onda ---------- */
            var Tk = 1.00;
            tl.to(prim, { scale: 0.94, duration: 0.06, ease: 'power1.in', data: 'hero' }, Tk);
            tl.to(cur, { scale: 0.94, duration: 0.06, ease: 'power1.in' }, Tk);
            sfx(tl, Tk, 'click-hard', 0.55);
            tl.to(prim, { scale: 1, duration: 0.40, ease: 'back.out(2)' }, Tk + 0.06);
            tl.to(cur, { scale: 1, duration: 0.40, ease: 'back.out(2)' }, Tk + 0.06);
            [[r1, Tk, 0.65], [r2, Tk + 0.08, 0.35]].forEach(function (r) {
                tl.fromTo(r[0], { scale: 0.3 }, { scale: 3.2, duration: 0.65, ease: 'power2.out' }, r[1]);
                tl.fromTo(r[0], { opacity: 0 }, { opacity: r[2], duration: 0.05, ease: 'none' }, r[1]);
                tl.to(r[0], { opacity: 0, duration: 0.60, ease: 'power2.out' }, r[1] + 0.05);
            });

            /* ---------- 1.06-1.50: la tarjeta cambia de estado de golpe ---------- */
            var Ts = 1.06;
            /* boton -> "Confirmado" (verde suave) */
            tl.to(prim, { backgroundColor: '#e3f4ea', duration: 0.001, ease: 'none' }, Ts);
            tl.to(layA, { opacity: 0, duration: 0.001, ease: 'none' }, Ts);
            tl.fromTo(layB, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: 'none' }, Ts);
            tl.fromTo(layB, { y: 12 }, { y: 0, duration: 0.30, ease: 'power3.out' }, Ts);
            tl.fromTo(checkB, { strokeDashoffset: 108 }, { strokeDashoffset: 0, duration: 0.30, ease: 'power2.out' }, Ts + 0.06);
            tl.to(halo, { opacity: 0, duration: 0.20, ease: 'power2.out' }, Ts);
            /* chip gris -> chip verde "Presente" con la palomita dibujada (1.06-1.40) */
            tl.to(stP, { opacity: 0, duration: 0.001, ease: 'none' }, Ts);
            tl.fromTo(stO, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: 'none' }, Ts);
            tl.fromTo(stO, { scale: 0.8 }, { scale: 1, duration: 0.34, ease: 'back.out(1.7)', data: 'hero' }, Ts);
            sfx(tl, Ts, 'check', 0.50);
            tl.fromTo(check, { strokeDashoffset: 108 }, { strokeDashoffset: 0, duration: 0.34, ease: 'power2.out' }, Ts);
            tl.to(casA, { opacity: 0, duration: 0.001, ease: 'none' }, Ts);
            tl.fromTo(casB, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: 'none' }, Ts);
            tl.fromTo(casB, { y: 12 }, { y: 0, duration: 0.30, ease: 'power3.out' }, Ts);
            /* anillo del avatar pasa a verde (1.10-1.50), baldosa y barra acompanan */
            tl.fromTo(ringO, { strokeDashoffset: 105 }, { strokeDashoffset: 0, duration: 0.40, ease: 'power2.out' }, 1.10);
            tl.to(tile, { backgroundColor: '#e3f4ea', color: '#1f7a47', duration: 0.30, ease: 'power2.out' }, 1.10);
            tl.to(bar, { backgroundColor: '#27a06a', duration: 0.30, ease: 'power2.out' }, 1.10);
            tl.to(out, { opacity: 0.4, duration: 0.25, ease: 'power2.out' }, 1.20);

            /* ---------- 1.30-1.70: la pila sube 70 px (la camara termina de alejarse suavemente) ---------- */
            tl.to(deck, { y: -70, duration: 0.40, ease: 'power3.out' }, 1.30);
            sfx(tl, 1.38, 'whoosh-s', 0.15);                                                                       // pico +0.08 s tras el inicio (ease out): ahora acompana la subida de la pila (visible, 70 px)
            tl.to(deck, { y: -94, duration: 1.70, ease: 'power1.inOut' }, 1.70);                                    // flotacion lenta: la pila sigue asentandose durante la lectura

            /* ---------- 1.50-2.15: el titular entra por cascada de palabras (14 -> 0 px, blur 6 -> 0, 0.25 s) ---------- */
            var Tw = [1.50, 1.60, 1.70, 1.80, 1.90], tickN = { 1.50: 'tick-1', 1.60: 'tick-2', 1.80: 'tick-3', 1.90: 'tick-4' };
            words.forEach(function (w, i) {
                var T = Tw[i];
                tl.fromTo(w, { opacity: 0, y: 14, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.25, ease: 'power2.out', data: 'hero' }, T);
                if (tickN[T]) sfx(tl, T, tickN[T], T === 1.90 ? 0.40 : 0.32);                                    // la palabra de 1.70 la cubre el blip del contador
            });
            readMark(tl, 2.15, 'Tú decides los casos dudosos.');

            /* ---------- 1.70-1.90: "Pendientes" cae de 3 a 2 (ya con el encuadre normal) y destello azul en el borde ---------- */
            var Tn = 1.70;
            tl.to(countCol, { y: -44, duration: 0.20, ease: 'power3.inOut', data: 'hero' }, Tn);
            sfx(tl, Tn, 'blip', 0.25);
            tl.to(count, { scale: 1.07, duration: 0.10, ease: 'power2.out' }, Tn);
            tl.to(count, { scale: 1, duration: 0.30, ease: 'back.out(2)' }, Tn + 0.10);
            tl.fromTo(count, { borderColor: '#e7e2dc' }, { borderColor: '#0061fe', duration: 0.10, ease: 'power2.out' }, Tn);
            tl.fromTo(count, { borderColor: '#0061fe' }, { borderColor: '#e7e2dc', duration: 0.40, ease: 'power2.out', immediateRender: false }, Tn + 0.12);

            /* ---------- 1.85-2.10: el marcador azul se dibuja bajo "decides" ---------- */
            tl.fromTo(hl, { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: 'power3.out' }, 1.85);

            /* ---------- 2.30-2.80: la cola avanza un paso, el caso siguiente sube y el cursor se aparta ---------- */
            tl.to(gB, { y: -18, duration: 0.20, ease: 'power2.out' }, 2.30);
            var Tg = 2.55;
            /* El sonido de un asentamiento se adelanta 0.07 s: la aparicion (primer fotograma visible) ocurre 0.10 s antes y el pop llegaba
               67-117 ms tarde; a inicio de aparicion + 0.03 s la etiqueta sigue a <= 33 ms del tween de aparicion. */
            var AVANCE_ASENT = 0.07;
            tl.to(gA, { y: -3, scaleX: 1.012, duration: 0.10, ease: 'power2.out' }, Tg);               // aparicion (70 % del recorrido)
            tl.to(gA, { y: -6, scaleX: 1.016, duration: 0.40, ease: 'back.out(2.2)', data: 'hero' }, Tg + 0.10);                    // asentamiento con resorte
            sfx(tl, Tg + 0.10 - AVANCE_ASENT, 'pop-1', 0.30);

            tl.set({}, {}, 3.71);
        })();
    </script>
