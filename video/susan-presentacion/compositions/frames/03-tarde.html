/* ============================ fin del bloque canonico v2 ============================ */

        /* ---------- tiempos del cuadro (locales; una sola variable por tween y sonido) ---------- */
        var T_CROSS = 1.52;   /* la barra toca el 20 %: inversa de power1.inOut para 6 -> 21.6 en 0.90-1.70 */
        var T_WORDS = 1.75;   /* corte interno: caen las palabras de la segunda línea */
        var T_CHIP = 2.00;    /* sello: aparición; el asentamiento arranca 0.10 s después */
        var T_SETTLE = 2.10;  /* asentamiento del sello = golpe, sacudida y cámara a 1.00 */
        var T_PULSE = 2.55;   /* remate decorativo sin información nueva */
        /* el sonido de un asentamiento se adelanta 0.07 s: la aparición (primer fotograma visible) ya ocurre 0.10 s antes y el stamp
           llegaba 67-117 ms tarde; a inicio de aparición + 0.03 s la etiqueta sigue a <= 33 ms del tween de aparición */
        var AVANCE_ASENT = 0.07;
        var T_RECOIL = 0.38;  /* duración del retroceso de cámara que arranca con el asentamiento del sello */
        var T_BACK = 2.60;    /* regreso de la cámara a 1.00 (termina en 2.98 s, antes del solape de salida de 3.10 s) */

        /* ---------- CÁMARA: solo con los helpers (cam[] de la hoja) ---------- */
        camInit(world, 1, 0, 0);
        /* apertura: empuje diagonal corto (x -40, y -30 px y +4 % de escala en 0.5 s, ~8 %/s) hacia la tarjeta; sustituye a la inclinación
           (ninguna rotación de cámara en todo el cuadro) y no repite el pan lateral de 02 */
        camTo(tl, world, 0.00, { s: 1.04, x: -40, y: -30 }, { dur: 0.5, ease: 'power3.out', sfx: false }, 0.5, 'power3.out', null);
        camTo(tl, world, 0.90, { s: 1.07 }, { foco: [960, 600], dur: 0.6, ease: 'power2.in', sfx: false });                  /* empuje de tensión */
        sfx(tl, 1.50, 'zoom-in', 0.22);                                                                                      /* el swell termina justo antes del cruce */
        /* GOLPE al cruzar el 20 %: escala brusca 1.07 -> 1.10 (+3 puntos en 0.10 s) con x +14 px, sin rotación; el aviso es color + sonido */
        camTo(tl, world, T_CROSS, { s: 1.10 }, { foco: [946.92, 600], x: 14, dur: 0.10, ease: 'power4.out', sfx: 'snap', vol: 0.4 });
        /* RECOIL sobre el sello: la cámara retrocede de 1.10 a 0.95 (-15 puntos en 0.38 s, ~39 %/s), sin inclinación. Es el primer
           alejamiento claro del video (los 11 s previos solo empujan hacia dentro) y entrega la dirección contraria antes del cuadro 04.
           Con ease out el retroceso arranca a velocidad máxima en el golpe del sello (el sonido del sello ya lo pone el chip). */
        camTo(tl, world, T_SETTLE, { s: 0.95 }, { foco: [960, 540], dur: T_RECOIL, ease: 'power3.out', sfx: false });
        /* regreso suave a 1.00 tras una breve pausa en el punto lejano (el remate del sello cae en esa pausa) */
        camTo(tl, world, T_BACK, { s: 1 }, { foco: [960, 540], dur: 0.38, ease: 'power2.inOut', sfx: false });

        /* ---------- ESCENA 1 (0.00-0.40): corte seco; la tarjeta ya está opaca y asienta de 0.96/+20 a 1/0 ---------- */
        tl.fromTo(card, { scale: 0.96, y: 20 }, { scale: 1, y: 0, duration: 0.25, ease: 'power4.out', data: 'hero' }, 0);

        /* titular tecleado: reloj lineal, 15 caracteres a 0.06 s desde 0.02 s (los espacios no pintan nada ni suenan) */
        var TXT = '...y las faltas', K = [], i, ci = [];
        for (i = 0; i < TXT.length; i++) K.push(+(0.02 + 0.06 * i).toFixed(2));
        for (i = 0; i < TXT.length; i++) if (TXT.charAt(i) !== ' ') ci.push(i);
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(carets, { opacity: 0 }, 0);
        ci.forEach(function (idx, j) {
            tl.set(chars[j], { opacity: 1 }, K[idx]);
            tl.set(carets[j], { opacity: 1 }, K[idx]);                                       /* el caret se reinicia en cada tecla */
            if (j < ci.length - 1) tl.set(carets[j], { opacity: 0 }, K[ci[j + 1]]);
        });
        var last = carets[carets.length - 1], tEnd = K[ci[ci.length - 1]];
        tl.set(last, { opacity: 0 }, tEnd + 0.3);                                            /* onda cuadrada de 0.3 s tras la última tecla */
        tl.set(last, { opacity: 1 }, tEnd + 0.6);
        tl.set(last, { opacity: 0 }, T_WORDS);                                               /* el corte interno lo retira */
        sfxType(tl, 0, K, { texto: TXT, vol: 0.30, maxPorSeg: 14 });

        /* filas fantasma: se deslizan +-12 px -> 0 escalonadas 0.10/0.18/0.26 s y sus barras empiezan a crecer */
        var gv = [{ v: 0 }, { v: 0 }, { v: 0 }];
        var paintG = function (k) {
            var r = rows[k], f = r.getElementsByClassName('03-tarde-gfill')[0], n = r.getElementsByClassName('03-tarde-gnum')[0];
            f.style.clipPath = 'inset(0% ' + (100 - gv[k].v / 25 * 100).toFixed(2) + '% 0% 0% round 7px)';
            n.firstChild.nodeValue = gv[k].v.toFixed(1);
        };
        var GT = [0.10, 0.18, 0.26], G1 = [6.0, 4.0, 5.0], G2 = [14.0, 16.0, 12.0], G3 = [16.5, 18.0, 13.5];
        rows.forEach(function (r, k) {
            tl.fromTo(r, { y: k === 0 ? -12 : 12 }, { y: 0, duration: 0.30, ease: 'power3.out', data: k === 0 ? 'hero' : undefined }, GT[k]);
            tl.fromTo(gv[k], { v: 0 }, { v: G1[k], duration: 0.55, ease: 'power2.out', onUpdate: paintG, onUpdateParams: [k] }, GT[k]);
            /* suben a 12-16 % mientras la tarjeta aprieta hacia el límite */
            tl.fromTo(gv[k], { v: G1[k] }, { v: G2[k], duration: 0.40, ease: 'power2.inOut', onUpdate: paintG, onUpdateParams: [k], immediateRender: false }, 1.20 + k * 0.02);
            /* cola: avanzan un poco más, sin información nueva */
            tl.fromTo(gv[k], { v: G2[k] }, { v: G3[k], duration: 0.90, ease: 'power1.inOut', onUpdate: paintG, onUpdateParams: [k], immediateRender: false }, 2.45 + k * 0.03);
        });
        sfx(tl, 0.10, 'soft-in', 0.28);
        /* la fila de arriba se atenúa: la tarjeta no está sola, pero tampoco compite con el titular */
        tl.fromTo(rows[0], { opacity: 0.3 }, { opacity: 0.14, duration: 0.40, ease: 'power2.out' }, 1.20);

        /* ---------- ESCENA 2: la barra y la cifra suben de 0 a 6.0 y de 6.0 a 21.6 (la pista va de 0 a 25 %) ---------- */
        var st = { v: 0 };
        var paint = function () {
            num.textContent = st.v.toFixed(1);
            fill.style.clipPath = 'inset(0% ' + (100 - st.v / 25 * 100).toFixed(2) + '% 0% 0% round 8px)';
        };
        tl.fromTo(st, { v: 0 }, { v: 6, duration: 0.45, ease: 'power2.out', onUpdate: paint, data: 'hero' }, 0.40);
        sfxCount(tl, 0.40, 0.85, 0, 6, { ease: 'power2.out', vol: 0.30 });
        tl.fromTo(st, { v: 6 }, { v: 21.6, duration: 0.80, ease: 'power1.inOut', onUpdate: paint, immediateRender: false, data: 'hero' }, 0.90);
        sfxCount(tl, 0.90, 1.70, 6, 22, { ease: 'power1.inOut', vol: 0.30 });
        /* la cifra crece mientras sube: mismo tiempo y misma ease que la cuenta */
        tl.fromTo(fig, { scale: 0.62 }, { scale: 1, duration: 0.80, ease: 'power1.inOut' }, 0.90);

        /* CRUCE del 20 %: barra, cifra y etiqueta pasan a rojo de golpe y la etiqueta pulsa */
        tl.set(fill, { backgroundColor: '#de4d44' }, T_CROSS);
        tl.set(num, { color: '#b3261e' }, T_CROSS);
        tl.set(pct, { color: '#b3261e' }, T_CROSS);
        tl.set(lim, { color: '#b3261e' }, T_CROSS);
        tl.set(ln, { borderLeftColor: '#b3261e' }, T_CROSS);
        tl.fromTo(lim, { scale: 1 }, { scale: 1.14, duration: 0.08, ease: 'power2.out', data: 'hero' }, T_CROSS);
        sfx(tl, T_CROSS, 'error-trim', 0.35);
        tl.fromTo(lim, { scale: 1.14 }, { scale: 1, duration: 0.16, ease: 'power2.inOut', immediateRender: false }, T_CROSS + 0.08);

        /* ---------- ESCENA 3: corte interno del titular, sello y sacudida ---------- */
        tl.fromTo(words, { opacity: 0, x: 56 }, { opacity: 1, x: 0, duration: 0.24, ease: 'power3.out', stagger: 0.07, data: 'hero' }, T_WORDS);
        sfx(tl, T_WORDS, 'pop-2', 0.40);

        /* sello: aparece a 2.00 y se asienta desde 2.10 (dos tweens: el golpe cae en el asentamiento) */
        tl.fromTo(chip, { scale: 0, y: -28, opacity: 0 }, { scale: 0.7, y: -8, opacity: 1, duration: 0.10, ease: 'power2.out' }, T_CHIP);
        tl.fromTo(chip, { scale: 0.7, y: -8 }, { scale: 1.07, y: 0, duration: 0.10, ease: 'power2.out', immediateRender: false, data: 'hero' }, T_SETTLE);
        sfx(tl, T_SETTLE - AVANCE_ASENT, 'stamp', 0.70);
        tl.fromTo(chip, { scale: 1.07 }, { scale: 1, duration: 0.18, ease: 'expo.out', immediateRender: false }, T_SETTLE + 0.10);
        tl.fromTo(card, { borderColor: '#e7e2dc' }, { borderColor: '#efb1ab', duration: 0.25, ease: 'power2.out' }, T_CHIP);

        /* empujón horizontal breve de la tarjeta (<= 6 px) al aterrizar el sello: el énfasis del rechazo es color + chip + sonido, sin sacudida fuerte */
        var shake = [[-6, 0.05], [5, 0.06], [-3, 0.06], [2, 0.06], [0, 0.07]], at = T_SETTLE, xs = 0;
        shake.forEach(function (s) {
            tl.fromTo(card, { x: xs }, { x: s[0], duration: s[1], ease: 'power1.out', immediateRender: false }, at);
            at += s[1]; xs = s[0];
        });

        /* lectura completa: titular + sello (+0.70 s hasta el final útil 3.10 s) */
        readMark(tl, 2.40, 'se notan tarde. Sin derecho a examen');

        /* remate: el sello pulsa una vez, ahora con amplitud visible (1 -> 1.09 = unos 18 px por lado a 1920x1080; antes 1.03 = 6 px y el
           tap sonaba sobre una imagen sin cambio). Cae en la pausa de la cámara en el punto lejano (2.48-2.60), de modo que se ve solo. */
        tl.fromTo(chip, { scale: 1 }, { scale: 1.09, duration: 0.10, ease: 'power2.out', immediateRender: false, data: 'hero' }, T_PULSE);
        sfx(tl, T_PULSE, 'tap', 0.28);
        tl.fromTo(chip, { scale: 1.09 }, { scale: 1, duration: 0.14, ease: 'power2.inOut', immediateRender: false }, T_PULSE + 0.10);

        /* cola de lectura: deriva lenta y lineal de toda la capa (sin información nueva; 18 px en 1.1 s) para que la lectura no se congele */
        tl.fromTo(layer, { x: 0 }, { x: 18, duration: 1.1, ease: 'none' }, 2.4);

        /* la duración del timeline es exactamente la del plan */
        tl.set(world, {}, 3.5);
        paint();
        rows.forEach(function (r, k) { paintG(k); });
    }

    if (window.gsap) {
        build();
    } else {
        byId('gsap').addEventListener('load', build);
    }
})();
</script>
</template>
