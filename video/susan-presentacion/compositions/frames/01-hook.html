            function camPull(tl, el, t, escala, o) { return camTo(tl, el, t, { s: escala == null ? 1 : escala }, o, 0.7, 'power3.inOut', null); }
            /* camPan: desplazamiento RELATIVO (dx, dy en px) respecto a la posicion actual, ~0.6 s. */
            function camPan(tl, el, t, dx, dy, o) {
                var e = typeof el === 'string' ? document.querySelector(el) : el;
                var c = e.__cam || { x: 0, y: 0 };
                return camTo(tl, el, t, { x: c.x + (dx || 0), y: c.y + (dy || 0) }, o, 0.6, 'power3.inOut', null);
            }
            /* camTilt: inclinacion (rotacion en grados, absoluta) ~0.5 s; camTilt(tl, el, t, 0) la endereza. */
            function camTilt(tl, el, t, grados, o) { return camTo(tl, el, t, { r: grados }, o, 0.5, 'power2.inOut', null); }
            /* ============================ fin del bloque canonico v2 ============================ */

            // ---- Camara: empuje que acelera con el tecleo -> seguimiento vertical -> snap-zoom sobre el marcador. ----
            // Los tres focos encuadran SIEMPRE la frase completa (linea 1 x 245-1570, linea 2 x 245-1010).
            camInit(world, 1, 0, 0);
            /* el empuje termina EXACTAMENTE en el salto de línea (ENTER): el seguimiento vertical parte de donde está la cámara, sin brinco */
            camTo(tl, world, 0, { s: 1.12 }, { foco: [900, 560], dur: ENTER, ease: 'power1.in', sfx: false }, ENTER, 'power1.in', null);
            camTo(tl, world, ENTER, { s: 1.12 }, { foco: [900, 624], dur: 0.25, ease: 'power3.out', sfx: false }, 0.25, 'power3.out', null);
            // El foco x del snap es 900 (no 800): a 1.22 la linea 1 (x 245-1570) acaba en 1773 px, con 147 px de margen al borde derecho
            // (con 800 'roba' terminaba en 1895, a 25 px del borde). Sigue conteniendo la linea 2 (x 161-1094 en pantalla).
            // (sin snap aquí: el único zoom del cuadro arranca en T_MARK y lleva a la siguiente escena; ver T_SALIDA)

            // Ventana de salida (3.20-3.50, la lectura ya termino): la camara empuja de 1.22 a 1.85 (x1.5) con foco en el INICIO de 'cada clase.'
            // (x 330) y ease 'out' (ataque inmediato: se mueve desde el primer fotograma, y cuando el zoom de la transicion acelera la camara ya hizo casi todo su recorrido). Asi el zoom in de la transicion (el saliente x2 en power3.in, que por si solo casi no se nota en los
            // 3 primeros fotogramas) CONTINUA un movimiento que ya venia con fuerza. El foco a la izquierda empuja el texto hacia la mitad
            // derecha: el anillo de 02 (x 200-760) entra sobre crema y no sobre 'cada clase.'. Sin sonido propio: lo pone el zoom-in de la transicion.
            var T_SALIDA = T_MARK; // el ÚNICO zoom: arranca cuando la frase queda completa y termina en el corte al cuadro 02
            // El zoom a "cada clase" ES la transición al cuadro 02: acelera (power3.in) hasta el corte seco y se desenfoca al final; el 02 entra
            // acercado y desenfocado sobre el cronómetro (misma zona de la pantalla) y se aleja: un solo movimiento continuo.
            camTo(tl, world, T_SALIDA, { s: 3.6 }, { foco: [430, 640], dur: 0.55, ease: 'power2.in', sfx: false });
            tl.fromTo(world, { filter: 'blur(0px)' }, { filter: 'blur(10px)', duration: 0.19, ease: 'power2.in', immediateRender: false }, T_SALIDA + 0.36);

            // ---- Texto: un solo reloj lineal para pintar texto y caret; las teclas suenan con los MISMOS tiempos. ----
            tl.to(reloj, { t: DUR, duration: DUR, ease: 'none', data: 'hero' }, 0);
            sfxType(tl, 0, soloCaracteres(K1), { texto: 'Pasar lista te roba', vol: 0.30, maxPorSeg: 14, enter: ENTER });
            sfxType(tl, 0, soloCaracteres(K2), { texto: 'cada clase.', vol: 0.30, maxPorSeg: 14 });

            // ---- Neblina: florece desde el fotograma 0 (0.2 -> 0.42) y pulsa con el golpe del marcador. ----
            var T_HAZE = 0;
            tl.fromTo(haze,
                { opacity: 0.2, scale: 0.86 },
                { opacity: 0.42, scale: 1, duration: 0.9, ease: 'power2.out', data: 'hero' },
                T_HAZE);
            sfx(tl, T_HAZE, 'soft-in', 0.30);

            // ---- Enter: el caret SALTA al inicio de la linea 2 (como al teclear de verdad). Antes volaba 0.25 s, pero ahora el tecleo sigue a
            // la voz y "cada" empieza a escribirse apenas 16 ms despues del Enter: el texto aparecia mientras el caret seguia en el aire. ----
            tl.fromTo(c2,
                { x: CARET_DX, y: -188 },
                { x: 0, y: 0, duration: 0.01, ease: 'none', data: 'hero' },
                ENTER);

            // ---- Golpe de 2.50: marcador azul + pulso de neblina (la frase ya esta completa y legible). ----
            tl.fromTo(bar,
                { scaleX: 0, skewX: -2 },
                { scaleX: 1, skewX: -2, duration: 0.24, ease: 'power3.out', data: 'hero' },
                T_MARK);
            sfx(tl, T_MARK, 'draw', 0.35);
            tl.fromTo(haze, { opacity: 0.42 }, { opacity: 0.6, duration: 0.15, ease: 'power2.out', immediateRender: false }, T_MARK);
            tl.fromTo(haze, { opacity: 0.6 }, { opacity: 0.42, duration: 0.15, ease: 'power2.inOut', immediateRender: false }, T_MARK + 0.15);

            // ---- Cola de lectura (2.74-3.20): solo remates decorativos, nada de informacion nueva. ----
            // Destello sobre el marcador y respiracion lenta de la neblina; ambos terminan antes de la ventana de salida (3.20).
            tl.fromTo(sheen, { x: 0 }, { x: 1180, duration: 0.36, ease: 'power1.inOut' }, T_MARK + 0.2);
            tl.fromTo(haze, { opacity: 0.42, scale: 1 }, { opacity: 0.52, scale: 1.1, duration: 0.5, ease: 'power1.inOut', immediateRender: false }, T_MARK + 0.25);

            readMark(tl, T_MARK, 'Pasar lista te roba cada clase.');
        })();
    </script>
