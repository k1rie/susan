  <script>
    (function () {
        var P = '08-reportes-';
        var $ = function (id) { return document.getElementById(P + id); };
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines['08-reportes'] = tl;

        /* ============================================================================================================
           BLOQUE CANONICO v2 (sonido + camara). Se PEGA TAL CUAL dentro del <script> de cada cuadro, justo despues de crear `tl`
           (var tl = gsap.timeline({ paused: true }); window.__timelines[ID_DEL_CUADRO] = tl;). No lo edites en el cuadro: edita este archivo.
           Es idempotente: pegarlo en varios cuadros (mismo window) redefine las mismas funciones.

           POR QUE EXISTE (contrato de sincronia v2, audit/sonido/REPORT.md 7): el instante de un sonido NO se escribe a mano. Se declara
           como ETIQUETA del timeline con la MISMA variable de tiempo que el tween que acompana, y los scripts lo derivan:
               extract-events.mjs --cues  ->  v2/sfx-cues.json (tiempos absolutos)  ->  mount-sfx.mjs (data-start = t - ancla del archivo)
           Uso tipico:
               var T = 1.05 + k * 0.3;                                                    // un solo numero para tween y sonido
               tl.fromTo(bx[k], { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.7)', data: 'hero' }, T);
               sfx(tl, T, 'ping-note' + (k + 1), 0.5);                                    // nombre del CATALOG.json; vol opcional
           Convenciones:
             - t es el instante del evento visual: inicio del tween de entrada (primer fotograma visible); para 'whoosh/swipe' el punto de
               maxima velocidad; para sonidos con anclaje 'fin' (riser, zoom-in) el instante en que ocurre el impacto/llegada (ver CATALOG.json).
             - `data: 'hero'` en un tween (entrada de un elemento principal, cambio de estado, contador, empuje de camara, trazo) le exige sonido:
               verify-sfx.mjs avisa de los hero sin etiqueta sfx a +-33 ms de su inicio. Las funciones cam* lo ponen solas.
             - Nunca llames a addLabel con nombres repetidos (GSAP sobrescribe): sfx() agrega un contador unico.
           ============================================================================================================ */
        window.SFXN = window.SFXN || 0;   // contador unico de etiquetas (compartido por todos los cuadros de la pagina)
        window.KEYN = window.KEYN || 0;   // rotacion de teclas (continua entre frases)

        /* sfx(tl, t, nombre, vol) -> etiqueta 'sfx:<nombre>@<vol>#<n>' en el instante t. vol omitido = volDefecto del catalogo. */
        function sfx(tl, t, nombre, vol) {
            tl.addLabel('sfx:' + nombre + '@' + (vol == null ? '' : vol) + '#' + (window.SFXN++), t);
            return t;
        }

        /* sfxType(tl, t0, tiempos, opciones) -> tiempos absolutos de las teclas que suenan.
           tiempos[i] = segundo (relativo a t0) en que se pinta el caracter i del texto (sale del mismo reloj que pinta el texto).
           opciones: texto ('Hola mundo': para detectar inicios de palabra; los espacios no suenan), vol (0.35), maxPorSeg (14),
                     enter (true | segundo absoluto: agrega key-enter; true = 0.14 s tras la ultima tecla), borrados ([segundos absolutos]: key-back).
           Decima a <= 14 teclas/s: siempre suena la primera y la ultima; el acento (vol completo) va en inicios de palabra, las demas a 0.78.
           Rota key-1..8 sin repetir seguidas; una etiqueta por tecla (mount-sfx las hornea en un solo wav por frase, al milisegundo). */
        function sfxType(tl, t0, tiempos, op) {
            op = op || {};
            var txt = op.texto || '', vol = op.vol == null ? 0.35 : op.vol, gap = 1 / (op.maxPorSeg || 14), k = [], i, c, p;
            var ult = -1;
            for (i = 0; i < tiempos.length; i++) if (!txt || txt.charAt(i) !== ' ') ult = i;
            for (i = 0; i < tiempos.length; i++) {
                if (txt && txt.charAt(i) === ' ') continue;
                c = { t: t0 + tiempos[i], ini: !!txt && (i === 0 || txt.charAt(i - 1) === ' '), ult: i === ult };
                p = k[k.length - 1];
                if (!p || c.t - p.t >= gap) k.push(c);
                else if (k.length > 1 && (c.ult || (c.ini && !p.ini))) k[k.length - 1] = c;   // la ultima y las iniciales desplazan a una tecla normal
                else if (c.ult) k.push(c);                                                       // solo hay una tecla antes: ambas suenan
            }
            var out = [];
            k.forEach(function (q, j) {
                var acento = j === 0 || q.ini || j === k.length - 1;
                sfx(tl, q.t, 'key-' + ((window.KEYN++ * 5) % 8 + 1), +(vol * (acento ? 1 : 0.78)).toFixed(3));
                out.push(q.t);
            });
            if (op.enter && k.length) sfx(tl, op.enter === true ? k[k.length - 1].t + 0.14 : op.enter, 'key-enter', +(vol * 1.1).toFixed(3));
            (op.borrados || []).forEach(function (tb) { sfx(tl, tb, 'key-back', vol); });
            return out;
        }

        /* sfxCount(tl, t0, t1, desde, hasta, opciones) -> tiempos absolutos de los 'tick'. Un tick por cambio de entero (el contador muestra
           Math.round(valor)), <= 12/s, 4 alturas crecientes (tick-1..4 segun el avance), el ultimo con acento (tick-4 a vol x1.5).
           opciones: ease ('power1.out': la MISMA ease del tween del contador; debe ser monotona), paso (1: valor entre ticks), vol (0.4), maxPorSeg (12). */
        function sfxCount(tl, t0, t1, desde, hasta, op) {
            op = op || {};
            var ease = gsap.parseEase(op.ease || 'power1.out'), paso = op.paso || 1, vol = op.vol == null ? 0.4 : op.vol, gap = 1 / (op.maxPorSeg || 12);
            var span = Math.abs(hasta - desde), n = Math.floor(span / paso + 1e-9), ts = [], s, lo, hi, m, it;
            for (s = 1; s <= n; s++) {                       // instante en que el valor cruza (s - 0.5) pasos: se invierte la ease por biseccion
                lo = 0; hi = 1;
                for (it = 0; it < 32; it++) { m = (lo + hi) / 2; if (ease(m) * span < (s - 0.5) * paso) lo = m; else hi = m; }
                ts.push(t0 + hi * (t1 - t0));
            }
            var k = [];
            ts.forEach(function (t, j) {
                var p = k[k.length - 1];
                if (p === undefined || t - p >= gap) k.push(t);
                else if (j === ts.length - 1 && k.length > 1) k[k.length - 1] = t;           // el ultimo siempre suena
                else if (j === ts.length - 1) k.push(t);
            });
            k.forEach(function (t, j) {
                var ultimo = j === k.length - 1;
                sfx(tl, t, 'tick-' + (ultimo ? 4 : Math.min(3, Math.floor(4 * j / k.length)) + 1), +Math.min(1, vol * (ultimo ? 1.5 : 1)).toFixed(3));
            });
            return k;
        }

        /* readMark(tl, t, 'frase') -> etiqueta 'read:frase' en el instante en que una frase clave queda COMPLETA y legible. El director/verificador
           exige que el corte a otro cuadro llegue >= 0.9 s despues (tiempo de lectura). */
        function readMark(tl, t, frase) {
            tl.addLabel('read:' + frase + '#' + (window.SFXN++), t);   // no se lee tl.labels: el compilador de render ejecuta el script con un timeline proxy sin esa propiedad
            return t;
        }

        /* ---- CAMARA con GSAP puro (seek-safe). Cada helper hace un fromTo con los valores de partida que recuerda en el elemento (el estado
           se encadena en el orden de las llamadas) e `immediateRender: false` SIEMPRE: sin eso el segundo fromTo sobre el mismo objetivo
           aplica su `from` en el fotograma 0 y pisa al primero (bug del cuadro 6: entraba a 1.6 y saltaba a 1.0). Devuelven el fin del tween.
           `el`: elemento o selector. Opciones comunes: dur, ease, foco [cx, cy] (punto de 1920x1080 que queda en el centro), x, y (px, pisan a foco),
           W, H (tamano de escena, 1920x1080), sfx (nombre del catalogo o false), vol. Todos los tweens llevan data: 'hero'. ---- */
        function camInit(el, escala, x, y) {
            var e = typeof el === 'string' ? document.querySelector(el) : el;
            e.__cam = { s: escala == null ? 1 : escala, x: x || 0, y: y || 0, r: 0 };
            gsap.set(e, { transformOrigin: '50% 50%', scale: e.__cam.s, x: e.__cam.x, y: e.__cam.y, rotation: 0 });
        }
        function camTo(tl, el, t, a, o, dur0, ease0, sfx0) {
            o = o || {};
            var e = typeof el === 'string' ? document.querySelector(el) : el;
            if (!e.__cam) camInit(e, 1, 0, 0);
            var c = e.__cam, dur = o.dur == null ? dur0 : o.dur, W = o.W || 1920, H = o.H || 1080;
            var s = a.s == null ? c.s : a.s, x = a.x == null ? c.x : a.x, y = a.y == null ? c.y : a.y, r = a.r == null ? c.r : a.r;
            if (o.foco) { x = (W / 2 - o.foco[0]) * s; y = (H / 2 - o.foco[1]) * s; }
            if (o.x != null) x = o.x;
            if (o.y != null) y = o.y;
            tl.fromTo(e, { scale: c.s, x: c.x, y: c.y, rotation: c.r },
                { scale: s, x: x, y: y, rotation: r, duration: dur, ease: o.ease || ease0, immediateRender: false, data: 'hero' }, t);
            e.__cam = { s: s, x: x, y: y, r: r };
            var snd = o.sfx === undefined ? sfx0 : o.sfx;
            if (snd) sfx(tl, t, snd, o.vol);
            return t + dur;
        }
        /* camSnap: salto de zoom en ~0.18 s con ataque (snap-zoom). Suena 'snap' por defecto (sfx: false lo apaga). */
        function camSnap(tl, el, t, escala, o) { return camTo(tl, el, t, { s: escala }, o, 0.18, 'power4.out', 'snap'); }
        /* camPush: empuje lento (acercar). Sonido opcional: sfx(tl, fin, 'zoom-in') (anclaje 'fin': t = fin del tween). */
        function camPush(tl, el, t, escala, o) { return camTo(tl, el, t, { s: escala }, o, 1.1, 'power2.inOut', null); }
        /* camPull: alejar (escala por defecto 1) en ~0.7 s. */
        function camPull(tl, el, t, escala, o) { return camTo(tl, el, t, { s: escala == null ? 1 : escala }, o, 0.7, 'power3.inOut', null); }
        /* camPan: desplazamiento RELATIVO (dx, dy en px) respecto a la posicion actual, ~0.6 s. */
        function camPan(tl, el, t, dx, dy, o) {
            var e = typeof el === 'string' ? document.querySelector(el) : el;
            var c = e.__cam || { x: 0, y: 0 };
            return camTo(tl, el, t, { x: c.x + (dx || 0), y: c.y + (dy || 0) }, o, 0.6, 'power3.inOut', null);
        }
        /* camTilt: inclinacion (rotacion en grados, absoluta) ~0.5 s; camTilt(tl, el, t, 0) la endereza. */
        function camTilt(tl, el, t, grados, o) { return camTo(tl, el, t, { r: grados }, o, 0.5, 'power2.inOut', null); }
        /* ============================ fin del bloque canonico v2 ============================ */


        var world = $('world');
        /* Los cues 'asent' iban al inicio del tween de asentamiento (aparicion + 0.10 s) y sonaban 67-117 ms despues del primer fotograma
           visible. Se adelantan 0.07 s: caen a aparicion + 0.03 s (<= 33 ms del tween de aparicion, que ya existe) y el sonido llega entre
           +17 y +50 ms del primer fotograma visible. Los tweens visuales no cambian. */
        var AVANCE_ASENT = 0.07;
        var btn = $('ex');

        /* Todas las estructuras que cambian de estado nacen ocultas con un set en 0 y entran con fromTo + immediateRender:false:
           asi un fromTo posterior sobre la misma propiedad nunca pisa el estado anterior (bug del cuadro 6 de la v1). */
        var FT = function (el, from, to, t) {
            to.immediateRender = false;
            return tl.fromTo(el, from, to, t);
        };

        /* ---------- Camara: sin snap-zoom y sin pull-back (revision 2.1) ----------
           DESVIACION respecto a la hoja del plan (cam[1] pull-back 1.12 -> 1.00, cam[2] pan diagonal del clic): 07, 08 y 09 repetian el mismo
           compas (gesto de entrada, pull-back a 1.0, golpe/pan diagonal a la derecha y abajo, regreso). Aqui 08 pasa a otra familia: se queda
           en 1.12 (encuadra la tarjeta y el boton completos: x 103-1817), sigue al cursor con un pan lateral hacia el boton y responde al
           clic con un empuje 1.12 -> 1.16 (sin rotacion, revision 2.3) con foco que baja hacia el aviso
           (1040,600). Regresa suave a 1.12 centrado al terminar el aviso 'CSV listo'. El contenido clave (boton x 1330-1620, aviso en
           (1500,850), nombres desde x 340) queda dentro del encuadre en todo momento. */
        camInit(world, 1.12, 0, 179.2);                                                  // foco (960,380) a escala 1.12
        camTo(tl, world, 0.35, { s: 1.12 }, { foco: [960, 560], dur: 0.55, ease: 'power2.out' });   // pan de seguimiento: y 179.2 -> -22.4
        camTo(tl, world, 1.40, { s: 1.12 }, { foco: [1085, 520], dur: 0.65, ease: 'power2.inOut' }); // sigue al cursor hacia el boton (x -140, y 22)
        camTo(tl, world, 2.05, { s: 1.16 }, { foco: [1060, 540], dur: 0.16, ease: 'power4.out' });   // EMPUJE en el clic (sin rotacion)
        camTo(tl, world, 2.21, { s: 1.16 }, { foco: [1040, 600], dur: 0.44, ease: 'power2.inOut' });  // el foco baja hacia el aviso mientras llega el archivo
        camTo(tl, world, 3.10, { s: 1.12 }, { foco: [960, 540], dur: 0.35, ease: 'power2.out' });     // regreso suave tras el aviso

        /* ---------- Estados iniciales (la tarjeta, el encabezado y las 5 filas con avatar y nombre ya estan completos en 0) ---------- */
        var fills = [], nums = [], FALTAS = [2, 3, 7, 4, 8];
        for (var i = 0; i < 5; i++) { fills.push($('fill-' + (i + 1))); nums.push($('num-' + (i + 1))); }
        tl.set(fills, { clipPath: 'inset(0% 100% 0% 0%)' }, 0);
        tl.set($('mk'), { clipPath: 'inset(0% 0% 100% 0%)' }, 0);
        tl.set($('mkl'), { opacity: 0, scale: 0.6 }, 0);
        tl.set([$('chip-3'), $('chip-5')], { opacity: 0, scale: 0.4 }, 0);
        tl.set([$('hl-3'), $('hl-5')], { opacity: 0 }, 0);
        tl.set($('ti'), { opacity: 0, y: 34, scale: 0.94 }, 0);
        tl.set($('ic-tick').querySelector('path'), { strokeDashoffset: 108 }, 0);
        tl.set([$('rp-1'), $('rp-2')], { opacity: 0, scale: 0.3 }, 0);
        tl.set($('file'), { opacity: 0, x: 1435, y: 201, scale: 0.55, transformOrigin: '50% 50%' }, 0);   // centro del boton (1471,237) - 36
        tl.set($('cu'), { opacity: 0, x: 930, y: 575 }, 0);                                                              // punta en (940,585)
        tl.set($('ex-b'), { y: 64 }, 0);                                                                                 // la etiqueta "Exportado" espera debajo del boton (overflow oculto)

        /* ---------- 0.35-1.10: las barras se llenan en cascada (fila i a 0.35 + 0.075 (i-1), 0.45 s power3.out) y las cifras cuentan ---------- */
        var BARRAS = 0.35;
        for (var r = 0; r < 5; r++) {
            var Tb = BARRAS + 0.075 * r;
            var o = { v: 0 };
            FT(fills[r], { clipPath: 'inset(0% 100% 0% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.45, ease: 'power3.out', data: (r === 0 ? 'hero' : undefined) }, Tb);
            (function (num, f, obj) {
                tl.fromTo(obj, { v: 0 }, {
                    v: 1, duration: 0.45, ease: 'power3.out',
                    onUpdate: function () { num.textContent = String(Math.round(obj.v * f)); }
                }, Tb);
            })(nums[r], FALTAS[r], o);
        }
        var ticks = sfxCount(tl, 0.35, 1.10, 0, 12, { ease: 'power3.out', vol: 0.30 });
        /* el ultimo tick (acento) cae cuando la cuenta se asienta: las cifras dan un pulso en ese mismo instante, asi el sonido tiene su tween */
        var Tk = ticks[ticks.length - 1];
        FT(nums, { scale: 1 }, { scale: 1.12, duration: 0.10, ease: 'power2.out' }, Tk);
        FT(nums, { scale: 1.12 }, { scale: 1, duration: 0.25, ease: 'back.out(2)' }, Tk + 0.10);

        /* ---------- 0.70-1.05: la marca discontinua del 20 % se dibuja de arriba a abajo ---------- */
        var Tm = 0.70;
        FT($('mk'), { clipPath: 'inset(0% 0% 100% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.35, ease: 'power2.inOut', data: 'hero' }, Tm);
        sfx(tl, Tm, 'draw', 0.35);
        FT($('mkl'), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(2)' }, Tm);

        /* ---------- 0.95-1.25: chip "En el limite" (VN): aparicion 0.95, asentamiento 1.05, la fila se tine ambar ---------- */
        var Tv = 1.05;
        FT($('chip-3'), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 0.78, duration: 0.10, ease: 'power2.out' }, 0.95);
        FT($('chip-3'), { scale: 0.78 }, { scale: 1, duration: 0.30, ease: 'back.out(2.4)', data: 'hero' }, Tv);
        sfx(tl, Tv - AVANCE_ASENT, 'pop-2', 0.40);
        FT($('hl-3'), { opacity: 0 }, { opacity: 1, duration: 0.30, ease: 'power2.out' }, 0.95);
        FT($('num-3'), { color: '#1e1919' }, { color: '#9a6408', duration: 0.25, ease: 'none' }, 0.95);

        /* ---------- 1.15-1.45: chip "Sin derecho" (HM): aparicion 1.15, asentamiento 1.25, la fila se tine roja y su barra pasa del 20 % ---------- */
        var Th = 1.25;
        FT($('chip-5'), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 0.78, duration: 0.10, ease: 'power2.out' }, 1.15);
        FT($('chip-5'), { scale: 0.78 }, { scale: 1, duration: 0.30, ease: 'back.out(2.4)', data: 'hero' }, Th);
        sfx(tl, Th - AVANCE_ASENT, 'pop-1', 0.45);
        FT($('hl-5'), { opacity: 0 }, { opacity: 1, duration: 0.30, ease: 'power2.out' }, 1.15);
        FT($('num-5'), { color: '#1e1919' }, { color: '#b3261e', duration: 0.25, ease: 'none' }, 1.15);
        FT($('num-5'), { scale: 1 }, { scale: 1.16, duration: 0.14, ease: 'power2.out' }, 1.25);
        FT($('num-5'), { scale: 1.16 }, { scale: 1, duration: 0.30, ease: 'back.out(2)' }, 1.39);
        /* el segmento rojo de HM da un pulso al aterrizar el chip: se nota que su barra pasa de la marca del 20 % */
        FT($('seg-hm'), { scaleY: 1 }, { scaleY: 1.7, duration: 0.14, ease: 'power2.out' }, Th);
        FT($('seg-hm'), { scaleY: 1.7 }, { scaleY: 1, duration: 0.32, ease: 'back.out(2)' }, Th + 0.14);

        /* ---------- 1.40-2.00: el cursor sale del centro de la tabla y vuela en curva hacia "Exportar CSV" ----------
           x: acelera 0.15 s (power2.in) y frena 0.45 s (power3.out): el pico de velocidad cae en 1.55 (whoosh); y: arranca despues y llega con ease inOut, asi la trayectoria curva por debajo de la etiqueta del 20 %.
           Punta del cursor (caja 60 px, punta en (10,10)): (940,585) -> (1530,252). */
        var Tf = 1.55;
        FT($('cu'), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: 'power1.out' }, 1.40);
        FT($('cu'), { x: 930 }, { x: 1127, duration: 0.15, ease: 'power2.in' }, 1.40);
        FT($('cu'), { x: 1127 }, { x: 1520, duration: 0.45, ease: 'power3.out', data: 'hero' }, Tf);
        FT($('cu'), { y: 575 }, { y: 242, duration: 0.50, ease: 'power2.inOut' }, 1.40);
        sfx(tl, Tf, 'whoosh-s', 0.20);

        /* ---------- 1.80-1.93: hover, el boton sube 2 % y aparece el aro de foco ---------- */
        var Tw = 1.80;
        FT(btn, { scale: 1 }, { scale: 1.02, duration: 0.13, ease: 'power2.out', data: 'hero' }, Tw);
        sfx(tl, Tw, 'click-soft2', 0.28);
        FT($('ring'), { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.13, ease: 'power2.out' }, Tw);

        /* ---------- 2.05-2.20: CLIC (press-release-spring) + onda desde el centro del boton; la camara responde con el pan diagonal ---------- */
        var Tc = 2.05;
        FT($('cu'), { scale: 1 }, { scale: 0.82, duration: 0.08, ease: 'power2.in', data: 'hero' }, Tc);
        FT($('cu'), { scale: 0.82 }, { scale: 1, duration: 0.14, ease: 'power2.out' }, Tc + 0.08);
        sfx(tl, Tc, 'click-hard', 0.55);
        FT(btn, { scale: 1.02 }, { scale: 0.94, duration: 0.08, ease: 'power2.in' }, Tc);
        FT(btn, { scale: 0.94 }, { scale: 1, duration: 0.45, ease: 'back.out(2.4)' }, Tc + 0.08);
        FT($('ic-dl'), { y: 0 }, { y: 6, duration: 0.10, ease: 'power2.out' }, Tc + 0.05);
        FT($('ic-dl'), { y: 6 }, { y: 0, duration: 0.30, ease: 'back.out(2.2)' }, Tc + 0.15);
        FT($('ring'), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: 'power1.out' }, Tc + 0.12);
        [$('rp-1'), $('rp-2')].forEach(function (ring, k) {
            FT(ring, { scale: 0.3, opacity: 0.85 }, { scale: 3.6, opacity: 0, duration: 0.65, ease: 'power2.out' }, Tc + 0.02 + k * 0.09);
        });
        /* el cursor se aparta del boton tras pulsar (decorativo) y se desvanece en la cola */
        FT($('cu'), { x: 1520, y: 242 }, { x: 1700, y: 330, duration: 0.55, ease: 'power2.out' }, 2.25);

        /* ---------- 2.15-2.55: el archivo sale volando del boton por un arco hasta el aviso ----------
           y: acelera 0.15 s (power2.in) y frena 0.25 s (power3.out): pico de velocidad en 2.30 (whoosh); x: se abre a la derecha y vuelve al icono del aviso (1366,850). */
        var Ta = 2.30;
        FT($('file'), { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.10, ease: 'power2.out' }, 2.15);
        FT($('file'), { y: 201 }, { y: 489, duration: 0.15, ease: 'power2.in' }, 2.15);
        FT($('file'), { y: 489 }, { y: 814, duration: 0.25, ease: 'power3.out', data: 'hero' }, Ta);
        sfx(tl, Ta, 'whoosh-s', 0.25);
        FT($('file'), { x: 1435 }, { x: 1568, duration: 0.17, ease: 'power1.out' }, 2.15);
        FT($('file'), { x: 1568 }, { x: 1330, duration: 0.23, ease: 'power2.inOut' }, 2.32);
        FT($('file'), { scale: 1 }, { scale: 0.9, duration: 0.10, ease: 'power1.in' }, 2.45);
        FT($('file'), { opacity: 1 }, { opacity: 0, duration: 0.08, ease: 'none' }, 2.52);

        /* ---------- 2.55-2.90: aviso "CSV listo / asistencia_3A.csv" COMPLETO (aparicion 2.55, asentamiento 2.65) y palomita dibujada ---------- */
        var Tt = 2.65;
        FT($('ti'), { opacity: 0, y: 34, scale: 0.94 }, { opacity: 1, y: 10, scale: 0.98, duration: 0.10, ease: 'power2.out' }, 2.55);
        FT($('ti'), { y: 10, scale: 0.98 }, { y: 0, scale: 1, duration: 0.30, ease: 'back.out(2.2)', data: 'hero' }, Tt);
        sfx(tl, Tt - AVANCE_ASENT, 'check', 0.50);
        FT($('ic-tick').querySelector('path'), { strokeDashoffset: 108 }, { strokeDashoffset: 0, duration: 0.25, ease: 'power2.out', data: 'hero' }, Tt);
        readMark(tl, 2.90, 'CSV listo asistencia_3A.csv');

        /* ---------- 2.90-3.15: remate decorativo, "Exportar CSV" pasa a "Exportado" (sin informacion nueva) ---------- */
        var Tx = 2.90;
        FT($('ex-a'), { y: 0 }, { y: -64, duration: 0.25, ease: 'power3.inOut' }, Tx);
        FT($('ex-b'), { y: 64 }, { y: 0, duration: 0.25, ease: 'power3.inOut', data: 'hero' }, Tx);
        sfx(tl, Tx, 'blip', 0.30);

        /* ---------- cola de lectura: el cursor se desvanece, la camara regresa (3.10-3.40); nada nuevo desde 3.65 ---------- */
        FT($('cu'), { opacity: 1 }, { opacity: 0, duration: 0.30, ease: 'power1.in' }, 2.95);

        /* fija la duracion exacta del cuadro (3.9 s) */
        tl.set($('bg'), { opacity: 1 }, 3.9);
    })();
  </script>
