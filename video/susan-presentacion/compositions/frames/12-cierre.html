               POR QUE EXISTE (contrato de sincronia v2, audit/sonido/REPORT.md 7): el instante de un sonido NO se escribe a mano. Se declara
               como ETIQUETA del timeline con la MISMA variable de tiempo que el tween que acompana, y los scripts lo derivan:
                   extract-events.mjs --cues  ->  v2/sfx-cues.json (tiempos absolutos)  ->  mount-sfx.mjs (data-start = t - ancla del archivo)
               Uso tipico:
                   var T = 1.05 + k * 0.3;                                                    // un solo numero para tween y sonido
                   tl.fromTo(bx[k], { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.7)', data: 'hero' }, T);
                   sfx(tl, T, 'ping-note' + (k + 1), 0.5);                                    // nombre del CATALOG.json; vol opcional
               Convenciones:
                 - t es el instante del evento visual: inicio del tween de entrada (primer fotograma visible); para 'whoosh/swipe' el punto de
                   maxima velocidad; para sonidos con anclaje 'fin' (riser, zoom-in) el instante en que ocurre el impacto/llegada (ver CATALOG.json).
                 - `data: 'hero'` en un tween (entrada de un elemento principal, cambio de estado, contador, empuje de camara, trazo) le exige sonido:

            window.SFXN = window.SFXN || 0;   // contador unico de etiquetas (compartido por todos los cuadros de la pagina)
            window.KEYN = window.KEYN || 0;   // rotacion de teclas (continua entre frases)

            /* sfx(tl, t, nombre, vol) -> etiqueta 'sfx:<nombre>@<vol>#<n>' en el instante t. vol omitido = volDefecto del catalogo. */
            function sfx(tl, t, nombre, vol) {

            /* sfxType(tl, t0, tiempos, opciones) -> tiempos absolutos de las teclas que suenan.

               Decima a <= 14 teclas/s: siempre suena la primera y la ultima; el acento (vol completo) va en inicios de palabra, las demas a 0.78.
               Rota key-1..8 sin repetir seguidas; una etiqueta por tecla (mount-sfx las hornea en un solo wav por frase, al milisegundo). */

                op = op || {};
                var txt = op.texto || '', vol = op.vol == null ? 0.35 : op.vol, gap = 1 / (op.maxPorSeg || 14), k = [], i, c, p;
                var ult = -1;
                for (i = 0; i < tiempos.length; i++) if (!txt || txt.charAt(i) !== ' ') ult = i;
                for (i = 0; i < tiempos.length; i++) {
                    if (txt && txt.charAt(i) === ' ') continue;
                    c = { t: t0 + tiempos[i], ini: !!txt && (i === 0 || txt.charAt(i - 1) === ' '), ult: i === ult };
                    p = k[k.length - 1];

                    else if (k.length > 1 && (c.ult || (c.ini && !p.ini))) k[k.length - 1] = c;   // la ultima y las iniciales desplazan a una tecla normal
                    else if (c.ult) k.push(c);                                                       // solo hay una tecla antes: ambas suenan
                }

                    out.push(q.t);

                if (op.enter && k.length) sfx(tl, op.enter === true ? k[k.length - 1].t + 0.14 : op.enter, 'key-enter', +(vol * 1.1).toFixed(3));

                var ease = gsap.parseEase(op.ease || 'power1.out'), paso = op.paso || 1, vol = op.vol == null ? 0.4 : op.vol, gap = 1 / (op.maxPorSeg || 12);
                var span = Math.abs(hasta - desde), n = Math.floor(span / paso + 1e-9), ts = [], s, lo, hi, m, it;

                    else if (j === ts.length - 1) k.push(t);

               `el`: elemento o selector. Opciones comunes: dur, ease, foco [cx, cy] (punto de 1920x1080 que queda en el centro), x, y (px, pisan a foco),
               W, H (tamano de escena, 1920x1080), sfx (nombre del catalogo o false), vol. Todos los tweens llevan data: 'hero'. ---- */
            function camInit(el, escala, x, y) {

                gsap.set(e, { transformOrigin: '50% 50%', scale: e.__cam.s, x: e.__cam.x, y: e.__cam.y, rotation: 0 });

                o = o || {};
                var e = typeof el === 'string' ? document.querySelector(el) : el;
                if (!e.__cam) camInit(e, 1, 0, 0);
                var c = e.__cam, dur = o.dur == null ? dur0 : o.dur, W = o.W || 1920, H = o.H || 1080;
                var s = a.s == null ? c.s : a.s, x = a.x == null ? c.x : a.x, y = a.y == null ? c.y : a.y, r = a.r == null ? c.r : a.r;

                if (o.x != null) x = o.x;
                if (o.y != null) y = o.y;
                tl.fromTo(e, { scale: c.s, x: c.x, y: c.y, rotation: c.r },
                    { scale: s, x: x, y: y, rotation: r, duration: dur, ease: o.ease || ease0, immediateRender: false, data: 'hero' }, t);
                e.__cam = { s: s, x: x, y: y, r: r };
                var snd = o.sfx === undefined ? sfx0 : o.sfx;
                if (snd) sfx(tl, t, snd, o.vol);
                return t + dur;
            }
            /* camSnap: salto de zoom en ~0.18 s con ataque (snap-zoom). Suena 'snap' por defecto (sfx: false lo apaga). */
            function camSnap(tl, el, t, escala, o) { return camTo(tl, el, t, { s: escala }, o, 0.18, 'power4.out', 'snap'); }
            /* camPush: empuje lento (acercar). Sonido opcional: sfx(tl, fin, 'zoom-in') (anclaje 'fin': t = fin del tween). */
            function camPush(tl, el, t, escala, o) { return camTo(tl, el, t, { s: escala }, o, 1.1, 'power2.inOut', null); }
            /* camPull: alejar (escala por defecto 1) en ~0.7 s. */
            function camPull(tl, el, t, escala, o) { return camTo(tl, el, t, { s: escala == null ? 1 : escala }, o, 0.7, 'power3.inOut', null); }
            /* camPan: desplazamiento RELATIVO (dx, dy en px) respecto a la posicion actual, ~0.6 s. */
            function camPan(tl, el, t, dx, dy, o) {
                var e = typeof el === 'string' ? document.querySelector(el) : el;
                var c = e.__cam || { x: 0, y: 0 };
                return camTo(tl, el, t, { x: c.x + (dx || 0), y: c.y + (dy || 0) }, o, 0.6, 'power3.inOut', null);
            }
            /* camTilt: inclinacion (rotacion en grados, absoluta) ~0.5 s; camTilt(tl, el, t, 0) la endereza. */
            function camTilt(tl, el, t, grados, o) { return camTo(tl, el, t, { r: grados }, o, 0.5, 'power2.inOut', null); }
            /* ============================ fin del bloque canonico v2 ============================ */


            // El mundo es lo unico que mueve la camara. Foco siempre al centro del lienzo: x = y = 0.
            var FOCO = [960, 540];

            // ---------- 0.00-0.45 Llegada: corte seco desde 11, que acaba en empuje (1.20). Aqui continua la velocidad
            // y la camara se retira a 1.00. "Pasa lista en" ya esta opaca en el fotograma 0 (heroe), sin entrada propia.
            camInit(world, 1.22, 0, 0);
            camTo(tl, world, 0, { s: 1 }, { dur: 0.45, ease: 'power4.out', foco: FOCO, sfx: false });

            // ---------- 0.15-0.50 Slam de "segundos." en DOS tweens: aparicion (0.15) y asentamiento (0.25, con el stamp).
            // 1.5 -> 1.15 es el 70 % del recorrido; el resto lo hace el resorte expo.out.
            tl.fromTo(l2,
                { opacity: 0, scale: 1.5 },
                { opacity: 1, scale: 1.15, duration: 0.10, ease: 'power2.out' },
                0.15);
            // El sonido de un asentamiento se adelanta 0.07 s: la aparicion (primer fotograma visible) ocurre 0.10 s antes y el sonido
            // llegaba 67-117 ms tarde; a inicio de aparicion + 0.03 s la etiqueta sigue a <= 33 ms del tween de aparicion.
            var AVANCE_ASENT = 0.07;
            var TS = 0.25;
            tl.fromTo(l2,
                { scale: 1.15 },
                { scale: 1, duration: 0.20, ease: 'expo.out', immediateRender: false, data: 'hero' },
                TS);
            sfx(tl, TS - AVANCE_ASENT, 'stamp', 0.40);
            // Marcador azul (15 %) que subraya la palabra: se dibuja con el asentamiento y cierra la frase a 0.50.
            tl.fromTo(bar,
                { scaleX: 0 },
                { scaleX: 1, duration: 0.25, ease: 'power3.out' },
                TS);
            readMark(tl, 0.5, 'Pasa lista en segundos.');

            // ---------- 0.45-1.40 Empuje hacia el corte: la camara sigue a 1.00 -> 1.07 (power2.in, velocidad maxima en el blur-and-lift,
            // igual que 11 empuja hacia este corte). Rompe la pausa de ~1 s sobre una frase ya leida y deja el texto limpio.
            // La ease "in" arranca casi quieta: el evento visible de esos primeros 0.35 s es el marcador de abajo.
            camTo(tl, world, 0.45, { s: 1.07 }, { dur: 0.95, ease: 'power2.in', foco: FOCO, sfx: false });

            // ---------- 0.80-1.02 El marcador se vuelve resaltador: crece hacia arriba hasta cubrir media palabra (x2.2) y se
            // oscurece (15 % -> 34 %). Es un cambio grande y permanente (no un "respiro" de 25 %), asi el tap suena sobre algo que se ve.
            // Va detras del texto (z-index 0): no se superpone ni tapa la frase, que sigue limpia hasta el blur-and-lift.
            var TR = 0.80;
            tl.to(bar, { opacity: 0.34, scaleY: 2.2, duration: 0.22, ease: 'power3.out', data: 'hero' }, TR);
            sfx(tl, TR, 'tap', 0.16);

            // ---------- 1.20-1.40 Blur-and-lift: la linea se limpia y desaparece en corte duro a 1.40.
            // El whoosh cae a 1.39: velocidad maxima al final de la curva power3.in.
            tl.fromTo(line,
                { scale: 1, filter: 'blur(0px)', opacity: 1 },
                { scale: 1.18, filter: 'blur(10px)', opacity: 0.15, duration: 0.20, ease: 'power3.in', immediateRender: false },
                1.20);
            sfx(tl, 1.39, 'whoosh-s', 0.40);
            tl.set(line, { opacity: 0 }, 1.40);

            // ---------- 1.30-2.20 La malla pastel con grano florece desde el borde inferior.
            var TM = 1.30;
            tl.fromTo(mesh,
                { opacity: 0 },
                { opacity: 0.92, duration: 0.90, ease: 'power2.out', data: 'hero' },
                TM);
            sfx(tl, TM, 'soft-in', 0.30);
            tl.fromTo(mesh,
                { y: 170, scale: 0.92 },
                { y: 0, scale: 1, duration: 0.80, ease: 'power2.out' },
                TM);

            // ---------- 1.40 Camara pull-back 2: entra a 1.12 (la linea ya se fue) y se retira a 1.06 mientras se arma el wordmark.
            world.__cam = { s: 1.12, x: 0, y: 0, r: 0 };
            camTo(tl, world, 1.40, { s: 1.06 }, { dur: 0.50, ease: 'power3.out', foco: FOCO, sfx: false });

            // ---------- 1.40-2.10 SUSAN: cada letra en DOS tweens (aparicion y asentamiento 0.10 s despues, con su pop).
            // Motivo de marca 1 -> 4 (como en 04); la N no suena: termina de asentarse a 2.10, justo en el impacto.
            var POPS = ['pop-1', 'pop-2', 'pop-3', 'pop-4', null];
            letras.forEach(function (letra, i) {
                var T = +(1.40 + i * 0.10).toFixed(2);
                tl.fromTo(letra,
                    { opacity: 0, y: 120, filter: 'blur(14px)' },
                    { opacity: 1, y: 36, filter: 'blur(4.2px)', duration: 0.10, ease: 'power2.out' },
                    T);
                var TA = +(T + 0.10).toFixed(2);
                tl.fromTo(letra,
                    { y: 36, filter: 'blur(4.2px)' },
                    { y: 0, filter: 'blur(0px)', duration: 0.20, ease: 'power3.out', immediateRender: false, data: 'hero' },
                    TA);
                if (POPS[i]) sfx(tl, TA - AVANCE_ASENT, POPS[i], 0.36);
            });

            // ---------- 2.10-2.40 Impacto de marca: el wordmark pulsa 1 -> 1.03 -> 1 y el degradado late; el riser (que
            // empieza a 1.50 bajo los pops) termina aqui. La camara hace su recoil (alejar) sobre el mismo golpe.
            var TI = 2.10;
            tl.fromTo(mark,
                { scale: 1 },
                { scale: 1.03, duration: 0.10, ease: 'power2.out', data: 'hero' },
                TI);
            sfx(tl, TI, 'riser-s', 0.40);
            sfx(tl, TI, 'impact-lite', 0.50);
            tl.fromTo(mark,
                { scale: 1.03 },
                { scale: 1, duration: 0.30, ease: 'power2.inOut', immediateRender: false },
                TI + 0.10);
            tl.fromTo(meshin,
                { scale: 1 },
                { scale: 1.05, duration: 0.10, ease: 'power2.out' },
                TI);
            tl.fromTo(meshin,
                { scale: 1.05 },
                { scale: 1, duration: 0.30, ease: 'power2.inOut', immediateRender: false },
                TI + 0.10);
            camTo(tl, world, TI, { s: 1.01 }, { dur: 0.12, ease: 'power4.out', foco: FOCO, sfx: false });
            camTo(tl, world, 2.22, { s: 1.06 }, { dur: 0.28, ease: 'power2.inOut', foco: FOCO, sfx: false });

            // ---------- 2.25-3.00 Escudo UNACH, pastilla y escudo FCA entran uno tras otro (aparicion + asentamiento, pops 3 1 4).
            function entrar(obj, T, pop, desde) {
                tl.fromTo(obj,
                    { opacity: 0, scale: desde },
                    { opacity: 1, scale: desde + (1 - desde) * 0.7, duration: 0.10, ease: 'power2.out' },
                    T);
                var TA = +(T + 0.10).toFixed(2);
                tl.fromTo(obj,
                    { scale: desde + (1 - desde) * 0.7 },
                    { scale: 1, duration: 0.25, ease: 'back.out(1.5)', immediateRender: false, data: 'hero' },
                    TA);
                sfx(tl, TA - AVANCE_ASENT, pop, 0.36);
            }

            // ---------- 2.95-3.35 Camara pull-back 3: revela los dos escudos y la pastilla (sin whoosh).
            camTo(tl, world, 2.95, { s: 1 }, { dur: 0.40, ease: 'power3.out', foco: FOCO, sfx: false });

            // ---------- 3.10-3.55 Barrido de brillo por las letras de SUSAN + campana final.
            var TB = 3.10;
            // Con background-size 300 % la banda de luz (42-58 % del gradiente) queda pegada al borde izquierdo de la S en 87 % y sale por
            // el derecho de la N en 13 %: sin recorrido muerto fuera del texto, y con ease "out" el brillo ya cubre la primera letra
            // a +30 ms del cue (antes: 100 % -> 0 % con inOut, el brillo entraba 183 ms tarde).
            tl.fromTo(shine,
                { backgroundPosition: '87% 0%' },
                { backgroundPosition: '13% 0%', duration: 0.45, ease: 'power1.out', data: 'hero' },
                TB);
            // Un solo sonido por barrido: 'sheen' (barrido de luz) sustituye al par sparkle-short + chime-trim.
            sfx(tl, TB, 'sheen', 0.50);
            readMark(tl, 3.35, 'SUSAN');



            // ---------- 3.40-5.00 Retencion del lockup con movimiento sutil: la camara avanza 1.00 -> 1.04 (sine.inOut, pico ~3.9 %/s,
            // sobre 3 %/s en todo 3.8-4.6) para que la cola no sea una imagen fija; el lockup sigue completo y centrado.
            camTo(tl, world, 3.40, { s: 1.04 }, { dur: 1.60, ease: 'sine.inOut', foco: FOCO, sfx: false });

            // Deriva ambiental del degradado durante la retencion (decorativa, sin informacion nueva, no es camara).
            tl.fromTo(meshin,
                { x: 0 },
                { x: -240, duration: 1.55, ease: 'none' },
                3.40);

            // ---------- 4.40-4.95 Respiracion ambiental del degradado (+8 % de opacidad). SIN sonido: el soft-in que tenia a 4.40 sonaba sobre un
            // cambio de 0.4-0.9 de diferencia media (imperceptible junto a la camara); ya no es un evento hero, es ambiente.
            var TZ = 4.40;
            tl.fromTo(mesh,
                { opacity: 0.92 },
                { opacity: 1, duration: 0.55, ease: 'power1.inOut', immediateRender: false },
                TZ);
            tl.fromTo(meshin,
                { scale: 1 },
                { scale: 1.07, duration: 0.55, ease: 'power1.inOut', immediateRender: false },
                TZ);

            // Fija la duracion exacta del cuadro (5.00 s) sin animar nada.
            tl.set({}, {}, 5);
        })();
    </script>
</template>
