<script>
(function () {
    // Cuadro de juguete: cada instante de T es el mismo numero que su cue en `sfx_cues` de STORYBOARD.md (contrato v4).
    var T = { tarjeta: 0.0, panel: 0.35, chipA: 1.0, chipB: 1.3, toque: 1.9, caida: 2.2, golpe: 2.5 };
    var D = 3;
    var $ = function (n) { return document.getElementById('s01-tarjeta-' + n); };
    var tl = gsap.timeline({ paused: true });
    // whoosh-s @0.10: pico de velocidad de la entrada de la tarjeta (0.00-0.45)
    tl.fromTo($('card'), { x: -520, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, T.tarjeta);
    // soft-in @0.35
    tl.fromTo($('panel'), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, T.panel);
    // pop-1 @1.00 y pop-3 @1.30
    tl.fromTo($('chip-a'), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'power3.out' }, T.chipA);

    tl.fromTo($('peso'), { scaleX: 1, scaleY: 1 }, { scaleX: 1.08, scaleY: 0.92, duration: 0.07, ease: 'power2.out', immediateRender: false }, T.golpe);

    tl.set({}, {}, D);
    window.__timelines['s01-tarjeta'] = tl;
