                o.pos(e, p);
                var v = (p <= 0 || p >= 1) ? 0 : Math.abs(o.dist) * velocidad(ease, p, o.dur);

                o.el.style.filter = s < 0.3 ? 'none' : filtro;
                if (o.extra) { o.extra(p, v, ease); }
            }
            aplicar();
            tl.fromTo(st, { p: 0 }, { p: 1, duration: o.dur, ease: 'none', onUpdate: aplicar, immediateRender: false }, o.at);
        }

        // Desenfoque de lente como función pura del tiempo: blur(px) mientras > 0.05, «none» en reposo.
        function desenfoque(el, at, dur, desde, curva) {

        tl.fromTo($('b-brillo'), { xPercent: -120 }, { xPercent: 120, duration: 0.7, ease: 'power2.inOut' }, 2.95);
        tl.fromTo($('b-comparar'), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out' }, 2.42);
        tl.fromTo([$('b-esc1'), $('b-esc2')], { scale: 1 }, { scale: 2, duration: 0.7, ease: 'power3.inOut' }, 2.5);

        // (c) odómetro: unidades una vuelta + 8, decenas de «␣» a 8; estela vertical por columna.
        tl.fromTo($('c-rotulo'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 3.82);
        var tiraU = $('c-tira-u');
        var tiraD = $('c-tira-d');
        conRastro({ el: tiraU, nodo: $('mb-u-g'), at: 3.95, dur: 0.9, curva: 'expo.out', dist: 18 * H, eje: 'y', max: 16,
            pos: function (e) { gsap.set(tiraU, { y: -18 * H * e }); } });
        conRastro({ el: tiraD, nodo: $('mb-d-g'), at: 3.99, dur: 0.9, curva: 'expo.out', dist: 8 * H, eje: 'y', max: 16,
            pos: function (e) { gsap.set(tiraD, { y: -8 * H * e }); } });
        tl.fromTo($('c-pie'), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 4.6);

        // (d) caída power2.in (velocidad máxima al contacto) con estela SVG + 2 fantasmas, squash de volumen constante.
        var DESDE = -620;
        var mov = $('d-mov');
        var f1 = $('d-fant1');
        var f2 = $('d-fant2');
        conRastro({ el: $('d-ficha'), nodo: $('mb-f-g'), at: 5.2, dur: 0.32, curva: 'power2.in', dist: -DESDE, eje: 'y', max: 26,
            pos: function (e) { gsap.set(mov, { y: DESDE * (1 - e) }); },
            extra: function (p, v, ease) {
                var e = ease(p);
                var fuerza = (p <= 0 || p >= 1) ? 0 : Math.min(1, v / 2500);
                var p1 = Math.max(0, p - OBT / 0.32);
                var p2 = Math.max(0, p - 2 * OBT / 0.32);
                gsap.set(f1, { y: DESDE * (e - ease(p1)), opacity: 0.32 * fuerza });
                gsap.set(f2, { y: DESDE * (e - ease(p2)), opacity: 0.16 * fuerza });

        var esc = $('d-esc');
        tl.fromTo(esc, { scaleX: 1, scaleY: 1 }, { scaleX: 1.07, scaleY: 0.93, duration: 0.06, ease: 'power2.out', immediateRender: false }, 5.52);
        tl.fromTo(esc, { scaleX: 1.07, scaleY: 0.93 }, { scaleX: 1, scaleY: 1, duration: 0.24, ease: 'power3.out', immediateRender: false }, 5.58);
