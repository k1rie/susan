        // En el corte el botón queda en (1058.7, 675.1) y el centro de la tarjeta en y ≈ 537 en las dos capas; ambas se mueven

        tl.fromTo($('cerca-brillo'), { xPercent: -60 }, { xPercent: 120, duration: 0.5, ease: 'power2.inOut' }, T.brillo);

            { opacity: 1, duration: 0.15, ease: 'power2.out' }, T.foco);
        tl.fromTo($('cerca-flecha'), { x: 0 }, { x: 2, duration: 0.15, ease: 'power2.out' }, T.foco);

        // ---------- Escena 4 (4.9-6.05 s): toque sin cursor y el botón de tinta se abre en el marco de la cámara ----------
        // press-release-spring: compresión a 0.96 (primario a #3A3433) y liberación back.out(1.4) por adyacencia.
        var pulsador = $('cerca-pulsador');
        var tinta = $('cerca-tinta');
        tl.fromTo(pulsador, { scale: 1 }, { scale: 0.96, duration: 0.09, ease: 'power1.in' }, T.presion);
        tl.fromTo(pulsador, { scale: 0.96 }, { scale: 1, duration: 0.25, ease: 'back.out(1.4)', immediateRender: false }, T.presion + 0.09);
        tl.fromTo(tinta, { backgroundColor: '#1E1919' }, { backgroundColor: '#3A3433', duration: 0.09, ease: 'power1.in' }, T.presion);
        tl.fromTo(tinta, { backgroundColor: '#3A3433' }, { backgroundColor: '#1E1919', duration: 0.25, ease: 'power3.out', immediateRender: false }, T.presion + 0.09);
        // Cambio de estado: «Programada» -> «Abierta» (tokens de justificado), en secuencia (nunca se enciman),
        // y el halo de foco se abre una vez.
        tl.fromTo($('cerca-programada'), { opacity: 1 }, { opacity: 0, duration: 0.04, ease: 'power1.in' }, T.estado);
        tl.fromTo($('cerca-abierta'), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.18, ease: 'power3.out' }, T.estado + 0.04);
        tl.fromTo($('cerca-foco'), { boxShadow: '0 0 0 ' + px(FOCO) + ' rgba(0,97,254,0.3)' },
            { boxShadow: '0 0 0 40px rgba(0,97,254,0)', duration: 0.5, ease: 'power2.out', immediateRender: false }, T.estado);

        // card-morph-anchor con constantes (R5): la tinta del botón se abre en el marco de la cámara por clip-path, sin escala;
        // el rótulo sale antes del 40 %, la tarjeta blanca y su sombra también, y los chips de la cámara entran después del 60 %.
        var VIAJE = { duration: 0.6, ease: 'power3.inOut' };
        tl.fromTo(tinta, { clipPath: inset(BOTON2, RB2) },
            { clipPath: inset(CAMARA2, 28), duration: VIAJE.duration, ease: VIAJE.ease }, T.camara);
        tl.fromTo($('cerca-rotulo'), { opacity: 1 }, { opacity: 0, duration: 0.18, ease: 'power1.in' }, T.camara);
        tl.fromTo([$('cerca-tarjeta'), $('cerca-sombra')], { opacity: 1 }, { opacity: 0, duration: 0.22, ease: 'power1.in' }, T.camara);
        // Los chips viajan pegados a sus esquinas del recorte (a tamaño nativo, mismo ease y duración) para no asomar fuera de la
        // tinta mientras aparecen: «Reconociendo» con la esquina superior izquierda y «Cámara frente» con la superior derecha.
        tl.fromTo($('reconociendo'), { x: KB.x - CAM.x, y: KB.y - CAM.y }, { x: 0, y: 0, duration: VIAJE.duration, ease: VIAJE.ease }, T.camara);
        tl.fromTo($('frente'), { x: (KB.x + KB.w) - (CAM.x + CAM.w), y: KB.y - CAM.y }, { x: 0, y: 0, duration: VIAJE.duration, ease: VIAJE.ease }, T.camara);
        tl.fromTo([$('reconociendo'), $('frente')], { opacity: 0 }, { opacity: 1, duration: 0.24, ease: 'power1.out' }, T.camara + 0.36);
        // La sombra de tinta sigue la caja del recorte (mismo ease y duración; lineales en el progreso, como el inset) y aparece en la
        // segunda mitad: maquetada en la caja de la cámara, parte de la del botón. Quieta en la caja de la cámara desde 5.90.
        tl.fromTo($('cerca-sombra-tinta'), { x: KB.x - CAM.x, y: KB.y - CAM.y, scaleX: KB.w / CAM.w, scaleY: KB.h / CAM.h },
            { x: 0, y: 0, scaleX: 1, scaleY: 1, duration: VIAJE.duration, ease: VIAJE.ease }, T.camara);
        tl.fromTo($('cerca-sombra-tinta'), { opacity: 0 }, { opacity: 1, duration: 0.30, ease: 'power1.out' }, T.camara + 0.30);
        // theme-crossfade-morph bajo el ancla: el lienzo E3 con halo azul sube encima del cielo (que nunca baja a 0).
        tl.fromTo($('lienzo'), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.inOut' }, T.camara);

        tl.set({}, {}, T.D);
        window.__timelines['s02-un-boton'] = tl;
    })();
