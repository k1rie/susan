        tl.fromTo($('ficha-sombra'), { scaleX: 1, scaleY: 1 }, { scaleX: 632 / 168, scaleY: 96 / 168, duration: MORPH.duration, ease: MORPH.ease }, T.ficha);
        tl.fromTo($('ficha-sombra'), { opacity: 1 }, { opacity: 0, duration: 0.45, ease: 'power1.in' }, T.ficha);
        // scan-face 72 -> 40 px y del centro del disco a su lugar en el botón.
        tl.fromTo($('ico'), { x: 144, scale: 1.8 }, { x: 0, scale: 1, duration: MORPH.duration, ease: MORPH.ease }, T.ficha);
        // «Abrir y pasar lista» y la flecha entran desde el desenfoque.
        tl.fromTo($('rotulo-texto'), { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power4.out' }, T.rotulo);
        desenfoque($('rotulo-texto'), T.rotulo, 0.25, 10, 'power4.out');
        tl.fromTo($('flecha'), { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power4.out' }, T.rotulo + 0.05);
        desenfoque($('flecha'), T.rotulo + 0.05, 0.25, 10, 'power4.out');

        // center-outward-expansion: la superficie de la tarjeta crece desde el botón (expo.out) con su borde de 2 px y su sombra.
        var CRECE = { duration: 0.6, ease: 'expo.out' };
        tl.fromTo($('sup-borde'), { clipPath: inset(LINEA, 16) }, { clipPath: inset(TARJETA, 28), duration: CRECE.duration, ease: CRECE.ease }, T.tarjeta);
        tl.fromTo($('sup-fondo'), { clipPath: inset(mas(LINEA, 2), 14) }, { clipPath: inset(mas(TARJETA, 2), 26), duration: CRECE.duration, ease: CRECE.ease }, T.tarjeta);
        tl.fromTo($('sombra-crece'), { scaleX: 632 / 712, scaleY: 0.05, opacity: 0 }, { scaleX: 1, scaleY: 1, opacity: 1, duration: CRECE.duration, ease: CRECE.ease }, T.tarjeta);
        // Contenido con los tiempos de la app (StaggerList: 14 -> 0, 0.5 s, +60 ms), del botón hacia afuera:
        // lo de arriba sube desde el botón y el enlace baja desde él.
        var piezas = [['camara-fila', 14], ['enlace', -14], ['detalle', 14], ['titulo', 14], ['cab-izq', 14], ['estado', 14]];
        piezas.forEach(function (p, i) {
            tl.fromTo($(p[0]), { opacity: 0, y: p[1] }, { opacity: 1, y: 0, duration: 0.5, ease: 'power4.out' }, T.contenido + i * 0.06);
        });

        // ---------- Escena 2 (1.15-2.8 s): «SUSAN» se escribe y se subraya en oro ----------
        var letras = document.querySelectorAll('#' + ID + '-marca .s02-un-boton-letra');
        for (var i = 0; i < letras.length; i++) {
            var at = T.marca + i * 0.045;
            tl.fromTo(letras[i], { opacity: 0, y: 40.8 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power4.out' }, at);
            desenfoque(letras[i], at, 0.5, 12, 'power4.out');
        }
        tl.fromTo($('trazo'), { attr: { 'stroke-dashoffset': 100 } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.8, ease: 'power4.out' }, T.subrayado);

        // ---------- Escena 3 (2.8-4.9 s): brillo, pulso de la cámara y halo de foco ----------
        tl.fromTo($('brillo'), { xPercent: -120 }, { xPercent: 120, duration: 0.7, ease: 'power2.inOut' }, T.brillo);
        [['pulso-1', 0], ['pulso-2', 0.10]].forEach(function (p) {
            var c = $(p[0]);
            tl.fromTo(c, { attr: { r: 8 } }, { attr: { r: 22 }, duration: 0.45, ease: 'power2.out' }, T.pulso + p[1]);
            tl.fromTo(c, { opacity: 0 }, { opacity: 0.9, duration: 0.05, ease: 'none' }, T.pulso + p[1]);
            tl.fromTo(c, { opacity: 0.9 }, { opacity: 0, duration: 0.40, ease: 'power1.in', immediateRender: false }, T.pulso + p[1] + 0.05);
        });
        // Halo de foco nativo (0 0 0 8px rgba(0,97,254,.3)) 0.15 s antes de la compresión; la flecha avanza 2 px como en hover.
        tl.fromTo($('foco'), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'power2.out' }, T.foco);
        tl.fromTo($('flecha'), { x: 0 }, { x: 2, duration: 0.15, ease: 'power2.out' }, T.foco);

        // ---------- Escena 4 (4.9-6.05 s): toque sin cursor y la tarjeta se abre en la cámara ----------
        // press-release-spring: compresión lineal a 0.96 (primario a #3A3433) y liberación back.out(1.4) por adyacencia.
        tl.fromTo(boton, { scale: 1 }, { scale: 0.96, duration: 0.09, ease: 'power1.in' }, T.presion);
        tl.fromTo(boton, { scale: 0.96 }, { scale: 1, duration: 0.25, ease: 'back.out(1.4)', immediateRender: false }, T.presion + 0.09);
        tl.fromTo($('sup'), { backgroundColor: '#1E1919' }, { backgroundColor: '#3A3433', duration: 0.09, ease: 'power1.in' }, T.presion);
        tl.fromTo($('sup'), { backgroundColor: '#3A3433' }, { backgroundColor: '#1E1919', duration: 0.25, ease: 'power3.out', immediateRender: false }, T.presion + 0.09);
        // Cambio de estado: «Programada» -> «Abierta» (tokens de justificado) y el halo de foco se abre una vez.
        tl.fromTo($('programada'), { opacity: 1 }, { opacity: 0, duration: 0.06, ease: 'power1.in' }, T.estado);
        tl.fromTo($('abierta'), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.18, ease: 'power3.out' }, T.estado + 0.02);
        tl.fromTo($('foco'), { boxShadow: '0 0 0 8px rgba(0,97,254,0.3)' }, { boxShadow: '0 0 0 28px rgba(0,97,254,0)', duration: 0.5, ease: 'power2.out' }, T.estado);

        // card-morph-anchor con constantes: la superficie va de la caja de la tarjeta a la de la cámara (clip-path, sin escala)
        // y de blanco a tinta como pintura; el contenido sale antes del 40 % y los chips entran después del 60 %.
        var VIAJE = { duration: 0.6, ease: 'power3.inOut' };
        tl.fromTo($('sup-borde'), { clipPath: inset(TARJETA, 28), backgroundColor: '#E7E2DC' },
            { clipPath: inset(CAMARA, 28), backgroundColor: '#1E1919', duration: VIAJE.duration, ease: VIAJE.ease, immediateRender: false }, T.camara);
        tl.fromTo($('sup-fondo'), { clipPath: inset(mas(TARJETA, 2), 26), backgroundColor: '#FFFFFF' },
            { clipPath: inset(mas(CAMARA, 2), 26), backgroundColor: '#1E1919', duration: VIAJE.duration, ease: VIAJE.ease, immediateRender: false }, T.camara);
        tl.fromTo($('tarjeta'), { opacity: 1 }, { opacity: 0, duration: 0.24, ease: 'power1.in' }, T.camara);
        tl.fromTo(boton, { opacity: 1 }, { opacity: 0, duration: 0.24, ease: 'power1.in' }, T.camara);
        tl.fromTo([$('reconociendo'), $('frente')], { opacity: 0 }, { opacity: 1, duration: 0.24, ease: 'power1.out' }, T.camara + 0.36);
        // La sombra pasa de azulada (caja de la tarjeta) a tinta (caja de la cámara) siguiendo la misma caja.
        tl.fromTo($('sombra-cielo'), { x: 0, y: 0, scaleX: 1, scaleY: 1, opacity: 1 },
            { x: -104, y: -9, scaleX: 900 / 712, scaleY: 506 / 582, opacity: 0, duration: VIAJE.duration, ease: VIAJE.ease }, T.camara);
        tl.fromTo($('sombra-tinta'), { x: 104, y: 9, scaleX: 712 / 900, scaleY: 582 / 506, opacity: 0 },
            { x: 0, y: 0, scaleX: 1, scaleY: 1, opacity: 1, duration: VIAJE.duration, ease: VIAJE.ease }, T.camara);
        // theme-crossfade-morph bajo el ancla: el lienzo E3 con halo azul sube encima del cielo y se lleva la marca.
        tl.fromTo($('lienzo'), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.inOut' }, T.camara);

        tl.set({}, {}, T.D);
        window.__timelines['s02-un-boton'] = tl;
    })();
</script>
