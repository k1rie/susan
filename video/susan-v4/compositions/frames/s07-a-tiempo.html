        var eMorph = gsap.parseEase('power3.inOut'), ePinta = gsap.parseEase('power1.inOut');

        tl.fromTo($('rig'), { opacity: 1, scale: 1 }, { opacity: 0.12 / 0.35, scale: 0.97, duration: 0.65, ease: 'power3.inOut' }, T.abre);

        var asoman = [$('subtitulo'), $('leyenda')];

        // atenuación) y el encabezado regresa a 1 con la salida de la sección A, ya plano y nítido para leer la sección B.
        var encabezado = [$('avatar'), $('nombre-ivan'), $('matricula'), $('chips'), $('divisor')];

        blurTramo(dofA, encabezado, T.focoA, 0.20, 0, 6, 'power2.out', false);
        tl.fromTo(encabezado, { opacity: 1 }, { opacity: 0.4, duration: 0.20, ease: 'power2.out', immediateRender: false }, T.focoA);

        // Relevo vertical R2 (DINAMISMO §2.2), recortado por el cuerpo con desvanecido de 24 px. El «2» queda quieto de 2.85 a
        // 3.95 s («dos» a 3.21) y la sección sale ya en la pausa «…» (la frase «dos faltas» termina hacia 3.85 s).
        // Salida: y 0 → −140, power2.in 0.30 s (velocidad máxima al final), estela vertical ≤ 10 en la hoja interior,
        // opacidad → 0 en el último 40 % y autoAlpha 0 al terminar (envoltorio externo = salida).
        var secaSal = $('seca-sal'), seca = $('seca');
        conRastro({ el: seca, nodo: $('mb-a-g'), at: T.salA, dur: 0.30, curva: 'power2.in', dist: 140, eje: 'y', max: 10,
            pos: function (e) { gsap.set(secaSal, { y: -140 * e }); } });
        tl.fromTo(seca, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: 'power1.in', immediateRender: false }, T.salA + 0.18);
        tl.set(secaSal, { autoAlpha: 0 }, T.salA + 0.30);

        // Entrada: y +140 → 0, power3.out 0.50 s, opacidad 0 → 1 en 0.15 s, estela ≤ 10 (envoltorio interno = entrada; filtro
        // en la hoja). Sin solape (QA r1: con 0.10 s la píldora asomaba bajo el «2» y la barra al 60 % y se leía como una
        // disolvencia en el mismo lugar): arranca cuando la sección A ya está en 0, a 4.25, y los dos picos de velocidad se
        // tocan ahí (whoosh-s).
        function subir(ent, hoja, nodo, at) {
            tl.fromTo(ent, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'power1.out' }, at);
            conRastro({ el: hoja, nodo: nodo, at: at, dur: 0.50, curva: 'power3.out', dist: 140, eje: 'y', max: 10,
                pos: function (e) { gsap.set(ent, { y: 140 * (1 - e) }); } });
        }
        subir($('cruce-ent'), $('cruce'), $('mb-cruce-g'), T.cruce);

        // ---------- Escena 4 (4.55–7.6): la acción sugerida y su halo de foco ----------
        // La fila (ficha calendar-check + «Acción sugerida») sube con la misma receta 0.30 s después de la píldora, con ella ya
        // al 94 % de su recorrido: un movimiento vertical tras otro, no tres encimados.
        subir($('accion-ent'), $('accion'), $('mb-accion-g'), T.accion);

        // «Contactar al alumno esta semana» con el BlurText de la app, por palabra (direction bottom, para no romper la dirección
        // única hacia arriba): blur 10 → 0, y +0.5em → 0 y opacidad, curva de salida de la app; 0.28 s por palabra, +0.03 s.
        // Un solo driver puro del tiempo: cada palabra se calcula de su progreso local; filter:none en reposo (antes y después).
        var palabras = $('accion-b').querySelectorAll('.s07-a-tiempo-pal');
        var BT = { dur: 0.40, pal: 0.28, paso: 0.03, sube: 16, blur: 10 };
        var eBT = gsap.parseEase('power4.out');
        var bt = { p: 0 };
        function pintarTexto() {
            var t = bt.p * BT.dur;
            for (var k = 0; k < palabras.length; k++) {
                var q = Math.min(1, Math.max(0, (t - k * BT.paso) / BT.pal));
                var e = q <= 1e-4 ? 0 : (q >= 1 - 1e-4 ? 1 : eBT(q));
                // Sin filtro mientras la palabra no ha empezado (opacidad 0): filter:none en reposo también antes de entrar.
                var b = e <= 0 ? 0 : BT.blur * (1 - e);
                gsap.set(palabras[k], { opacity: e, y: BT.sube * (1 - e) });
                palabras[k].style.filter = b < 0.05 ? 'none' : 'blur(' + b.toFixed(2) + 'px)';
            }
        }
        pintarTexto();
        tl.fromTo(bt, { p: 0 }, { p: 1, duration: BT.dur, ease: 'none', onUpdate: pintarTexto, immediateRender: false }, T.texto);
        tl.addLabel('read:accion-sugerida#1', T.texto + BT.dur);

        // Latido de la fila al asentarse su texto (vibración finita, como el latido de la casilla en F5 y la píldora que «acusa
        // el peso» en F6): 1 → 1.035 y 5 px abajo en 0.10 s, vuelta en 0.22 s, sin rebote; quieta desde 5.82 s, antes de «tiempo»
        // (5.93) y del halo (6.45). Va en la hoja (#accion), no en el envoltorio de entrada que mueve conRastro.
        var accHoja = $('accion');
        tl.fromTo(accHoja, { scale: 1, y: 0 }, { scale: 1.035, y: 5, duration: 0.10, ease: 'power2.out', immediateRender: false }, T.latido);
        tl.fromTo(accHoja, { scale: 1.035, y: 5 }, { scale: 1, y: 0, duration: 0.22, ease: 'power2.inOut', immediateRender: false }, T.latido + 0.10);

        // Halo de foco nativo (sin cursor ni pulsación): es lo siguiente que hace la docente.
        // El anillo se enciende como el foco nativo (casi de golpe, al final del tramo) y la fila toma el fondo activo #EFECE7.
        tl.fromTo($('accion-halo'), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power3.in' }, T.halo);
        tl.fromTo($('accion-fondo'), { backgroundColor: '#F7F5F2' }, { backgroundColor: '#EFECE7', duration: 0.2, ease: 'power3.in' }, T.halo);

        // Cámara en escala 1 todo el cuadro: sin empuje ni regreso (los acercamientos de adorno se retiraron; DINAMISMO §0).
        // Cuadro quieto deliberado desde 6.65 s; la duración la fija este ancla.
        tl.set({}, {}, T.fin);

        window.__timelines = window.__timelines || {};
        window.__timelines["s07-a-tiempo"] = tl;
    })();
</script>
</template>
