            empuje: 3.00,     // cámara: empuje hacia la fila «Faltas»
            encuadre: 4.40,   // cámara: encuadra el pie de la tarjeta, donde llega la acción
            regreso: 5.85,    // cámara: vuelve a la identidad a 6.65 s (handoff quieto)
            fin: 7.6
        };

        var tl = gsap.timeline({ paused: true });

        // ---------- helpers del piloto (s99-piloto.html) ----------
        function velocidad(ease, p, dur) {
            var h = 0.002;
            var a = Math.max(0, p - h);
            var b = Math.min(1, p + h);
            return (ease(b) - ease(a)) / (b - a) / dur;
        }
        // Movimiento con estela direccional: sigma = 0.29 · v · OBT, filter:none en reposo.
        function conRastro(o) {
            var ease = gsap.parseEase(o.curva);
            var st = { p: 0 };
            var filtro = 'url(#' + o.nodo.parentNode.id + ')';
            function aplicar() {
                var p = st.p;
                o.pos(ease(p), p);
                var v = (p <= 0 || p >= 1) ? 0 : Math.abs(o.dist) * velocidad(ease, p, o.dur);
                var s = Math.min(o.max, 0.29 * v * OBT);
                o.nodo.setAttribute('stdDeviation', o.eje === 'x' ? s.toFixed(2) + ' 0' : '0 ' + s.toFixed(2));
                o.el.style.filter = s < 0.3 ? 'none' : filtro;
            }
            aplicar();
            tl.fromTo(st, { p: 0 }, { p: 1, duration: o.dur, ease: 'none', onUpdate: aplicar, immediateRender: false }, o.at);
        }
        // Desenfoque como función pura del tiempo sobre un objeto de estado compartido: blur(px) > 0.05, «none» en reposo.
        function pintarBlur(els, d) {
            var f = d < 0.05 ? 'none' : 'blur(' + d.toFixed(2) + 'px)';
            for (var i = 0; i < els.length; i++) { els[i].style.filter = f; }
        }
        function blurTramo(st, els, at, dur, desde, hasta, curva, primero) {
            tl.fromTo(st, { d: desde }, { d: hasta, duration: dur, ease: curva, immediateRender: !!primero,
                onUpdate: function () { pintarBlur(els, st.d); } }, at);
        }

        // ---------- Escena 1 (0.0–1.05): la píldora se abre en «Mayor riesgo» y las filas barren ----------
        var ranking = $('ranking');
        // Recorte de radio fijo de la caja de la píldora (650–1270 × 414–526) a la caja final (260–1660 × 170–870); tinta → blanco.
        tl.fromTo(ranking, { clipPath: 'inset(244px 390px 344px 390px round 56px)' },
            { clipPath: 'inset(0px 0px 0px 0px round 28px)', duration: 0.5, ease: 'power3.inOut' }, T.morph);
        // La pintura (tinta → blanco) usa la misma curva pero termina a 0.40 s: las filas, que arrancan a 0.20 s,
        // ya no se leen sobre un gris a medio camino.
        tl.fromTo(ranking, { backgroundColor: '#1E1919' }, { backgroundColor: '#FFFFFF', duration: 0.35, ease: 'power3.inOut', immediateRender: false }, T.morph);
        // Contenido viejo fuera antes del 40 % del morph; el nuevo después del 60 %.
        tl.fromTo($('pildora'), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: 'power1.in' }, T.morph);
        tl.fromTo([$('titulo'), $('subtitulo')], { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.2, ease: 'power2.out', stagger: 0.03 }, 0.35);

        var filas = [], rellenos = [], cifras = [];
        for (var i = 0; i < 8; i++) { filas.push($('fila-' + i)); rellenos.push($('relleno-' + i)); cifras.push($('cifra-' + i)); }
        // Nombre y pista con la fila; la cifra de la fila se oculta aparte y llega 0.3 s después de su barra.
        // 0.20 + 7 × 0.03 + 0.5 = 0.91 s: la última barra termina; su cifra, 0.3 s después de arrancar la barra.
        tl.fromTo(filas, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out', stagger: 0.03 }, T.filas);
        tl.fromTo(rellenos, { clipPath: 'inset(0% 100% 0% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.5, ease: 'power4.out', stagger: 0.03 }, T.filas);
        tl.fromTo(cifras, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out', stagger: 0.03 }, T.filas + 0.3);
        tl.fromTo($('leyenda'), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out' }, 0.72);

        // ---------- Escena 2 (1.05–2.45): foco selectivo, despegue y apertura en la tarjeta de Iván ----------
        var contexto = [$('titulo'), $('subtitulo'), $('leyenda')];
        for (var c = 0; c < 8; c++) { if (c !== 2) { contexto.push(filas[c]); } }
        var dof = { d: 0 };
        // Foco vivo 0 → 6 px y opacidad 0.35 en el resto; la fila de Iván queda nítida.
        blurTramo(dof, contexto, T.foco, 0.30, 0, 6, 'power2.inOut', true);
        tl.fromTo(contexto, { opacity: 1 }, { opacity: 0.35, duration: 0.30, ease: 'power2.inOut', immediateRender: false }, T.foco);
        // La copia de la fila (sobre #EFECE7) entra encima de la fila real; idéntica, solo se ve el resaltado.
        var ivan = $('ivan');
        tl.fromTo(ivan, { opacity: 0 }, { opacity: 1, duration: 0.30, ease: 'power2.inOut' }, T.foco);
        // Ya cubierta por la copia opaca: se apaga para que no asome debajo cuando la copia se despega.
        tl.set(filas[2], { visibility: 'hidden' }, 1.36);

        // Despegue: z +40, scale 1.04, power3.out, con su sombra de fila.
        tl.fromTo(ivan, { z: 0, scale: 1 }, { z: 40, scale: 1.04, duration: 0.30, ease: 'power3.out', immediateRender: false }, T.despegue);
        tl.fromTo($('sombra-fila'), { opacity: 0 }, { opacity: 1, duration: 0.30, ease: 'power3.out' }, T.despegue);

        // Desenfoque total 0.95 s: vuelve a 0 (filter: none); queda solo la atenuación.
        blurTramo(dof, contexto, T.refoco, 0.30, 6, 0, 'power2.inOut', false);

        // Apertura anclada con recorte (fila → tarjeta 1200 × 600, radio 36), sobre todo hacia abajo; un solo tween.
        tl.fromTo(ivan,
            { clipPath: 'inset(190px 0px 354px 0px round 36px)', backgroundColor: '#EFECE7', z: 40, scale: 1.04 },
            { clipPath: 'inset(0px 64px 0px 64px round 36px)', backgroundColor: '#FFFFFF', z: 0, scale: 1, duration: 0.65, ease: 'power3.inOut', immediateRender: false }, T.abre);
        // Pose 0 → pico (rotX 4°, rotY −6° hacia 2.05 s) → 0 (plana a 2.40 s).
        tl.fromTo(ivan, { rotationX: 0, rotationY: 0 }, { rotationX: 4, rotationY: -6, duration: 0.30, ease: 'sine.inOut', immediateRender: false }, T.abre);
        tl.fromTo(ivan, { rotationX: 4, rotationY: -6 }, { rotationX: 0, rotationY: 0, duration: 0.35, ease: 'sine.inOut', immediateRender: false }, 2.05);
        // Sombra de tinta en capa aparte: crece de la caja de la fila a la de la tarjeta.
        tl.fromTo($('sombra'), { opacity: 0, scaleX: 1328 / 1200, scaleY: 56 / 600 },
            { opacity: 1, scaleX: 1, scaleY: 1, duration: 0.65, ease: 'power3.inOut' }, T.abre);
        tl.fromTo($('sombra-fila'), { opacity: 1 }, { opacity: 0, duration: 0.30, ease: 'power2.in', immediateRender: false }, T.abre);
        // Relevo de contenido dentro de la tarjeta: la fila fuera antes del 40 %, el marco al final.
        tl.fromTo($('fila-copia'), { opacity: 1 }, { opacity: 0, duration: 0.24, ease: 'power1.in' }, T.abre);
        tl.fromTo($('marco'), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power1.out' }, 2.20);
        // El ranking retrocede detrás: sus filas quedan al 12 % (0.35 × 0.343) y escala 0.97.
        tl.fromTo($('rig'), { opacity: 1, scale: 1 }, { opacity: 0.12 / 0.35, scale: 0.97, duration: 0.65, ease: 'power3.inOut' }, T.abre);

        // Cascada (2.15–2.65): avatar, nombre, matrícula, nivel y tendencia.
        tl.fromTo([$('avatar'), $('nombre-ivan'), $('matricula'), $('chip-nivel'), $('chip-alza')], { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out', stagger: 0.05 }, T.cascada);
        tl.fromTo($('divisor'), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out' }, 2.30);

        // ---------- Escena 3 (2.45–4.45): la barra frente al límite y «2» faltas restantes ----------
        // La fila «Faltas» entra como StaggerList (y 20 → 0); pista, línea discontinua y chip «Límite 20 %» llegan juntos a 2.45 s.
        tl.fromTo([$('barra'), $('rot-faltas'), $('rot-restantes')], { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out', stagger: 0.06 }, T.faltas);
        // 14.9 % sobre un eje de 0 a 30 %: el relleno mide (776 − 4) × 14.9 / 30 = 383 px; el hueco hasta la línea es el margen.
        tl.fromTo($('relleno-f'), { clipPath: 'inset(0% 100% 0% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.5, ease: 'power4.out' }, T.faltas);
        var tira = $('odo-tira');
        conRastro({ el: tira, nodo: $('mb-g'), at: T.odo, dur: 0.25, curva: 'power3.out', dist: 144, eje: 'y', max: 16,
            pos: function (e) { gsap.set(tira, { y: -144 * e }); } });
        tl.addLabel('read:faltas-restantes#0', T.odo + 0.25);
        tl.fromTo($('valor'), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power1.out' }, T.valor);
        tl.fromTo($('cruce'), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, T.cruce);

        // ---------- Escena 4 (4.45–7.6): la acción sugerida y su halo de foco ----------
        var accA = $('accion-a'), accB = $('accion-b');
        tl.fromTo($('accion-fondo'), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, T.accion);
        var bA = { d: 10 }, bB = { d: 10 };
        pintarBlur([accA], 10);
        pintarBlur([accB], 10);
        blurTramo(bA, [accA], T.accion, 0.36, 10, 0, 'power2.out', true);
        blurTramo(bB, [accB], T.accion + 0.09, 0.36, 10, 0, 'power2.out', true);
        tl.fromTo(accA, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.36, ease: 'power3.out' }, T.accion);
        tl.fromTo(accB, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.36, ease: 'power3.out' }, T.accion + 0.09);
        tl.addLabel('read:accion-sugerida#1', T.accion + 0.45);
        // Halo de foco nativo (sin cursor ni pulsación): es lo siguiente que hace la docente.
        // El anillo se enciende como el foco nativo (casi de golpe, al final del tramo) y la fila toma el fondo activo #EFECE7.
        tl.fromTo($('accion-halo'), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power3.in' }, T.halo);
        tl.fromTo($('accion-fondo'), { backgroundColor: '#F7F5F2' }, { backgroundColor: '#EFECE7', duration: 0.2, ease: 'power3.in', immediateRender: false }, T.halo);

        // ---------- Cámara de lectura (debajo de las escenas 3 y 4) ----------
        // Tres viajes cortos power3.inOut que siguen la voz y vuelven a la identidad antes del handoff:
        // empuje hacia el margen («…solo dos faltas»), encuadre de la acción antes de que llegue («Todavía…»),
        // y regreso a la tarjeta completa, centrada y a escala 1, a 6.65 s. Sin deriva: entre viajes la cámara está quieta.
        var cam = $('camara');
        tl.fromTo(cam, { scale: 1, x: 0, y: 0 }, { scale: 1.06, x: 0, y: 1, duration: 0.8, ease: 'power3.inOut' }, T.empuje);
        tl.fromTo(cam, { scale: 1.06, x: 0, y: 1 }, { scale: 1.04, x: 0, y: -40, duration: 0.8, ease: 'power3.inOut', immediateRender: false }, T.encuadre);
        tl.fromTo(cam, { scale: 1.04, x: 0, y: -40 }, { scale: 1, x: 0, y: 0, duration: 0.8, ease: 'power3.inOut', immediateRender: false }, T.regreso);

        // Cuadro quieto deliberado desde 6.65 s; la duración la fija este ancla.
        tl.set({}, {}, T.fin);

        window.__timelines = window.__timelines || {};
        window.__timelines["s07-a-tiempo"] = tl;
    })();
</script>
</template>
