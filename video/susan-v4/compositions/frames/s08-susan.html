      <div id="s08-susan-fant2" class="s08-susan-fantasma" aria-hidden="true"></div>

<!-- GSAP local: el CDN responde 403 en esta máquina (frame.md §1) -->
<script src="assets/vendor/gsap.min.js"></script>
<script>
    (function () {
        var ID = 's08-susan';
        // Obturador en segundos: el largo de la estela no depende de los fps del render (PILOTO §3c).
        var OBT = 1 / 60;
        function $(s) { return document.getElementById(ID + '-' + s); }

        // Tiempos locales; los de sfx_cues son contrato (whoosh-s 0.98 dentro de la caída, thud 1.00, draw 2.05, soft-in 3.20, sheen 4.60).
        var T = {
            cae: 0.60, contacto: 1.00, squashFin: 1.06,
            desliza: 1.45, marca: 1.45,
            subrayado: 2.05, lema: 3.20,
            barrido: 4.60, fundido: 5.70, fin: 6.0
        };
        var DESDE = -640;        // la ficha entra desde 640 px más arriba (fuera de cuadro)
        var DESLIZA = -162;      // de x = 900 a x = 738: lockup centrado en 960 con 44 px de separación (medido)

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // Velocidad de la curva en fracción por segundo (diferencia central sobre la misma curva: función pura de t).
        function velocidad(ease, p, dur) {
            var h = 0.002;
            var a = Math.max(0, p - h);
            var b = Math.min(1, p + h);
            return (ease(b) - ease(a)) / (b - a) / dur;
        }

        // Movimiento con estela direccional: σ = 0.29 · v · OBT (caja del obturador → gaussiana), filter:none en reposo.
        function conRastro(o) {
            var ease = gsap.parseEase(o.curva);
            var st = { p: 0 };
            var filtro = 'url(#' + o.nodo.parentNode.id + ')';
            function aplicar() {
                var p = st.p;
                var e = ease(p);
                o.pos(e, p);
                var v = (p <= 0 || p >= 1) ? 0 : Math.abs(o.dist) * velocidad(ease, p, o.dur);
                var s = Math.min(o.max, 0.29 * v * OBT);
                o.nodo.setAttribute('stdDeviation', o.eje === 'x' ? s.toFixed(2) + ' 0' : '0 ' + s.toFixed(2));
                o.el.style.filter = s < 0.3 ? 'none' : filtro;
                if (o.extra) { o.extra(p, v, ease); }
            }
            aplicar();
            tl.fromTo(st, { p: 0 }, { p: 1, duration: o.dur, ease: 'none', onUpdate: aplicar, immediateRender: false }, o.at);
        }

        // ---- Escena 1 (0–0.6 s): el cielo aclarado, vacío y quieto bajo la blur-crossfade. Nada que tweenear. ----

        // ---- Escena 2 (0.6–1.45 s): caída power2.in (velocidad máxima en el contacto) con estela SVG + 2 fantasmas ----
        var mov = $('mov');
        var f1 = $('fant1');
        var f2 = $('fant2');
        var DUR_CAIDA = T.contacto - T.cae;
        conRastro({ el: $('ficha'), nodo: $('mb-g'), at: T.cae, dur: DUR_CAIDA, curva: 'power2.in', dist: -DESDE, eje: 'y', max: 26,
            pos: function (e) { gsap.set(mov, { y: DESDE * (1 - e) }); },
            extra: function (p, v, ease) {
                var e = ease(p);
                var fuerza = (p <= 0 || p >= 1) ? 0 : Math.min(1, v / 2500);
                var p1 = Math.max(0, p - OBT / DUR_CAIDA);
                var p2 = Math.max(0, p - 2 * OBT / DUR_CAIDA);
                gsap.set(f1, { y: DESDE * (e - ease(p1)), opacity: 0.32 * fuerza });
                gsap.set(f2, { y: DESDE * (e - ease(p2)), opacity: 0.16 * fuerza });
            } });

        // Sombra azulada en capa aparte: aparece al acercarse, se contrae al tocar y se asienta (sin rebote).
        var sombra = $('sombra');
        tl.fromTo(sombra, { opacity: 0, scale: 1.24 }, { opacity: 0.55, scale: 1.12, duration: 0.30, ease: 'power2.in' }, T.contacto - 0.30);
        tl.fromTo(sombra, { opacity: 0.55, scale: 1.12 }, { opacity: 1, scale: 0.95, duration: 0.06, ease: 'power2.out', immediateRender: false }, T.contacto);
        tl.fromTo(sombra, { scale: 0.95 }, { scale: 1, duration: 0.24, ease: 'power3.out', immediateRender: false }, T.squashFin);

        // Contacto a 1.00 s: squash de volumen constante (1.07 × 0.93 ≈ 1), origen abajo, y recuperación sin rebote.
        var squash = $('squash');
        tl.fromTo(squash, { scaleX: 1, scaleY: 1 }, { scaleX: 1.07, scaleY: 0.93, duration: 0.06, ease: 'power2.out' }, T.contacto);
        tl.fromTo(squash, { scaleX: 1.07, scaleY: 0.93 }, { scaleX: 1, scaleY: 1, duration: 0.24, ease: 'power3.out', immediateRender: false }, T.squashFin);
        // Quieta de 1.30 a 1.45 s.

        // ---- Escena 3 (1.45–3.8 s): la ficha se corre a la izquierda y «SUSAN» se revela desde debajo de ella ----
        tl.fromTo(mov, { x: 0 }, { x: DESLIZA, duration: 0.34, ease: 'power3.inOut', immediateRender: false }, T.desliza);
        tl.fromTo($('marca'), { clipPath: 'inset(0% 100% 0% 0%)', x: -30 },
            { clipPath: 'inset(0% 0% 0% 0%)', x: 0, duration: 0.50, ease: 'power3.out' }, T.marca);
        tl.addLabel('read:SUSAN#0', T.marca + 0.50);

        // Subrayado dorado: dashoffset 104 → 0 (el remate redondo no asoma antes de empezar); el único oro del cuadro.
        tl.fromTo($('trazo'), { attr: { 'stroke-dashoffset': 104 } },
            { attr: { 'stroke-dashoffset': 0 }, duration: 0.80, ease: 'power2.out' }, T.subrayado);

        // Lema: y 16 → 0 y opacidad, power4.out, mientras la voz dice «Pasa lista en segundos».
        tl.fromTo($('lema'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.60, ease: 'power4.out' }, T.lema);
        tl.addLabel('read:lema#1', T.lema + 0.60);

        // ---- Escena 4 (3.8–6.0 s): quietud, barrido holográfico de una pasada (100 % → 0 % = izquierda → derecha) y fundido ----
        tl.fromTo($('holo'), { backgroundPosition: '100% 50%' },
            { backgroundPosition: '0% 50%', duration: 0.70, ease: 'power2.inOut' }, T.barrido);
        tl.fromTo($('velo'), { opacity: 0 }, { opacity: 1, duration: T.fin - T.fundido, ease: 'power1.inOut' }, T.fundido);

        tl.set({}, {}, T.fin);
        window.__timelines['s08-susan'] = tl;
    })();
</script>
