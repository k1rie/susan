<script>
    (function () {
        var ID = 's06-tendencia';
        var D = 7.45;
        // Obturador en segundos: el largo de la estela no depende de los fps del render (PILOTO 3c).
        var OBT = 1 / 60;
        var NS = 'http://www.w3.org/2000/svg';
        function $(s) { return document.getElementById(ID + '-' + s); }
        function lim(v, a, b) { return Math.max(a, Math.min(b, v)); }

        // ---------------- datos (frame.md 10) y geometria: area de trazo x 660-1700, 0 % en y 800, 60 % en y 344 ----------------
        var OBS = [13.3, 20.0, 22.0, 15.3, 16.7, 20.8];
        var PEND = 0.59;                       // +0.59 pp por semana
        var B0 = 24.8 - 15 * PEND;             // la recta de ajuste pasa por S15 = 24.8 %
        var TS = 10.074;                       // t(0.975, 4) x error de los residuos: la banda del 95 % de la app (S7 6.3-33.8, S15 0-54.6)
        function X(w) { return 660 + (w - 1) * (1040 / 14); }
        function Y(v) { return 800 - v * 7.6; }
        function ajuste(w) { return B0 + PEND * w; }
        function semi(w) { return TS * Math.sqrt(1 + 1 / 6 + Math.pow(w - 3.5, 2) / 17.5); }

        // marcas del eje X (S1, S3 ... S15, como la app)
        var htmlX = '';
        for (var s = 1; s <= 15; s += 2) {
            htmlX += '<div id="' + ID + '-ex-' + s + '" class="s06-tendencia-abs s06-tendencia-ex" style="left:' + (X(s) - 40).toFixed(1) + 'px">S' + s + '</div>';
        }
        $('ejex').innerHTML = htmlX;

        // series: ajuste S1-S6 y proyeccion S7-S15 (rectas; la proyeccion discontinua); la banda se arma en la escena 3
        var dAjuste = 'M' + X(1) + ' ' + Y(ajuste(1)) + ' L' + X(6) + ' ' + Y(ajuste(6));
        var dProy = 'M' + X(7) + ' ' + Y(ajuste(7)) + ' L' + X(15) + ' ' + Y(ajuste(15));
        $('ajuste').setAttribute('d', dAjuste);
        $('proy').setAttribute('d', dProy);
        $('proy-trazo').setAttribute('d', dProy);

        // puntos observados: tinta r 8 con aro blanco de 4 (circulo r 10, trazo 4); encendido: r 9 con aro de 5
        var puntos = [];
        for (var i = 0; i < OBS.length; i++) {
            var c = document.createElementNS(NS, 'circle');
            c.setAttribute('id', ID + '-p' + (i + 1));
            c.setAttribute('cx', X(i + 1).toFixed(2));
            c.setAttribute('cy', Y(OBS[i]).toFixed(2));
            c.setAttribute('r', '10');
            c.setAttribute('fill', '#1E1919');
            c.setAttribute('stroke', '#FFFFFF');
            c.setAttribute('stroke-width', '4');
            $('puntos').appendChild(c);
            puntos.push(c);
        }

        // tiras de los odometros (se generan una vez, antes de registrar el timeline)
        var LECT = ['13.3', '20.0', '22.0', '15.3', '16.7', '20.8'];
        $('tira').innerHTML = LECT.map(function (x) { return '<span>' + x + '</span>'; }).join('');
        var htmlCol = '';
        for (var k = 0; k <= 9; k++) { htmlCol += '<span>' + k + '</span>'; }
        $('col-tira').innerHTML = htmlCol;

        // trazos medidos (svg-path-draw); el ajuste lleva remate redondo: el desfase arranca un poco mas alla para que no asome
        var largoAj = $('ajuste').getTotalLength();
        $('ajuste').style.strokeDasharray = largoAj + ' ' + (largoAj + 12);
        $('ajuste').style.strokeDashoffset = String(largoAj + 6);
        var largoPr = $('proy-trazo').getTotalLength();
        $('proy-trazo').style.strokeDasharray = largoPr + ' ' + (largoPr + 4);
        $('proy-trazo').style.strokeDashoffset = String(largoPr);

        var tl = gsap.timeline({ paused: true });

        // ================= Escena 1 (0.00-0.85): relevo barras -> lineas con constantes =================
        // la camara llega del cuadro 5 en 1.05 (empuje hacia el viernes) y regresa a 1 con la misma curva y tiempo del recorte de
        // la tarjeta: del dia critico a la tendencia del semestre
        tl.fromTo($('camara'), { scale: 1.05 }, { scale: 1, duration: 0.70, ease: 'power3.inOut' }, 0.05);
        var fondosCas = [$('cas-lun'), $('cas-mie'), $('cas-vie')];
        // las casillas colapsan a su linea de cima (Vie conserva su escala 1.06 en la caja exterior)
        tl.fromTo(fondosCas, { scaleY: 1, transformOrigin: '50% 0%' }, { scaleY: 0.02, duration: 0.30, ease: 'power2.in' }, 0);
        tl.fromTo([$('cif-lun'), $('cif-mie'), $('cif-vie')], { opacity: 1, y: 0 }, { opacity: 0, y: -14, duration: 0.18, ease: 'power1.in' }, 0);
        // la meta, las etiquetas de dia y el titulo viejo se desvanecen con el colapso (antes del 40 % del morph)
        tl.to([$('dia-lun'), $('dia-mie'), $('dia-vie'), $('meta'), $('dias-t')], { opacity: 0, duration: 0.25, ease: 'power1.in' }, 0.02);
        tl.set(fondosCas, { opacity: 0 }, 0.30);

        // ...y esas lineas se estiran hasta ser la cuadricula de 60 / 40 / 20 % (constantes del relevo)
        var REJ = [
            { x: 600 - 1180, y: 496.9 - 344, sx: 280 / 1080, sy: 1.9, c: 'rgba(238,160,148,0.55)' },
            { x: 960 - 1180, y: 496.9 - 496, sx: 280 / 1080, sy: 1.9, c: 'rgba(239,166,155,0.55)' },
            { x: 1320 - 1180, y: 491.3 - 648, sx: 296.8 / 1080, sy: 2.015, c: 'rgba(235,141,129,1)' }
        ];
        var rejillas = [$('rej-60'), $('rej-40'), $('rej-20')];
        function deRej(k) { return function (i) { return REJ[i][k]; }; }
        gsap.set(rejillas, { opacity: 0 });
        tl.fromTo(rejillas, { x: deRej('x'), y: deRej('y'), scaleX: deRej('sx'), scaleY: deRej('sy'), backgroundColor: deRej('c') },
            { x: 0, y: 0, scaleX: 1, scaleY: 1, backgroundColor: 'rgba(231,226,220,0.8)', duration: 0.50, ease: 'power3.inOut' }, 0.25);
        tl.set(rejillas, { opacity: 1 }, 0.30);

        // la tarjeta crece en su sitio: superficie maquetada en la caja final y recorte de radio fijo (sin escala: aspectos
        // distintos); el borde de 2 px es la capa de abajo con el mismo recorte, 2 px mas grande
        var RECORTE = [['inset(90px 100px 80px 100px round 28px)', 'inset(0px 0px 0px 0px round 28px)'],
            ['inset(92px 102px 82px 102px round 26px)', 'inset(2px 2px 2px 2px round 26px)']];
        tl.fromTo([$('borde'), $('sup')], { clipPath: function (i) { return RECORTE[i][0]; } },
            { clipPath: function (i) { return RECORTE[i][1]; }, duration: 0.70, ease: 'power3.inOut' }, 0.05);

        // la pildora «Dia critico» suelta su texto antes del 40 % y se condensa en el punto r 7 que sera la cabeza de la guia (S1)
        tl.fromTo($('critico-t'), { opacity: 1 }, { opacity: 0, duration: 0.20, ease: 'power1.in' }, 0.05);
        // (recorte en %: la pildora mide lo que su texto, ~293 px, como en el cuadro 5; queda un punto de 14 x 14)
        tl.fromTo($('critico'), { x: 0, y: 0, clipPath: 'inset(0% 0% 0% 0% round 32px)' },
            { x: X(1) - 1320, y: Y(OBS[0]) - 451, clipPath: 'inset(39.0625% 47.614% 39.0625% 47.614% round 7px)', duration: 0.70, ease: 'power3.inOut' }, 0.05);
        tl.set($('critico'), { opacity: 0 }, 0.75);
        tl.set($('cabeza'), { opacity: 1 }, 0.75);

        // despues del 60 %: titulo, leyenda, marcas y la linea de 0 %
        tl.fromTo($('titulo'), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.40, ease: 'power3.out' }, 0.47);
        tl.fromTo([$('ley-1'), $('ley-2'), $('ley-3'), $('ley-4')], { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out', stagger: 0.05 }, 0.50);
        tl.fromTo([$('ey-60'), $('ey-40'), $('ey-20'), $('ey-0')], { opacity: 0, x: 10 },
            { opacity: 1, x: 0, duration: 0.30, ease: 'power3.out', stagger: 0.03 }, 0.52);
        tl.fromTo($('ejex').children, { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.30, ease: 'power3.out', stagger: 0.02 }, 0.52);
        tl.fromTo($('rej-0'), { opacity: 0 }, { opacity: 1, duration: 0.30, ease: 'power1.out' }, 0.50);

        // ================= Escena 2 (0.65-2.90): puntos, ajuste, guia S1 -> S6 y lectura por indice =================
        // los puntos brotan en ola (scale .3 -> 1) desde su propio centro
        tl.fromTo(puntos, { scale: 0.3, opacity: 0, svgOrigin: function (i) { return X(i + 1).toFixed(2) + ' ' + Y(OBS[i]).toFixed(2); } },
            { scale: 1, opacity: 1, duration: 0.25, ease: 'power3.out', stagger: 0.04 }, 0.65);
        // la recta de ajuste se dibuja S1 -> S6 antes de que la guia la recorra
        tl.fromTo($('ajuste'), { strokeDashoffset: largoAj + 6 }, { strokeDashoffset: 0, duration: 0.75, ease: 'power2.out' }, 0.75);

        // la lectura entra cuando la cabeza ya esta sobre S1
        tl.fromTo($('rot'), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.40, ease: 'power3.out' }, 0.85);
        tl.fromTo($('lect'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.90);

        // guia: UN driver por tramo; cabeza, linea bajo el punto, puntos encendidos y rotulo son funciones puras de los drivers
        var gA = { p: 0 }, gB = { p: 0 }, gL = { p: 0 };
        var cabeza = $('cabeza'), guia = $('guia'), rot = $('rot');
        var ultimo = -1;
        function valorGuia(w) {
            if (w <= 6) {
                var i0 = Math.min(4, Math.floor(w - 1));
                return OBS[i0] + (OBS[i0 + 1] - OBS[i0]) * ((w - 1) - i0);
            }
            if (w <= 7) { return OBS[5] + (ajuste(7) - OBS[5]) * (w - 6); }
            return ajuste(w);
        }
        function aplicarGuia() {
            var w = 1 + 5 * gA.p + 9 * gB.p;
            var x = X(w), y = Y(valorGuia(w));
            cabeza.setAttribute('cx', x.toFixed(2));
            cabeza.setAttribute('cy', y.toFixed(2));
            var y1 = y + 7;
            guia.setAttribute('x1', x.toFixed(2));
            guia.setAttribute('x2', x.toFixed(2));
            guia.setAttribute('y1', y1.toFixed(2));
            guia.setAttribute('y2', (y1 + (800 - y1) * gL.p).toFixed(2));
            for (var j = 0; j < puntos.length; j++) {
                var a = lim((0.5 - Math.abs(w - (j + 1))) / 0.25, 0, 1);
                puntos[j].setAttribute('r', (10 + 1.5 * a).toFixed(2));
                puntos[j].setAttribute('stroke-width', (4 + a).toFixed(2));
            }
            // el rotulo cambia solo al cambiar de indice, y solo en el tramo observado (sin valores intermedios en la proyeccion)
            var idx = Math.round(gA.p * 5);
            if (idx !== ultimo) { rot.textContent = 'Semana ' + (idx + 1); ultimo = idx; }
        }
        aplicarGuia();
        tl.fromTo(gL, { p: 0 }, { p: 1, duration: 0.30, ease: 'power3.out', onUpdate: aplicarGuia, immediateRender: false }, 0.85);
        var T_A = 1.15, D_A = 1.40;
        tl.fromTo(gA, { p: 0 }, { p: 1, duration: D_A, ease: 'power1.inOut', onUpdate: aplicarGuia, immediateRender: false }, T_A);

        // cifra heroe: rueda un renglon por cambio de indice; cada paso cae donde el indice mas cercano cambia (misma curva del
        // driver) y los pasos se suman como en vertical-spring-ticker, pero con power3.out (sin el back.out de la receta)
        var easeA = gsap.parseEase('power1.inOut');
        function invertir(f, yv) { var lo = 0, hi = 1; for (var it = 0; it < 40; it++) { var m = (lo + hi) / 2; if (f(m) < yv) { lo = m; } else { hi = m; } } return (lo + hi) / 2; }
        var PASOS = [0.1, 0.3, 0.5, 0.7, 0.9].map(function (yv) { return T_A + D_A * invertir(easeA, yv); });
        var D_PASO = 0.32, H_LECT = 144;
        var easePaso = gsap.parseEase('power3.out');
        function sumaPasos(t) { var sm = 0; for (var q = 0; q < PASOS.length; q++) { sm += easePaso(lim((t - PASOS[q]) / D_PASO, 0, 1)); } return sm; }
        var tira = $('tira'), mbLect = $('mb-lect-g');
        var tk = { t: PASOS[0] };
        function aplicarLectura() {
            var t = tk.t;
            tira.style.transform = 'translate(0px,' + (-sumaPasos(t) * H_LECT).toFixed(2) + 'px)';
            // fuera del tramo que rueda la velocidad es 0: la diferencia central en PASOS[0] mira el arranque del paso 1 (pendiente
            // maxima de power3.out) y dejaria «13.3» corrido mientras se lee quieto (frame.md 5.6: estela solo mientras gira).
            // Holgura de 1e-4 s: GSAP redondea tk.t a 6 decimales y, al volver hacia atras, lo deja apenas por encima de PASOS[0]
            var v = (t <= PASOS[0] + 1e-4 || t >= T_TK1 - 1e-4) ? 0 : Math.abs(sumaPasos(t + 0.002) - sumaPasos(t - 0.002)) / 0.004 * H_LECT;
            var sg = Math.min(12, 0.29 * v * OBT);
            mbLect.setAttribute('stdDeviation', '0 ' + sg.toFixed(2));
            tira.style.filter = sg < 0.3 ? 'none' : 'url(#' + ID + '-mb-lect)';
        }
        var T_TK1 = PASOS[PASOS.length - 1] + D_PASO;
        aplicarLectura();
        tl.fromTo(tk, { t: PASOS[0] }, { t: T_TK1, duration: T_TK1 - PASOS[0], ease: 'none', onUpdate: aplicarLectura, immediateRender: false }, PASOS[0]);

        // 2.60-2.90: el rotulo cambia en su sitio a «Ausentismo actual» y entra el hint real
        tl.fromTo(rot, { opacity: 1, y: 0 }, { opacity: 0, y: -10, duration: 0.12, ease: 'power1.in', immediateRender: false }, 2.60);
        tl.fromTo($('rot-actual'), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.20, ease: 'power3.out' }, 2.70);
        tl.fromTo($('hint'), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.30, ease: 'power3.out' }, 2.60);

        // ================= Escena 3 (2.55-4.85): proyeccion a S15, guia S6 -> S15, tooltip recto y banda del 95 % =================
        tl.fromTo($('proy-trazo'), { strokeDashoffset: largoPr }, { strokeDashoffset: 0, duration: 0.55, ease: 'power2.out' }, 2.55);
        // la guia viaja siempre detras de la punta del trazo (power2.out adelante, power1.inOut detras)
        tl.fromTo(gB, { p: 0 }, { p: 1, duration: 0.60, ease: 'power1.inOut', onUpdate: aplicarGuia, immediateRender: false }, 2.60);

        // tooltip: superficie en la caja final de la pildora, recortada al tamano del tooltip y llevada junto a la guia
        var TIP_W = 292, TIP_H = 56;
        var tipCx = 1684 - TIP_W / 2;
        var tipCy = Math.round(Y(ajuste(15)) - 52);   // en px enteros: el texto del tooltip no queda a medio pixel
        var pil = $('pildora');
        var clipTip = 'inset(' + (112 - TIP_H) / 2 + 'px ' + (620 - TIP_W) / 2 + 'px ' + (112 - TIP_H) / 2 + 'px ' + (620 - TIP_W) / 2 + 'px round 28px)';
        gsap.set(pil, { x: tipCx - 960, y: tipCy - 470, clipPath: clipTip });
        tl.fromTo(pil, { opacity: 0 }, { opacity: 1, duration: 0.10, ease: 'power1.out' }, 3.20);
        tl.fromTo(pil, { scale: 0.6 }, { scale: 1, duration: 0.35, ease: 'back.out(1.4)' }, 3.20);

        // la banda del intervalo del 95 % se abre (opacidad y abanico desde la recta proyectada) despues de «semestre»,
        // mientras «24.8 %» y «20.8 %» se leen quietos
        var banda = $('banda');
        var bA = { p: 0 };
        function aplicarBanda() {
            var arriba = [], abajo = [];
            for (var w = 7; w <= 15; w++) {
                var m = ajuste(w), h = semi(w) * bA.p;
                arriba.push(X(w).toFixed(1) + ',' + Y(Math.min(60, m + h)).toFixed(1));
                abajo.unshift(X(w).toFixed(1) + ',' + Y(Math.max(0, m - h)).toFixed(1));
            }
            banda.setAttribute('points', arriba.concat(abajo).join(' '));
        }
        aplicarBanda();
        tl.fromTo(banda, { opacity: 0 }, { opacity: 1, duration: 0.30, ease: 'power1.out' }, 3.80);
        tl.fromTo(bA, { p: 0 }, { p: 1, duration: 0.65, ease: 'power2.inOut', onUpdate: aplicarBanda, immediateRender: false }, 3.80);

        // 4.15-4.55: el subtitulo real entra desde el desenfoque, palabra por palabra (BlurText)
        var palabras = $('sub').children;
        tl.fromTo(palabras, { opacity: 0, y: -12, filter: 'blur(10px)' },
            { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.28, ease: 'power3.out', stagger: 0.02 }, 4.15);
        tl.set(palabras, { filter: 'none' }, 4.56);

        // ================= Escena 4 (4.85-7.45): relevo de la cifra a las personas =================
        tl.fromTo([$('tarjeta'), $('cabecera')], { opacity: 1 }, { opacity: 0, duration: 0.60, ease: 'power1.inOut', immediateRender: false }, 4.85);
        tl.fromTo($('halo-rosa'), { opacity: 0 }, { opacity: 1, duration: 0.80, ease: 'power1.inOut' }, 4.85);
        // el tooltip se despega y crece como pintura hasta la pildora 620 x 112 (radio 56) en el centro
        tl.fromTo(pil, { x: tipCx - 960, y: tipCy - 470, clipPath: clipTip },
            { x: 0, y: 0, clipPath: 'inset(0px 0px 0px 0px round 56px)', duration: 0.80, ease: 'power3.inOut', immediateRender: false }, 4.85);
        tl.fromTo($('tip'), { opacity: 1 }, { opacity: 0, duration: 0.26, ease: 'power1.in', immediateRender: false }, 4.85);
        tl.fromTo($('alumnos'), { opacity: 0, x: 36 }, { opacity: 1, x: 0, duration: 0.30, ease: 'power3.out' }, 5.40);

        // el «9» rueda de 0 a 9 en su columna (odometro con estela) y se asienta con un tic a 6.50
        var colTira = $('col-tira'), mbNueve = $('mb-nueve-g');
        var H9 = 88, DIST9 = 9 * H9;
        var easeRueda = gsap.parseEase('power3.out');
        var rueda = { p: 0 };
        function aplicarNueve() {
            var p = rueda.p;
            colTira.style.transform = 'translate(0px,' + (-DIST9 * easeRueda(p)).toFixed(2) + 'px)';
            var v = (p <= 0 || p >= 1) ? 0 : (easeRueda(Math.min(1, p + 0.002)) - easeRueda(Math.max(0, p - 0.002))) / 0.004 / 0.50 * DIST9;
            var sg = Math.min(16, 0.29 * v * OBT);
            mbNueve.setAttribute('stdDeviation', '0 ' + sg.toFixed(2));
            colTira.style.filter = sg < 0.3 ? 'none' : 'url(#' + ID + '-mb-nueve)';
        }
        aplicarNueve();
        // la columna aparece CON el giro (no antes): ningun «0 alumnos» quieto se llega a leer; al primer fotograma visible ya
        // rueda con estela
        tl.fromTo($('nueve'), { opacity: 0 }, { opacity: 1, duration: 0.10, ease: 'power1.out' }, 6.00);
        tl.fromTo(rueda, { p: 0 }, { p: 1, duration: 0.50, ease: 'none', onUpdate: aplicarNueve, immediateRender: false }, 6.00);
        // el tic: la pildora acusa el peso de la cifra (4 px, sin rebote): baja con el golpe y vuelve con inOut, asi llega a la
        // pose del relevo con velocidad 0 en 6.50 (sin tope seco) y queda quieta
        tl.fromTo(pil, { y: 0 }, { y: 4, duration: 0.05, ease: 'power2.out', immediateRender: false }, 6.40);
        tl.fromTo(pil, { y: 4 }, { y: 0, duration: 0.05, ease: 'power2.inOut', immediateRender: false }, 6.45);

        // duracion exacta del cuadro (quieto desde 6.50: handoff)
        tl.set({}, {}, D);

        window.__timelines = window.__timelines || {};
        window.__timelines['s06-tendencia'] = tl;
    })();
</script>
</template>
