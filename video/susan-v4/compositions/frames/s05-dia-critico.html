        // Atravesar (DINAMISMO F5): la cámara de la estación empuja con origen en la casilla Vie (1320, 590) y la lleva a (960, 560).
        var EMPUJE = { s: 1.3, x: -360, y: -30, blur: 8 };
        var LLEGA = 0.88;                  // la toma llega de 0.88 a 1 con origen (960, 560): la casilla mide 394 px contra 386 al cortar
        // Píldora y «Vie» en el último fotograma del empuje, calculados con las constantes de la estación (centro de la píldora
        // 1320, 451, alto 64; «Vie» 24 px en y=725; ninguna de las dos se levanta con la casilla):
        //   píldora: y = 560 + (451 - 590) * 1.3 = 379.3 -> 39.3 px bajo su sitio en la toma (340); alto 83.2 contra 82 y texto
        //   36.4 contra 36 -> escala 1.013; «Vie»: y = 560 + (725 - 590) * 1.3 = 735.5 -> 40.5 px sobre su sitio (776);
        //   24 * 1.3 / 38 = 0.821.
        var PILD0 = { y: 39.3, s: 1.013 };
        var DIA0 = { y: -40.5, s: 0.821 };

        // ---- tiras del odómetro: se generan UNA vez, antes de registrar el timeline ----
        // Cada columna arranca en blanco y rueda hacia arriba hasta su cifra; décimas y unidades con dos vueltas (las unidades
        // necesitan ese recorrido para seguir rodando hasta que asoman las decenas), decenas sin vuelta.
        function digitos(desde, vueltas, hasta) {
            var out = [''];
            for (var v = 0; v < vueltas; v++) { for (var d = 0; d <= 9; d++) { out.push(String(d)); } }
            for (var k = desde; k <= hasta; k++) { out.push(String(k)); }
            return out;
        }
        function tira(items, html) {
            var s = '';
            for (var i = 0; i < items.length; i++) { s += '<span data-layout-allow-overlap>' + (html ? items[i] : (items[i] || ' ')) + '</span>'; }
            return s;
        }
        var DIAS = [
            { k: 'lun', v: '17.7', t0: T.lun, t1: T.lunFin },
            { k: 'mie', v: '16.4', t0: T.mie, t1: T.mieFin },
            { k: 'vie', v: '21.8', t0: T.vie, t1: T.vieFin }
        ];
        DIAS.forEach(function (d) {
            var dec = Number(d.v.charAt(0)), uni = Number(d.v.charAt(1)), dcm = Number(d.v.charAt(3));
            d.cols = {
                d: digitos(1, 0, dec),   // decenas sin cero a la izquierda: blanco -> 1 (-> 2)
                u: digitos(0, 2, uni),
                p: ['', '.'],
                t: digitos(0, 2, dcm),
                q: ['', '<span class="' + ID + '-u">%</span>']
            };
            var cifra = $(d.k + '-cifra');
            var html = '';
            ['d', 'u', 'p', 't', 'q'].forEach(function (c) {
                html += '<span class="' + ID + '-col' + (c === 'q' ? ' ' + ID + '-pct' : '') + '"><span id="' + ID + '-' + d.k + '-' + c +
                    '" class="' + ID + '-tira">' + tira(d.cols[c], c === 'q') + '</span></span>';
            });
            cifra.innerHTML = html;
            $(d.k + '-g').innerHTML = tira(['–', ''], false);
        });

        // Estado inicial explícito: lo que GSAP transforma con immediateRender:false arranca ya con su transform identidad, así el
        // estado es idéntico venga de donde venga la búsqueda (sin «none» contra «matrix(1, 0, 0, 1, 0, 0)» según el camino).
        gsap.set([$('camara'), $('vie'), $('toma-rig'), $('toma-pildora-caja'), $('toma-dia'), $('toma-cas')], { x: 0, y: 0, scale: 1 });
        DIAS.forEach(function (d) { gsap.set([$(d.k + '-q'), $(d.k + '-p'), $(d.k + '-d'), $(d.k + '-g')], { y: 0 }); });

        // Velocidad de la curva en fracción por segundo (diferencia central sobre la misma curva: función pura de t).
        function velocidad(ease, p, dur) {
            var h = 0.002;
            var a = Math.max(0, p - h);
            var b = Math.min(1, p + h);
            return (ease(b) - ease(a)) / (b - a) / dur;
        }

        // Movimiento con estela direccional (PILOTO §3c): σ = 0.29 · v · OBT, filter:none en reposo y v = 0 en los extremos.
        function conRastro(o) {
            var ease = gsap.parseEase(o.curva);
            var st = { p: 0 };
            var filtro = 'url(#' + o.nodo.parentNode.id + ')';
            function aplicar() {
                var p = st.p;
                var e = ease(p);
                o.pos(e, p);
                var v = (p <= EPS || p >= 1 - EPS) ? 0 : Math.abs(o.dist) * velocidad(ease, p, o.dur);
                var s = Math.min(o.max, 0.29 * v * OBT);
                o.nodo.setAttribute('stdDeviation', o.eje === 'x' ? s.toFixed(2) + ' 0' : '0 ' + s.toFixed(2));
                o.el.style.filter = s < 0.3 ? 'none' : filtro;
            }
            aplicar();
            tl.fromTo(st, { p: 0 }, { p: 1, duration: o.dur, ease: 'none', onUpdate: aplicar, immediateRender: false }, o.at);
        }

        // Desenfoque como función pura del tiempo (PILOTO §3a): blur(px) mientras > 0.05, «none» en reposo.
        function desenfoque(el, at, dur, desde, curva) {
            var st = { d: desde };
            function aplicar() { el.style.filter = st.d < 0.05 ? 'none' : 'blur(' + st.d.toFixed(2) + 'px)'; }
            aplicar();
            tl.fromTo(st, { d: desde }, { d: 0, duration: dur, ease: curva, onUpdate: aplicar, immediateRender: false }, at);
        }

        // Filtro de la estación durante el empuje: una sola superficie y un solo driver (dos drivers sobre el mismo style.filter se
        // pisarían). Estela = velocidad (DINAMISMO §2.0.4): la estela horizontal sigue la velocidad real en pantalla del borde de la
        // casilla Vie, v = |dx/dt| + 148 · ds/dt (la traslación, power2.inOut, tiene su pico a la mitad del empuje; la escala,
        // power2.in, acelera hasta el corte) y σx = min(12, 0.29 · v · OBT). Encima va la rampa isotrópica 0 -> 8 px de los
        // últimos 0.25 s, que esconde el corte. En los extremos (p <= EPS, p >= 1 - EPS) el filtro es «none»: en p = 1 la capa ya
        // está oculta por el corte.
        var BORDE_VIE = 148.4;   // media casilla Vie levantada: 280 · 1.06 / 2 (su distancia al origen del empuje)
        function empujar(el, nodo) {
            var easeX = gsap.parseEase('power2.inOut');
            var easeS = gsap.parseEase('power2.in');
            var dur = T.corte - T.empuje;
            var previo = T.blurEmpuje - T.empuje;
            var rampa = T.corte - T.blurEmpuje;
            var estela = 'url(#' + nodo.parentNode.id + ')';
            var st = { p: 0 };
            function aplicar() {
                var p = st.p;
                if (p <= EPS || p >= 1 - EPS) { nodo.setAttribute('stdDeviation', '0 0'); el.style.filter = 'none'; return; }
                var v = Math.abs(EMPUJE.x) * velocidad(easeX, p, dur) + BORDE_VIE * (EMPUJE.s - 1) * velocidad(easeS, p, dur);
                var sx = Math.min(12, 0.29 * v * OBT);
                var b = EMPUJE.blur * Math.max(0, (p * dur - previo) / rampa);
                nodo.setAttribute('stdDeviation', sx.toFixed(2) + ' 0');
                var f = [];
                if (sx >= 0.3) { f.push(estela); }
                if (b >= 0.05) { f.push('blur(' + b.toFixed(2) + 'px)'); }
                el.style.filter = f.length ? f.join(' ') : 'none';
            }
            aplicar();
            tl.fromTo(st, { p: 0 }, { p: 1, duration: dur, ease: 'none', onUpdate: aplicar, immediateRender: false }, T.empuje);
        }

        // Desenfoque de llegada de la toma (desde -> 0 px). Arranca 2 ms antes del corte: así en el corte ya vale ~8 px y antes,
        // con la toma oculta, el filtro es «none».
        function enfocar(el, at, dur, desde, curva) {
            var ease = gsap.parseEase(curva);
            var ADEL = 0.002;
            var st = { p: 0 };
            function aplicar() {
                var d = desde * (1 - ease(st.p));
                el.style.filter = (st.p <= EPS || d < 0.05) ? 'none' : 'blur(' + d.toFixed(2) + 'px)';
            }
            aplicar();
            tl.fromTo(st, { p: 0 }, { p: 1, duration: dur + ADEL, ease: 'none', onUpdate: aplicar, immediateRender: false }, at - ADEL);
        }

        // Columna lenta del odómetro (un paso o pocos, del renglón `desde` al `hasta`): sin estela, power3.out, sin sobreimpulso.
        function rodar(el, desde, hasta, at, dur) {
            tl.fromTo(el, { y: -desde * H }, { y: -hasta * H, duration: dur, ease: 'power3.out', immediateRender: false }, at);
        }

        // Relleno que se tiñe como pintura: el color de la casilla brota desde la cifra (clip-path circular, excepción documentada
        // de las gráficas hechas a mano) y se asienta a opacidad plena; en reposo clip-path:none.
        // Radio = punto visible más lejano de la casilla redondeada desde (140, 85.5): centro del arco inferior (245, 155) a
        // 125.9 px + radio 35 = 160.9, + 1 px. Con la esquina de la caja (176) el círculo ya cubría todo a la mitad del tramo y el
        // relleno se veía asentado mucho antes que la cifra; así el tinte termina de llegar con ella.
        var RADIO = 162;
        function pintar(el, at, dur) {
            var ease = gsap.parseEase('power2.inOut');
            var st = { p: 0 };
            function aplicar() {
                var e = ease(st.p);
                if (st.p >= 1) { el.style.clipPath = 'none'; el.style.opacity = '1'; return; }
                el.style.clipPath = 'circle(' + (RADIO * e).toFixed(2) + 'px at 50% 45%)';
                el.style.opacity = (0.35 + 0.65 * e).toFixed(3);
            }
            aplicar();
            tl.fromTo(st, { p: 0 }, { p: 1, duration: dur, ease: 'none', onUpdate: aplicar, immediateRender: false }, at);
        }

        // ---- Scene 1 (0.00–1.40): el título de la estación entra con BlurText (blur 10 -> 0 y -.5em -> 0 por palabra, +90 ms)
        //      justo después del empuje de entrada: abre el capítulo de datos mientras la voz empieza «Con cada sesión» ----
        var tituloP = document.querySelectorAll('#' + ID + '-cabecera .' + ID + '-h1-p');
        for (var w = 0; w < tituloP.length; w++) {
            var atw = T.titulo + w * 0.09;
            tl.fromTo(tituloP[w], { opacity: 0, y: -13 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, atw);
            desenfoque(tituloP[w], atw, 0.45, 10, 'power2.out');
        }
        // R1 de entrada (un solo relevo): las tres casillas vacías («–») con su día debajo llegan juntas desde la derecha, como una
        // fila, escalonadas 0.10 s de izquierda a derecha: x +320 -> 0 en 0.5 s power3.out, opacidad 0 -> 1 en 0.15 s y estela
        // horizontal ligada a la velocidad (tope 12, la de una pieza); se posan nítidas. Son las tres estelas del tope.
        ['lun', 'mie', 'vie'].forEach(function (k, i) {
            var at = T.entra + i * T.paso;
            var entra = $(k + '-entra');
            tl.fromTo(entra, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'power1.out' }, at);
            conRastro({ el: $(k + '-hoja'), nodo: $('mb-' + k + '-x-g'), at: at, dur: T.entraDur, curva: 'power3.out', dist: T.entraDx, eje: 'x', max: 12,
                pos: function (e) { entra.style.transform = 'translateX(' + (T.entraDx * (1 - e)).toFixed(2) + 'px)'; } });
        });

        // ---- Scene 2 (1.20–3.55): las casillas se llenan una tras otra; cifra y relleno llegan juntos ----
        // Cascada derecha -> izquierda: arrancan escalonadas 0.04 s y se fijan de derecha a izquierda; las decenas dan el último
        // paso (PASO s, power3.out) y terminan exactamente en t1, con el tic. power3.out es cuártico en GSAP: un rodar largo que
        // termina en t1 se ve asentado ~0.15-0.2 s antes, así que la llegada visible del número la pone ese paso corto final
        // (lo último que se mueve, a <= 0.07 s del tic). Las unidades terminan también en t1: su cola larga ya se lee quieta
        // cuando las decenas van a dos tercios del paso; si se fijaran antes se leería un valor falso («7.7 %», «11.8 %»)
        // justo antes del tic. `ini` es el retraso desde t0; `fin`, los segundos antes de t1 en que la columna se detiene.
        var CASCADA = {
            q: { ini: 0.00, fin: 0.30 },   // %
            t: { ini: 0.00, fin: 0.16 },   // décimas, dos vueltas con estela
            p: { ini: 0.04, fin: 0.12 },   // punto
            u: { ini: 0.04, fin: 0.00 },   // unidades, dos vueltas con estela
            d: { ini: 0.08, fin: 0.30 }    // decenas antes del paso final (solo Vie: blanco -> 1, y el 1 -> 2 es el paso final)
        };
        var PASO = 0.20;
        DIAS.forEach(function (d) {
            var dur = d.t1 - d.t0;
            function tramo(c) { return { at: d.t0 + CASCADA[c].ini, dur: dur - CASCADA[c].ini - CASCADA[c].fin }; }
            pintar($(d.k + '-tinte'), d.t0, dur);
            // el guion de «sin dato» sube y sale de su ventana mientras entra la cifra (mismo sentido que el odómetro)
            rodar($(d.k + '-g'), 0, 1, d.t0, 0.32);
            var tiraT = $(d.k + '-t');
            var tiraU = $(d.k + '-u');
            var pasosT = d.cols.t.length - 1;
            var pasosU = d.cols.u.length - 1;
            var pasosD = d.cols.d.length - 1;
            var q = tramo('q'), t = tramo('t'), p = tramo('p'), u = tramo('u'), dd = tramo('d');
            rodar($(d.k + '-q'), 0, 1, q.at, q.dur);
            conRastro({ el: tiraT, nodo: $('mb-' + d.k + '-t-g'), at: t.at, dur: t.dur, curva: 'power3.out', dist: pasosT * H, eje: 'y', max: 16,
                pos: function (e) { tiraT.style.transform = 'translateY(' + (-pasosT * H * e).toFixed(2) + 'px)'; } });
            rodar($(d.k + '-p'), 0, 1, p.at, p.dur);
            conRastro({ el: tiraU, nodo: $('mb-' + d.k + '-u-g'), at: u.at, dur: u.dur, curva: 'power3.out', dist: pasosU * H, eje: 'y', max: 16,
                pos: function (e) { tiraU.style.transform = 'translateY(' + (-pasosU * H * e).toFixed(2) + 'px)'; } });
            // decenas: los pasos previos (si los hay) dentro de su tramo; el último, el más corto, cierra en t1
            if (pasosD > 1) { rodar($(d.k + '-d'), 0, pasosD - 1, dd.at, dd.dur); }
            rodar($(d.k + '-d'), pasosD - 1, pasosD, d.t1 - PASO, PASO);
        });
        readMark(tl, T.vieFin, 'Lun 17.7 · Mié 16.4 · Vie 21.8 %');

        // ---- Scene 3 (3.55–7.20): el bloque resaltado y el atravesar hacia el viernes ----
        // Vie se levanta mientras Lun y Mié bajan al 55 % (casilla y etiqueta)
        tl.fromTo($('vie'), { scale: 1 }, { scale: 1.06, duration: T.alzaFin - T.alza, ease: 'power3.out', immediateRender: false }, T.alza);
        tl.fromTo([$('lun'), $('mie'), $('lun-dia'), $('mie-dia')], { opacity: 1 },
            { opacity: 0.55, duration: T.alzaFin - T.alza, ease: 'power3.out', immediateRender: false }, T.alza);
        // píldora de tinta recta: 14 px desde abajo, sin sobreimpulso; un golpe corto que termina de llegar con el pop
        tl.fromTo($('pildora'), { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: T.pildFin - T.pild, ease: 'power3.out' }, T.pild);
        readMark(tl, T.pildFin, 'Día crítico: Viernes');

        // Empuje (4.95–5.40): escala 1 -> 1.3 con origen en la casilla Vie, power2.in (la velocidad máxima del acercamiento
        // llega al corte y la toma la continúa con su expo.out), y traslación que la deja en el centro de la toma. La traslación
        // va con power2.inOut: con power2.in la casilla cruzaba el corte a 2400 px/s hacia la izquierda y la toma la recibía
        // quieta (un frenazo seco); así llega centrada sin velocidad lateral y solo el acercamiento atraviesa el corte. Como el
        // pico lateral cae a la mitad (≈ 2400 px/s a 5.175 s), la estela horizontal de la capa lo sigue a él y no a la rampa:
        // ver `empujar`. Solo la cámara de la estación: el fondo y su halo no se mueven.
        tl.fromTo($('camara'), { scale: 1 }, { scale: EMPUJE.s, duration: T.corte - T.empuje, ease: 'power2.in', immediateRender: false }, T.empuje);
        tl.fromTo($('camara'), { x: 0, y: 0 }, { x: EMPUJE.x, y: EMPUJE.y, duration: T.corte - T.empuje, ease: 'power2.inOut', immediateRender: false }, T.empuje);
        empujar($('estacion'), $('mb-estacion-x-g'));
        // Todo lo visible coincide en el corte (DINAMISMO §2.3 a): lo que no existe en la toma (tarjeta, título, selector, Lun y
        // Mié) se apaga mientras viaja rápido y desenfocado, sin moverse por su cuenta; a 5.36 ya no está, así que en el corte
        // solo quedan la casilla Vie, su día y la píldora, que la toma recibe en el mismo lugar.
        tl.fromTo([$('cabecera'), $('selector'), $('tarjeta'), $('lun-grupo'), $('mie-grupo')], { opacity: 1 },
            { opacity: 0, duration: T.contextoFin - T.contexto, ease: 'power1.in', immediateRender: false }, T.contexto);

        // Corte bajo el desenfoque: en el pico de velocidad la estación se cambia por la toma del viernes.
        gsap.set($('toma'), { autoAlpha: 0 });
        tl.set($('estacion'), { autoAlpha: 0 }, T.corte);
        tl.set($('toma'), { autoAlpha: 1 }, T.corte);
        // Llegada (5.40–5.95, expo.out): la toma ya maquetada a su escala final llega de 0.88 a 1 desde (960, 560) y de 8 a 0 px;
        // la píldora y «Vie» llegan en su propia capa, con la misma curva, desde donde los dejó el empuje.
        var dLlega = T.llegaFin - T.corte;
        tl.fromTo($('toma-rig'), { scale: LLEGA }, { scale: 1, duration: dLlega, ease: 'expo.out', immediateRender: false }, T.corte);
        tl.fromTo($('toma-pildora-caja'), { y: PILD0.y, scale: PILD0.s }, { y: 0, scale: 1, duration: dLlega, ease: 'expo.out', immediateRender: false }, T.corte);
        tl.fromTo($('toma-dia'), { y: DIA0.y, scale: DIA0.s }, { y: 0, scale: 1, duration: dLlega, ease: 'expo.out', immediateRender: false }, T.corte);
        enfocar($('toma'), T.corte, dLlega, EMPUJE.blur, 'expo.out');

        // el renglón real de «Ver cifras por día» entra bajo «Vie» desde el desenfoque (10 -> 0 px, y -12 -> 0), nítido al posarse
        tl.fromTo($('toma-meta'), { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: T.metaFin - T.meta, ease: 'power3.out' }, T.meta);
        desenfoque($('toma-meta-t'), T.meta, T.metaFin - T.meta, 10, 'power2.out');

        // anillo real del día crítico: svg-path-draw sobre el rectángulo redondeado (coordenadas del viewBox; ver el CSS del anillo).
        // Revisión r1: el trazo arrancaba arriba al centro, justo bajo la píldora, y power2.out llega con velocidad 0, así que de
        // 6.0 a 6.15 s quedaba ahí una muesca clara de 1-3 px que se cerraba muy despacio, con el arranque recto como escalón.
        // Ahora arranca a 45° en la esquina superior izquierda (lejos de la píldora), con remates redondos (la punta que avanza
        // es un trazo, no un escalón), y el camino da la vuelta completa y sigue SOLAPE px más sobre su propio arranque: el
        // trazo de un solo camino se pinta como unión, así que al cerrarse no queda costura. El trazado visible (L px) se cierra
        // justo en T.anilloFin, con el pop-1 y el latido, todavía con velocidad (~450 px/s, < 8 px por fotograma a 60 fps): la
        // rendija dura a lo más un fotograma. El tramo que sigue (el solape) corre sobre lo ya trazado y no se ve.
        var AN = { x0: 3.7, y0: 3.7, x1: 457.1, y1: 313.1, r: 58.7 };
        var SOLAPE = 18;
        var trazo = $('anillo-trazo');
        (function () {
            var r = AN.r, a = AN.x0 + r, b = AN.y0 + r, c = AN.x1 - r, e = AN.y1 - r;
            function punto(th) { return (a + r * Math.cos(th)).toFixed(3) + ' ' + (b + r * Math.sin(th)).toFixed(3); }
            var arco = 'A' + r + ' ' + r + ' 0 0 1 ';
            var th0 = 1.25 * Math.PI;   // 225°: la mitad del arco superior izquierdo
            trazo.setAttribute('d', 'M' + punto(th0) + ' ' + arco + a + ' ' + AN.y0 + ' H' + c + ' ' + arco + AN.x1 + ' ' + b +
                ' V' + e + ' ' + arco + c + ' ' + AN.y1 + ' H' + a + ' ' + arco + AN.x0 + ' ' + e + ' V' + b + ' ' +
                arco + punto(th0) + ' ' + arco + punto(th0 + SOLAPE / r));
        })();
        var LARGO = 2 * (AN.x1 - AN.x0 - 2 * AN.r) + 2 * (AN.y1 - AN.y0 - 2 * AN.r) + 2 * Math.PI * AN.r;   // la vuelta, 1424.8 px
        var CIERRE = LARGO / (LARGO + SOLAPE);   // fracción del camino (pathLength 100) en que el trazo se cierra
        var easeA = gsap.parseEase('power2.out');
        // power2.out es cúbico en GSAP: e(p) = CIERRE en p = 1 - (1 - CIERRE)^(1/3); el tramo se alarga para que ese p caiga en
        // T.anilloFin (0.40 s de trazado visible, como antes) y el resto, ~0.12 s, es el solape invisible.
        var durA = (T.anilloFin - T.anillo) / (1 - Math.cbrt(1 - CIERRE));
        var stA = { p: 0 };
        // con remates redondos un guion de largo 0 pintaría un punto: oculto mientras no hay trazo. Al mostrarlo se HEREDA la
        // visibilidad (nunca 'visible'): 'visible' vence al visibility:hidden con que el runtime oculta el cuadro inactivo, y el
        // anillo se transparentaba en la blur-crossfade F7 → F8 (ensamblado, 49.0–49.5 s)
        function anillo() {
            var largo = 100 * easeA(stA.p);
            trazo.setAttribute('stroke-dasharray', largo.toFixed(3) + ' 200');
            trazo.setAttribute('visibility', largo < 0.01 ? 'hidden' : 'inherit');
        }
        anillo();
        tl.fromTo(stA, { p: 0 }, { p: 1, duration: durA, ease: 'none', onUpdate: anillo, immediateRender: false }, T.anillo);
        readMark(tl, T.llegaFin, 'Vie 21.8 % · 32 ausencias en 6 sesiones');

        // al cerrarse el anillo la casilla late una vez (1 -> 1.04 -> 1 desde su centro, sin sobreimpulso: va y vuelve a su escala)
        // y queda quieta desde 6.40 s, 0.12 s antes de «viernes»
        var subida = 0.08;
        tl.fromTo($('toma-cas'), { scale: 1 }, { scale: 1.04, duration: subida, ease: 'power2.out', immediateRender: false }, T.latido);
        tl.fromTo($('toma-cas'), { scale: 1.04 }, { scale: 1, duration: T.latidoFin - T.latido - subida, ease: 'power2.inOut', immediateRender: false }, T.latido + subida);

        // duración exacta del cuadro
        tl.set({}, {}, T.D);

        window.__timelines = window.__timelines || {};
        window.__timelines["s05-dia-critico"] = tl;
    })();
</script>
