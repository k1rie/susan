<script>
    (function () {
        var ID = 's05-dia-critico';
        // Obturador en segundos (PILOTO §3c): el largo de la estela es el mismo a 30 y a 60 fps.
        var OBT = 1 / 60;
        // Alto de cada renglón del odómetro: 1.2 x 44 px (constante en CSS, nunca medido en el render).
        var H = 54;
        function $(s) { return document.getElementById(ID + '-' + s); }

        var tl = gsap.timeline({ paused: true });

        // readMark, copiado sin cambios del bloque canónico v4 (scripts/frame-helpers.snippet.js); el resto del bloque (cámara y
        // pose 3D) no se pega porque este cuadro no mueve cámara ni inclina nada.
        window.SFXN = window.SFXN || 0;   // contador unico de etiquetas (compartido por todos los cuadros de la pagina)
        function readMark(tl, t, frase) {
            tl.addLabel('read:' + frase + '#' + (window.SFXN++), t);
            return t;
        }

        // Tiempos del bloque (STORYBOARD, Frame 5) y de sfx_cues: el tween nombrado empieza o termina en ese instante.
        var T = {
            titulo: 0.45,                 // el título de la estación entra con BlurText al terminar el empuje de entrada
            lun: 1.20, lunFin: 1.90,      // 1.90 tick-1
            mie: 1.70, mieFin: 2.40,      // 2.40 tick-2
            vie: 2.20, vieFin: 2.90,      // 2.90 tick-3
            casillas: 0.60,               // las casillas vacías entran como la TiraSemana real (opacidad + escala .92 -> 1, +70 ms)
            alza: 3.55, alzaFin: 4.00,    // bloque resaltado: Vie se levanta, Lun y Mié al 55 % (en el hueco de la voz)
            // 4.55 pop-2 (fin de la entrada de la píldora). La entrada ocupa solo los últimos 0.20 s de la ventana 4.20–4.55:
            // power3.out es cuártico en GSAP y en 0.35 s la píldora se veía llegada ~0.15 s antes del pop.
            pild: 4.35, pildFin: 4.55,
            empuje: 4.55, empujeFin: 6.15, // la cámara se acerca al viernes mientras la voz pregunta «qué día faltan más…»
            meta: 5.20,                   // «32 ausencias en 6 sesiones» desde el desenfoque
            anillo: 5.70, anilloFin: 6.10, // 5.70 draw (inicio del trazo)
            latido: 6.10, latidoFin: 6.30, // 6.10 pop-1: la casilla late una vez al cerrarse su anillo; quieto desde 6.30 (handoff_out)
            D: 7.2
        };
        var EMPUJE = 1.05;                 // escala final de la cámara (origen 1320, 540): el cuadro 6 arranca así

        // ---- tiras del odómetro: se generan UNA vez, antes de registrar el timeline ----
        // Cada columna arranca en blanco y rueda hacia arriba hasta su cifra; décimas y unidades con dos vueltas (las unidades
        // necesitan ese recorrido para seguir rodando hasta que asoman las decenas), decenas sin vuelta.
        function digitos(desde, vueltas, hasta) {
            var out = [''];
            for (var v = 0; v < vueltas; v++) { for (var d = 0; d <= 9; d++) { out.push(String(d)); } }
            for (var k = desde; k <= hasta; k++) { out.push(String(k)); }
            return out;
        }
        function tira(items, html) {
            var s = '';
            for (var i = 0; i < items.length; i++) { s += '<span>' + (html ? items[i] : (items[i] || ' ')) + '</span>'; }
            return s;
        }
        var DIAS = [
            { k: 'lun', v: '17.7', t0: T.lun, t1: T.lunFin },
            { k: 'mie', v: '16.4', t0: T.mie, t1: T.mieFin },
            { k: 'vie', v: '21.8', t0: T.vie, t1: T.vieFin }
        ];
        DIAS.forEach(function (d) {
            var dec = Number(d.v.charAt(0)), uni = Number(d.v.charAt(1)), dcm = Number(d.v.charAt(3));
            d.cols = {
                d: digitos(1, 0, dec),   // decenas sin cero a la izquierda: blanco -> 1 (-> 2)
                u: digitos(0, 2, uni),
                p: ['', '.'],
                t: digitos(0, 2, dcm),
                q: ['', '<span class="' + ID + '-u">%</span>']
            };
            var cifra = $(d.k + '-cifra');
            var html = '';
            ['d', 'u', 'p', 't', 'q'].forEach(function (c) {
                html += '<span class="' + ID + '-col' + (c === 'q' ? ' ' + ID + '-pct' : '') + '"><span id="' + ID + '-' + d.k + '-' + c +
                    '" class="' + ID + '-tira">' + tira(d.cols[c], c === 'q') + '</span></span>';
            });
            cifra.innerHTML = html;
            $(d.k + '-g').innerHTML = tira(['–', ''], false);
        });

        // Velocidad de la curva en fracción por segundo (diferencia central sobre la misma curva: función pura de t).
        function velocidad(ease, p, dur) {
            var h = 0.002;
            var a = Math.max(0, p - h);
            var b = Math.min(1, p + h);
            return (ease(b) - ease(a)) / (b - a) / dur;
        }

        // Movimiento con estela direccional (PILOTO §3c): σ = 0.29 · v · OBT, filter:none en reposo.
        function conRastro(o) {
            var ease = gsap.parseEase(o.curva);
            var st = { p: 0 };
            var filtro = 'url(#' + o.nodo.parentNode.id + ')';
            function aplicar() {
                var p = st.p;
                var e = ease(p);
                o.pos(e, p);
                var v = (p <= 0 || p >= 1) ? 0 : Math.abs(o.dist) * velocidad(ease, p, o.dur);
                var s = Math.min(o.max, 0.29 * v * OBT);
                o.nodo.setAttribute('stdDeviation', o.eje === 'x' ? s.toFixed(2) + ' 0' : '0 ' + s.toFixed(2));
                o.el.style.filter = s < 0.3 ? 'none' : filtro;
            }
            aplicar();
            tl.fromTo(st, { p: 0 }, { p: 1, duration: o.dur, ease: 'none', onUpdate: aplicar, immediateRender: false }, o.at);
        }

        // Desenfoque como función pura del tiempo (PILOTO §3a): blur(px) mientras > 0.05, «none» en reposo.
        function desenfoque(el, at, dur, desde, curva) {
            var st = { d: desde };
            function aplicar() { el.style.filter = st.d < 0.05 ? 'none' : 'blur(' + st.d.toFixed(2) + 'px)'; }
            aplicar();
            tl.fromTo(st, { d: desde }, { d: 0, duration: dur, ease: curva, onUpdate: aplicar, immediateRender: false }, at);
        }

        // Columna lenta del odómetro (un paso o pocos, del renglón `desde` al `hasta`): sin estela, power3.out, sin sobreimpulso.
        function rodar(el, desde, hasta, at, dur) {
            tl.fromTo(el, { y: -desde * H }, { y: -hasta * H, duration: dur, ease: 'power3.out', immediateRender: false }, at);
        }

        // Relleno que se tiñe como pintura: el color de la casilla brota desde la cifra (clip-path circular, excepción documentada
        // de las gráficas hechas a mano) y se asienta a opacidad plena; en reposo clip-path:none.
        // Radio = punto visible más lejano de la casilla redondeada desde (140, 85.5): centro del arco inferior (245, 155) a
        // 125.9 px + radio 35 = 160.9, + 1 px. Con la esquina de la caja (176) el círculo ya cubría todo a la mitad del tramo y el
        // relleno se veía asentado mucho antes que la cifra; así el tinte termina de llegar con ella.
        var RADIO = 162;
        function pintar(el, at, dur) {
            var ease = gsap.parseEase('power2.inOut');
            var st = { p: 0 };
            function aplicar() {
                var e = ease(st.p);
                if (st.p >= 1) { el.style.clipPath = 'none'; el.style.opacity = '1'; return; }
                el.style.clipPath = 'circle(' + (RADIO * e).toFixed(2) + 'px at 50% 45%)';
                el.style.opacity = (0.35 + 0.65 * e).toFixed(3);
            }
            aplicar();
            tl.fromTo(st, { p: 0 }, { p: 1, duration: dur, ease: 'none', onUpdate: aplicar, immediateRender: false }, at);
        }

        // ---- Scene 1 (0.00–1.20): el título de la estación entra con BlurText (blur 10 -> 0 y -.5em -> 0 por palabra, +90 ms)
        //      justo después del empuje de entrada: abre el capítulo de datos mientras la voz empieza «Con cada sesión» ----
        var tituloP = document.querySelectorAll('#' + ID + '-cabecera .' + ID + '-h1-p');
        for (var w = 0; w < tituloP.length; w++) {
            var atw = T.titulo + w * 0.09;
            tl.fromTo(tituloP[w], { opacity: 0, y: -13 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, atw);
            desenfoque(tituloP[w], atw, 0.45, 10, 'power2.out');
        }
        // las tres casillas vacías («–») y sus días entran como la TiraSemana real: opacidad + escala .92 -> 1, 0.5 s, +70 ms
        [['lun', 'lun-dia'], ['mie', 'mie-dia'], ['vie', 'vie-dia']].forEach(function (par, k) {
            tl.fromTo([$(par[0]), $(par[1])], { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'power3.out' }, T.casillas + k * 0.07);
        });

        // ---- Scene 2 (1.20–3.65): las casillas se llenan una tras otra; cifra y relleno llegan juntos ----
        // Cascada derecha -> izquierda: arrancan escalonadas 0.04 s y se fijan de derecha a izquierda; las decenas dan el último
        // paso (PASO s, power3.out) y terminan exactamente en t1, con el tic. power3.out es cuártico en GSAP: un rodar largo que
        // termina en t1 se ve asentado ~0.15-0.2 s antes, así que la llegada visible del número la pone ese paso corto final
        // (lo último que se mueve, a <= 0.07 s del tic). Las unidades terminan también en t1: su cola larga ya se lee quieta
        // cuando las decenas van a dos tercios del paso; si se fijaran antes se leería un valor falso («7.7 %», «11.8 %»)
        // justo antes del tic. `ini` es el retraso desde t0; `fin`, los segundos antes de t1 en que la columna se detiene.
        var CASCADA = {
            q: { ini: 0.00, fin: 0.30 },   // %
            t: { ini: 0.00, fin: 0.16 },   // décimas, dos vueltas con estela
            p: { ini: 0.04, fin: 0.12 },   // punto
            u: { ini: 0.04, fin: 0.00 },   // unidades, dos vueltas con estela
            d: { ini: 0.08, fin: 0.30 }    // decenas antes del paso final (solo Vie: blanco -> 1, y el 1 -> 2 es el paso final)
        };
        var PASO = 0.20;
        DIAS.forEach(function (d) {
            var dur = d.t1 - d.t0;
            function tramo(c) { return { at: d.t0 + CASCADA[c].ini, dur: dur - CASCADA[c].ini - CASCADA[c].fin }; }
            pintar($(d.k + '-tinte'), d.t0, dur);
            // el guion de «sin dato» sube y sale de su ventana mientras entra la cifra (mismo sentido que el odómetro)
            rodar($(d.k + '-g'), 0, 1, d.t0, 0.32);
            var tiraT = $(d.k + '-t');
            var tiraU = $(d.k + '-u');
            var pasosT = d.cols.t.length - 1;
            var pasosU = d.cols.u.length - 1;
            var pasosD = d.cols.d.length - 1;
            var q = tramo('q'), t = tramo('t'), p = tramo('p'), u = tramo('u'), dd = tramo('d');
            rodar($(d.k + '-q'), 0, 1, q.at, q.dur);
            conRastro({ el: tiraT, nodo: $('mb-' + d.k + '-t-g'), at: t.at, dur: t.dur, curva: 'power3.out', dist: pasosT * H, eje: 'y', max: 16,
                pos: function (e) { tiraT.style.transform = 'translateY(' + (-pasosT * H * e).toFixed(2) + 'px)'; } });
            rodar($(d.k + '-p'), 0, 1, p.at, p.dur);
            conRastro({ el: tiraU, nodo: $('mb-' + d.k + '-u-g'), at: u.at, dur: u.dur, curva: 'power3.out', dist: pasosU * H, eje: 'y', max: 16,
                pos: function (e) { tiraU.style.transform = 'translateY(' + (-pasosU * H * e).toFixed(2) + 'px)'; } });
            // decenas: los pasos previos (si los hay) dentro de su tramo; el último, el más corto, cierra en t1
            if (pasosD > 1) { rodar($(d.k + '-d'), 0, pasosD - 1, dd.at, dd.dur); }
            rodar($(d.k + '-d'), pasosD - 1, pasosD, d.t1 - PASO, PASO);
        });
        readMark(tl, T.vieFin, 'Lun 17.7 · Mié 16.4 · Vie 21.8 %');

        // ---- Scene 3 (3.65–7.20): el bloque resaltado ----
        // Vie se levanta mientras Lun y Mié bajan al 55 % (casilla y etiqueta)
        tl.fromTo($('vie'), { scale: 1 }, { scale: 1.06, duration: T.alzaFin - T.alza, ease: 'power3.out', immediateRender: false }, T.alza);
        tl.fromTo([$('lun'), $('mie'), $('lun-dia'), $('mie-dia')], { opacity: 1 },
            { opacity: 0.55, duration: T.alzaFin - T.alza, ease: 'power3.out', immediateRender: false }, T.alza);
        // píldora de tinta recta: 14 px desde abajo, sin sobreimpulso; un golpe corto que termina de llegar con el pop
        tl.fromTo($('pildora'), { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: T.pildFin - T.pild, ease: 'power3.out' }, T.pild);
        readMark(tl, T.pildFin, 'Día crítico: Viernes');
        // meta real bajo «Vie»: BlurText por palabra (blur 10 -> 0, y -.5em -> 0), nítida al asentarse
        var palabras = document.querySelectorAll('#' + ID + '-meta .' + ID + '-palabra');
        for (var i = 0; i < palabras.length; i++) {
            var at = T.meta + i * 0.09;
            tl.fromTo(palabras[i], { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.62, ease: 'power3.out' }, at);
            desenfoque(palabras[i], at, 0.62, 10, 'power2.out');
        }
        // la cámara se acerca al viernes: escala 1 -> 1.05 con origen en la casilla Vie (sine.inOut, 1.55 s, un solo gesto que
        // no vuelve); la casilla, la píldora y la meta quedan casi en su sitio y el resto se abre hacia los bordes
        tl.fromTo($('camara'), { scale: 1 }, { scale: EMPUJE, duration: T.empujeFin - T.empuje, ease: 'sine.inOut' }, T.empuje);
        // anillo real del día crítico: svg-path-draw sobre el rectángulo redondeado (arranca bajo la píldora y da la vuelta)
        var trazo = $('anillo-trazo');
        var stA = { p: 0 };
        var easeA = gsap.parseEase('power2.out');
        function anillo() { trazo.setAttribute('stroke-dashoffset', (100 * (1 - easeA(stA.p))).toFixed(3)); }
        anillo();
        tl.fromTo(stA, { p: 0 }, { p: 1, duration: T.anilloFin - T.anillo, ease: 'none', onUpdate: anillo, immediateRender: false }, T.anillo);
        // al cerrarse el anillo la casilla late una vez (1.06 -> 1.105 -> 1.06, sin sobreimpulso: va y vuelve a su escala) y
        // queda quieta desde 6.30 s, 0.22 s antes de «viernes». El latido crece hacia abajo (y +4.3 px compensa el borde de
        // arriba): el anillo nunca se mete bajo la píldora.
        tl.fromTo($('vie'), { scale: 1.06, y: 0 }, { scale: 1.105, y: 4.3, duration: 0.08, ease: 'power2.out', immediateRender: false }, T.latido);
        tl.fromTo($('vie'), { scale: 1.105, y: 4.3 }, { scale: 1.06, y: 0, duration: T.latidoFin - T.latido - 0.08, ease: 'power2.inOut', immediateRender: false }, T.latido + 0.08);

        // duración exacta del cuadro
        tl.set({}, {}, T.D);

        window.__timelines = window.__timelines || {};
        window.__timelines["s05-dia-critico"] = tl;
    })();
</script>
</template>
