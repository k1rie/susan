        desenfoque($('escena'), T.foco, 0.85, 20, 'power2.out');
        // la cifra lleva el mismo rack en su propio rig, y nada mas: queda registrada con la barra y nunca se mueve con el
        // pliegue. El rack tambien reencuadra (y -60 -> 0): la barra sola abre en el centro optico del cuadro y baja a su fila
        // mientras la cifra ocupa el espacio de arriba
        tl.fromTo([camara, cifraRig], { scale: 1.12, y: -60 }, { scale: 1, y: 0, duration: 1.2, ease: 'power3.out' }, T.foco);
        // la columna de las centenas esta vacia (U+2007) y rueda UN renglon, de vacio a 5, con estela solo mientras va rapido:
        // arranca a 0.70 s con el 5 todavia bajo la mascara, que asoma hacia 0.80 s, cuando el rack ya bajo de 1 px; se asienta
        // con el tic de 1.65 s, 0.3 s antes de «cinco». «5» es la unica cifra que aparece en la escena.
        conRastro({ el: tira1, nodo: $('mb1-g'), at: T.giro, dur: T.tic5 - T.giro, curva: 'power3.out', dist: H, max: 16,
            pos: function (e) { gsap.set(tira1, { y: -H * e }); } });

        // ================= Escena 2 (1.15-2.95): «5 min», el primer tramo de tinta y «cada clase» =================
        tl.fromTo($('min'), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power3.out' }, T.tic5 - 0.25);

        // barras: un solo estado y tres drivers (relleno de Lun, pliegue, pulsos de la cuenta); el recorte se reescribe desde todos.
        // Mie y Vie ya traen su tramo de tinta: cada clase pierde los mismos cinco minutos.
        var pistas = [], tintasM = [], tintas = [], tintasW = [], filasB = [];
        for (var bi = 0; bi < BARRAS; bi++) {
            pistas.push($('pista-' + bi)); tintasM.push($('tinta-m-' + bi)); tintas.push($('tinta-' + bi));
            tintasW.push($('tinta-w-' + bi)); filasB.push($('fila-' + bi));
        }
        var est = { relleno: 0, pliegue: 0, pulso0: 0, pulso1: 0, pulso2: 0 };
        var EIO = gsap.parseEase('power3.inOut');
        function recorte() {
            var p = est.pliegue;
            var eR = EIO(clamp01(p / 0.8)), eV = EIO(clamp01((p - 0.2) / 0.8));
            // barra 440..1580 (r 22) -> casilla 440..500 (r 10), en su misma fila: el pliegue es solo horizontal
            var R = lerp(1580, 500, eR), rr = lerp(22, 10, eV);
            var caja = 'inset(0px ' + (1580 - R).toFixed(2) + 'px 0px 0px round ' + rr.toFixed(2) + 'px)';
            for (var b = 0; b < BARRAS; b++) {
                pistas[b].style.clipPath = caja;
                tintasM[b].style.clipPath = caja;
                // tinta: 5 de 60 min (95 px) -> astilla de 6 px a la izquierda de la casilla (+6 px en el pulso de la cuenta);
                // recorte recto: la mascara le da el radio de la pista o de la casilla del lado izquierdo
                var R0 = 440 + QUINCE * (b === 0 ? est.relleno : 1);
                var Ri = lerp(R0, 446, eR) + 6 * est['pulso' + b];
                tintas[b].style.clipPath = 'inset(0px ' + (1580 - Ri).toFixed(2) + 'px 0px 0px)';
            }
        }
        recorte();
        tl.fromTo(est, { relleno: 0 }, { relleno: 1, duration: 0.4, ease: 'power4.out', onUpdate: recorte, immediateRender: false }, T.relleno);
        // «cada clase»: las barras de Mie y Vie salen de debajo de la de Lun (3 clases por semana, frame.md 10) y sus dias
        // aparecen a la izquierda; la cifra no se mueve
        // escondidas hasta que salen: bajo la barra de Lun, su tinta asomaba por el borde suavizado de la pista
        tl.set([filasB[1], filasB[2]], { visibility: 'hidden' }, 0);
        tl.set([filasB[1], filasB[2]], { visibility: 'visible' }, T.filas);
        // relevo vertical (R2, entrada): cada barra baja a su fila con estela vertical ligada a la velocidad (tope 10), que
        // solo se nota al arrancar y se apaga mucho antes de asentarse; posicion de salida fijada al construir (escondidas)
        gsap.set(filasB[1], { y: -56 }); gsap.set(filasB[2], { y: -112 });
        conRastro({ el: filasB[1], nodo: $('mbf1-g'), at: T.filas, dur: 0.45, curva: 'power3.out', dist: 56, max: 10,
            pos: function (e) { gsap.set(filasB[1], { y: -56 * (1 - e) }); } });
        conRastro({ el: filasB[2], nodo: $('mbf2-g'), at: T.filas + 0.06, dur: 0.5, curva: 'power3.out', dist: 112, max: 10,
            pos: function (e) { gsap.set(filasB[2], { y: -112 * (1 - e) }); } });

        // ================= Escena 3 (2.95-5.45): el pliegue en el semestre y «4 h» =================
        tl.fromTo(est, { pliegue: 0 }, { pliegue: 1, duration: 0.6, ease: 'none', onUpdate: recorte, immediateRender: false }, T.pliegue);
        tl.fromTo([$('h07'), $('h08')], { opacity: 1 }, { opacity: 0, duration: 0.2, ease: 'power2.out' }, T.pliegue);

        // odometro 5 -> 240: derecha -> izquierda, 0.02 s de desfase, todo asentado a 3.50 (expo.out, sin back.out)
        conRastro({ el: tira3, nodo: $('mb3-g'), at: T.cuenta, dur: 0.50, curva: 'expo.out', dist: 20 * H, max: 16,
            pos: function (e) { gsap.set(tira3, { y: -20 * H * e }); } });
        conRastro({ el: tira2, nodo: $('mb2-g'), at: T.cuenta + 0.02, dur: 0.48, curva: 'expo.out', dist: 14 * H, max: 16,
            pos: function (e) { gsap.set(tira2, { y: -14 * H * e }); } });
        conRastro({ el: tira1, nodo: $('mb1-g'), at: T.cuenta + 0.04, dur: 0.46, curva: 'expo.out', dist: 7 * H, max: 16,
            pos: function (e) { gsap.set(tira1, { y: -H - 7 * H * e }); } });
        // «min» se aparta rapido y las columnas nuevas aparecen detras de el: la unidad nunca se encima con la cifra que gira
        tl.fromTo($('min'), { x: 0 }, { x: 2 * PASO, duration: 0.25, ease: 'expo.out', immediateRender: false }, T.cuenta);
        tl.fromTo([$('col2'), $('col3')], { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'power1.in' }, T.cuenta + 0.02);

        // ola de casillas 3..47 (S2 ... S16) de izquierda a derecha (3.25 -> 3.65), cada una con su astilla (que escala con su casilla)
        for (var q = 0; q < piezas.length; q++) {
            if (piezas[q]) { gsap.set(piezas[q], { transformOrigin: '30px 22px' }); }
        }
        for (var i = BARRAS; i < casillas.length; i++) {
            var at = T.ola + (i - BARRAS) / (casillas.length - 1 - BARRAS) * 0.2;
            tl.fromTo([casillas[i].el, piezas[i]], { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.2, ease: 'power3.out' }, at);
        }
        // rotulos en el eje contrario, despues de que la barra pasa
        for (var j = 0; j < rotS.length; j++) {
            tl.fromTo(rotS[j], { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 3.35 + j * 0.012);
        }
        // los dias (Lun, Mie, Vie) entran con sus barras, en «cada clase»
        tl.fromTo(rotD, { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power3.out', stagger: 0.06 }, T.filas + 0.10);

        // cambio de unidad en su sitio: «240 min» sale hacia arriba y «4 h» entra desde abajo (un renglon, estela corta)
        var cambio = $('cambio');
        conRastro({ el: cambio, nodo: $('mbc-g'), at: T.unidad, dur: T.tic4h - T.unidad, curva: 'power3.inOut', dist: H, max: 14,
            pos: function (e) { gsap.set(cambio, { y: -H * e }); } });

        // «= 240 min» desde el desenfoque: la cuenta que la voz no dice; a la vez, la cuenta recorre las 48 astillas (S1 -> S16)
        // con una onda finita que a lo mas duplica la astilla (6 -> 12 px), dentro de la silueta de su casilla
        var cuenta = $('cuenta');
        tl.fromTo(cuenta, { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, T.igual);
        desenfoque(cuenta, T.igual, 0.4, 10, 'power2.out');
        for (var n = 0; n < casillas.length; n++) {
            var tp = T.igual + casillas[n].col * 0.012 + casillas[n].fila * 0.006;
            if (n < BARRAS) {
                var a0 = {}, a1 = {}, b0 = {}, b1 = {};
                a0['pulso' + n] = 0; a1['pulso' + n] = 1; b0['pulso' + n] = 1; b1['pulso' + n] = 0;
                a1.duration = 0.1; a1.ease = 'power2.out'; a1.onUpdate = recorte; a1.immediateRender = false;
                b1.duration = 0.2; b1.ease = 'power2.inOut'; b1.onUpdate = recorte; b1.immediateRender = false;
                tl.fromTo(est, a0, a1, tp);
                tl.fromTo(est, b0, b1, tp + 0.1);
            } else {
                tl.fromTo(nucleos[n], { scaleX: 1 }, { scaleX: 2, duration: 0.1, ease: 'power2.out' }, tp);
                tl.fromTo(nucleos[n], { scaleX: 2 }, { scaleX: 1, duration: 0.2, ease: 'power2.inOut', immediateRender: false }, tp + 0.1);
            }
        }

        // ================= Escena 4 (5.45-6.4): las cuatro horas se vuelven el boton =================
        var grises = pistas.concat([$('rotulos')]);
        for (var g = BARRAS; g < casillas.length; g++) { grises.push(casillas[g].el); }
        tl.fromTo(grises, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, T.junta);
        var cifra = $('cifra');
        gsap.set(cifra, { transformOrigin: (C.x - 420) + 'px ' + (C.y - 338) + 'px' });
        tl.fromTo(cifra, { scale: 1, opacity: 1 }, { scale: 0.6, opacity: 0, duration: 0.4, ease: 'power2.in' }, T.junta);

        // disco de 168 px en tinta plena desde que aparece: nace con 40 px a 5.74 s, cuando las astillas mas cercanas estan
        // a punto de tocarlo, y su radio crece mientras llegan (power2.inOut) hasta el pop de 6.05 s
        var disco = $('disco');
        var RD0 = 20, RD1 = 84, EDISCO = gsap.parseEase('power2.inOut');
        function radioDisco(t) {
            if (t <= T.disco) { return 0; }
            return lerp(RD0, RD1, EDISCO(clamp01((t - T.disco) / (T.ficha - T.disco))));
        }
        var stD = { t: 0 };
        function aplicarDisco() {
            var t = T.disco + stD.t;
            disco.style.clipPath = t >= T.ficha ? 'none' : 'circle(' + radioDisco(t).toFixed(2) + 'px at 84px 84px)';
        }
        aplicarDisco();
        tl.fromTo(stD, { t: 0 }, { t: T.ficha - T.disco, duration: T.ficha - T.disco, ease: 'none', onUpdate: aplicarDisco, immediateRender: false }, T.disco);

        // las 48 astillas vuelan al centro, escalonadas por distancia (<= 0.15 s), por ENCIMA del disco; cada una se apaga
        // en 0.04 s en el instante en que su centro cruza el borde actual del disco (calculado con la misma curva)
        var vuelos = [];
        var dmin = Infinity, dmax = 0;
        for (var v = 0; v < casillas.length; v++) {
            var px = casillas[v].x + 3, py = casillas[v].y + 22;
            var dist = Math.hypot(px - C.x, py - C.y);
            vuelos.push({ i: v, px: px, py: py, dist: dist });
            dmin = Math.min(dmin, dist); dmax = Math.max(dmax, dist);
        }
        var ESC = 0.7, RT = 16, VUELO = 0.45, EV = gsap.parseEase('power3.inOut');
        for (var w = 0; w < vuelos.length; w++) {
            var vu = vuelos[w];
            var ux = (vu.px - C.x) / vu.dist, uy = (vu.py - C.y) / vu.dist;
            var tx = C.x + ux * RT, ty = C.y + uy * RT;       // destino: dentro del radio inicial del disco
            var t0 = T.junta + 0.15 * (vu.dist - dmin) / (dmax - dmin);
            var el, bx, by, ox, oy;
            if (vu.i < BARRAS) {
                // la astilla de una barra plegada: su superficie empieza en (440, fila); origen en su centro
                el = tintasW[vu.i]; bx = 440; by = Y0 + vu.i * (CH + GAP); ox = vu.px - bx; oy = vu.py - by;
                gsap.set(el, { transformOrigin: ox + 'px ' + oy + 'px' });
            } else {
                el = piezas[vu.i]; bx = vu.px - 3; by = vu.py - 22; ox = 30; oy = 22;   // mismo origen que su casilla
            }
            // con origen O, el centro P va a O + s (P - O) + d  =>  d = T - O - s (P - O)
            var Ox = bx + ox, Oy = by + oy;
            var dx = tx - Ox - ESC * (vu.px - Ox), dy = ty - Oy - ESC * (vu.py - Oy);
            tl.fromTo(el, { x: 0, y: 0, scale: 1 }, { x: dx, y: dy, scale: ESC, duration: VUELO, ease: 'power3.inOut', immediateRender: false }, t0);
            // instante en que el centro de la astilla entra al disco (muestreo a 1/600 s; determinista)
            var tc = t0 + VUELO;
            for (var ts = t0; ts <= t0 + VUELO + 1e-9; ts += 1 / 600) {
                var ev = EV(clamp01((ts - t0) / VUELO)), sv = 1 + (ESC - 1) * ev;
                var cx = Ox + sv * (vu.px - Ox) + ev * dx, cy = Oy + sv * (vu.py - Oy) + ev * dy;
                if (Math.hypot(cx - C.x, cy - C.y) <= radioDisco(ts)) { tc = ts; break; }
            }
            tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.04, ease: 'none', immediateRender: false }, tc);
        }

        // icono scan-face solo cuando el disco pasa el 80 % de su radio final; anillo blanco y sombra en su capa; quieta desde 6.20
        var tIcono = T.disco;
        while (tIcono < T.ficha && radioDisco(tIcono) < 0.8 * RD1) { tIcono += 1 / 600; }
        tIcono = Math.round(tIcono * 100) / 100;
        var icono = $('icono');
        tl.fromTo(icono, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: T.quieta - tIcono, ease: 'power3.out' }, tIcono);
        desenfoque(icono, tIcono, T.quieta - tIcono, 4, 'power2.out');
        tl.fromTo($('anillo'), { scale: 168 / 198, opacity: 0 }, { scale: 1, opacity: 1, duration: T.quieta - 5.95, ease: 'power3.out' }, 5.95);
        tl.fromTo($('sombra'), { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: T.quieta - 5.95, ease: 'power3.out' }, 5.95);

        tl.set({}, {}, 6.4);
        window.__timelines = window.__timelines || {};
        window.__timelines['s01-cinco-minutos'] = tl;
    })();
</script>
</template>
