        tl.fromTo($('cifra-1'), { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, T.cifra1);
        tl.fromTo($('cifra-2'), { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, T.cifra2);
        readMark(tl, T.cifra1 + 0.4, '89 %');
        readMark(tl, T.cifra2 + 0.4, '93 %');
        [btn, $('btn-retardo'), $('btn-ausente')].forEach(function (el, i) {
            tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power4.out' }, T.botones + i * 0.06);
        });

        // ---- Escena 3 (3.7–5.8 s): toque sin cursor (press-release-spring sin sobreimpulso) y la consecuencia en cadena:
        // botón → chip → pestaña. Halo de foco 0.15 s antes; compresión lineal a 0.97 en 0.09 s; recuperación power3.out 0.3 s
        // adyacente (misma propiedad, sin hueco: continuidad de estado). El primario pasa por #3A3433 mientras se pulsa.
        tl.fromTo($('foco'), { opacity: 0 }, { opacity: 1, duration: T.presion - T.foco, ease: 'power2.out' }, T.foco);
        tl.fromTo(btn, { backgroundColor: '#1E1919' }, { backgroundColor: '#3A3433', duration: T.presion - T.foco, ease: 'power2.out' }, T.foco);
        tl.fromTo(btn, { scale: 1 }, { scale: 0.97, duration: T.liberacion - T.presion, ease: 'power1.in', immediateRender: false }, T.presion);
        tl.fromTo(btn, { scale: 0.97 }, { scale: 1, duration: 0.3, ease: 'power3.out', immediateRender: false }, T.liberacion);
        tl.fromTo(btn, { backgroundColor: '#3A3433' }, { backgroundColor: '#1E1919', duration: 0.3, ease: 'power2.out', immediateRender: false }, T.liberacion);

        // Cambio de estado +0.05 s: «Pendiente» cede su lugar a «Presente» (mismo hueco, alineados a la derecha).
        tl.fromTo($('chip-pendiente'), { opacity: 1, y: 0 }, { opacity: 0, y: -6, duration: 0.2, ease: 'power2.out' }, T.chip);
        tl.fromTo($('chip-presente'), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }, T.chip);

        // El contador de la pestaña rueda UN renglón de (8) a (7), hacia abajo (cuenta regresiva), power3.out sin rebote.
        tl.fromTo($('pila'), { y: -16 }, { y: 0, duration: T.quieto - T.contador, ease: 'power3.out' }, T.contador);
        readMark(tl, T.quieto, 'Presente');
        readMark(tl, T.quieto, 'Pendientes (7)');

        // Lo no elegido baja al 45 %; el halo de foco se retira (0.4 s) y el escenario vira a violeta subiendo la capa nueva.
        tl.fromTo([$('btn-retardo'), $('btn-ausente')], { opacity: 1 }, { opacity: 0.45, duration: 0.35, ease: 'power2.out', immediateRender: false }, T.secundarios);
        tl.fromTo($('foco'), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power2.inOut', immediateRender: false }, T.focoFuera);
        // «…lo decides tú»: con la cadena ya asentada, la cámara se aleja a la estación completa (escala 1, tarjeta en 1010/610)
        // y queda quieta 0.5 s antes del empuje.
        tl.fromTo($('camara'), { scale: CAM }, { scale: 1, duration: 0.6, ease: 'power3.inOut', immediateRender: false }, T.alejar);
        tl.fromTo($('halo-violeta'), { opacity: 0 }, { opacity: 1, duration: T.fin - T.halo, ease: 'power1.inOut' }, T.halo);

        tl.set({}, {}, T.fin);

        window.__timelines = window.__timelines || {};
        window.__timelines["s04-revision"] = tl;
    })();
</script>
