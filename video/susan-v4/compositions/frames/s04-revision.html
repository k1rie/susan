function camSnap(tl, el, t, escala, o) { return camTo(tl, el, t, { s: escala }, o, 0.18, 'power4.out'); }

/* ---- POSE 3D del objeto de escenario (BRIEF 2026-10-06, SINTESIS 14). El padre del objeto debe tener `perspective` y el objeto

/* ============================ fin del bloque canonico v4 ============================ */

        // Tiempos locales del cuadro (plan/DINAMISMO.md §3 F4). Los que llevan sonido son contrato con sfx_cues (el tween nombrado
        // empieza, termina o tiene su pico ahí): 0.25 whoosh-m (empuje entrante) · 1.90 whoosh-m (instante de cambio del látigo:
        // la lista va a su velocidad máxima y la tarjeta arranca) · 2.40 fill (barra 1) · 3.10 pop-3 (botones) · 3.95 tap
        // (compresión) · 4.00 blip (chip) · 4.40 tick-1 (contador) · 4.80 pop-2 (aviso).
        var T = {
            foco: 0.85,
            salida: 1.60, salidaFade: 1.81, salidaFin: 1.95,
            entrada: 1.85, entradaOpac: 2.03, sombra: 2.20, plana: 2.45,
            barra1: 2.40, barra2: 2.49, cifra1: 2.75, cifra2: 2.84,
            botones: 3.10,
            focoBtn: 3.80, presion: 3.95, liberacion: 4.04, chip: 4.00, chipFuera: 4.08, contador: 4.10, quieto: 4.40,
            secundarios: 4.45, aviso: 4.80, focoFuera: 4.80, halo: 5.10, fin: 5.8
        };
        // El látigo arranca 0.10 s después que en el primer corte: «dudoso» suena de 1.42 a 1.94 s (alineación real de la voz 04) y
        // ningún relevo debe empezar con la palabra recién dicha; la lista arranca despacio (power2.in) y a 1.70 s lleva solo ~8 % del recorrido.
        var LATIGO = { dist: 760, dur: T.salidaFin - T.salida };          // salida: x 0 → −760, power2.in, 0.35 s
        var LLEGADA = { dist: 640, dur: T.plana - T.entrada };           // entrada: x +640 → 0, power3.out, 0.60 s
        var tarjetaMov = $('tarjeta-mov');
        var sombraMov = $('sombra-mov');
        var btn = $('btn-presente');

        // ---- Estela direccional ligada a la velocidad (PILOTO §3c, DINAMISMO §2.0.4): σ = 0.29 · v · OBT con OBT = 1/60 s, en un
        // solo eje, tope por pieza, v = 0 en p ≤ 1e-4 y p ≥ 1 − 1e-4 (GSAP redondea a 6 decimales) y filter:none cuando σ < 0.3.
        // La posición la mueve su propio fromTo (misma curva, inicio y duración, visible para frame-check); este driver puro del
        // tiempo solo escribe el filtro de la hoja interior, nunca el del padre con perspective. `apagar: [p0, p1]` lleva σ a 0
        // con un smoothstep entre p0 y p1: la tarjeta tiene que estar nítida antes del último 35 % de su llegada (DINAMISMO §2.1).

        // la fila activa (`border-foreground bg-accent/50`: borde de tinta y #EFECE7 al 50 % sobre blanco ≈ #F7F6F3); las otras
        // bajan al 45 %, sin desenfoque ni escala. Queda quieta de 1.15 a 1.60 s: «dudoso» (1.26 de ancla, 1.42 dicha) cae con la

        // ---- Escena 2 (1.6–3.7 s): «Te espera en Revisión…». Látigo (R1). La lista entera sale por la izquierda (power2.in: la
        // velocidad máxima llega al final), con UNA hoja con estela para el grupo (tope 16), opacidad → 0 en el último 40 % y
        // autoAlpha 0 al terminar. Con la salida al 71 % entra la tarjeta del caso desde la derecha: la pose suave viaja en el mismo

        // (una sombra plana bajo la tarjeta inclinada deja un doble borde: PILOTO §3b corregido).

        llega(sombraMov);
        tl.fromTo(sombraMov, { opacity: 0 }, { opacity: 1, duration: T.plana - T.sombra, ease: 'power2.out' }, T.sombra);
        readMark(tl, T.plana, 'Quedan 2 h 48 min');

        // 2.40 s, 0.05 s antes de que la tarjeta quede plana: a esa altura le queda ~0.4 px de recorrido y 0.005° de pose); cada cifra 0.35 s
        // después de su barra (2.75 y 2.84 s, antes de «Revisión»), nunca antes. Luego la fila real de botones en cascada
        // (StaggerList: y 14 → 0, 0.5 s, +60 ms). La cámara no se acerca: queda en 1 todo el cuadro.
        var CLIP0 = 'inset(100% 0% 0% 0% round 18px)', CLIP1 = 'inset(0% 0% 0% 0% round 18px)';
        tl.fromTo($('barra-1'), { clipPath: CLIP0 }, { clipPath: CLIP1, duration: 0.6, ease: 'power4.out' }, T.barra1);
        tl.fromTo($('barra-2'), { clipPath: CLIP0 }, { clipPath: CLIP1, duration: 0.6, ease: 'power4.out' }, T.barra2);
        tl.fromTo($('cifra-1'), { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, T.cifra1);
        tl.fromTo($('cifra-2'), { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, T.cifra2);
        readMark(tl, T.cifra1 + 0.4, '89 %');

        });

        // botón → chip → pestaña → aviso. Halo de foco 0.15 s antes; compresión lineal a 0.97 en 0.09 s; recuperación power3.out
        // 0.3 s adyacente (misma propiedad, sin hueco: continuidad de estado). El primario pasa por #3A3433 mientras se pulsa.
        tl.fromTo($('foco'), { opacity: 0 }, { opacity: 1, duration: T.presion - T.focoBtn, ease: 'power2.out' }, T.focoBtn);

        tl.fromTo([$('btn-retardo'), $('btn-ausente')], { opacity: 1 }, { opacity: 0.45, duration: 0.35, ease: 'power2.out', immediateRender: false }, T.secundarios);
